  const unmatched = (parsed.origin && !from) || (parsed.destination && !to);
  if (unmatched){
    html += '<div class="banner warn"><div class="ico">🔎</div><div>' +
      "<h3>" + esc(t("routeUnmatchTitle")) + "</h3>" +
      "<p>" + esc(t("routeUnmatchBody")) + "</p>" + checkedTag + "</div></div>";
  } else if (!from){
    /* destination-only is a supported flow (a saved favourite works from
       anywhere) — it is a missing input, not an undecidable route */
    html += '<div class="banner neutral"><div class="ico">📍</div><div>' +
      "<h3>" + esc(t("routeNoOriginTitle")) + "</h3>" +
      "<p>" + esc(t("routeNoOriginBody")) + "</p>" + checkedTag + "</div></div>";
  } else if (canRouteAround){
    html += '<div class="banner warn"><div class="ico">🔁</div><div>' +
      "<h3>" + esc(tripHeadline("relAltTrip", "relAltTitle")) + "</h3>" +
      "<p>" + esc(t(clearThrough ? "relAltBodyDirect" : "relAltBody")) + "</p>" +
      tripStrip(from, to, hits[0]) +
      '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' + hitList() + "</ul>" + checkedTag + "</div></div>";
  } else if (hits.length){
    /* a congestion forecast is not a disruption — do not shout about it */
    const onlyNotices = !hits.some(l => l.status === "alert");
    html += '<div class="banner ' + (onlyNotices ? "warn" : "bad") + '"><div class="ico">' +
      (onlyNotices ? "❓" : "🚨") + "</div><div>" +
      ("<h3>" + esc(onlyNotices ? t("relCheckTitle")
                                 : tripHeadline("relTrip", "relTitle")) + "</h3>") +
      "<p>" + esc(onlyNotices ? t("relCheckBody") : t("relBody")) + "</p>" +
      tripStrip(from, to, hits[0]) +
      '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' + hitList() + "</ul>" +
      /* every rail option is disrupted — the ports don't care. Two conditions:
         a scan must have run (the port list needs a position), and the trip
         must actually start near that position. The share-cycle section lists
         ports around the scan point, so offering it to someone whose origin is
         50 km away would repeat the mistake the 「別の駅から」 block made. */
      (!onlyNotices && state.position && nearScanPoint(from)
        ? '<p style="margin-top:8px"><button type="button" class="linkbtn" id="bikeAltBtn">🚲 ' +
          esc(t("bikeAltBtn")) + "</button></p>"
        : "") +
      checkedTag + "</div></div>";
  } else if (!directIds.length){
    /* no single line joins the two ends — without a journey planner we cannot
       know which lines the trip would use, so we must not claim either way */
    html += '<div class="banner neutral"><div class="ico">🔀</div><div>' +
      "<h3>" + esc(t("transferTitle")) + "</h3>" +
      "<p>" + esc(other.length ? t("transferBody") : t("transferNone")) + "</p>" + checkedTag + "</div></div>";
  } else {
    /* 小田急・相鉄・ゆりかもめ publish route data but no service information at
       all. Answering 👍「関係ありません」 for a trip made entirely of those lines
       would be a claim we have no basis for — say plainly that it cannot be
       judged, and let the route panel below still show how to get there. */
    const anyChecked = directLines.some(l => l.status !== "nodata");
    /* 「影響する遅延はありません」 was decided from the operator's prose alone,
       while the line card right below it printed 「走行中 36本・遅れ 23本・
       最大 9分遅れ」 from odpt:Train. On an ordinary evening six lines were
       publishing 平常運転 with trains 5–11 minutes late, 池袋→新宿 among them.
       Same threshold the notification already uses (5 minutes), so the two
       halves of the app now call the same thing a delay. */
    const late = directLines.filter(l => l.live && l.live.max >= TRAIN_LATE_SEC);
    /* Some of the ways there are late and some are not — that is the 🔁 shape,
       not the ⏱ one: nothing is stopping the trip, there is simply a better
       platform to stand on. Only when every candidate is late does the trip
       itself run late. */
    const anyClearLive = clearThroughLive > 0 || clearTransferLive > 0;
    if (late.length && anyClearLive){
      html += '<div class="banner warn"><div class="ico">🔁</div><div>' +
        "<h3>" + esc(tripHeadline("relAltTrip", "relAltTitle")) + "</h3>" +
        "<p>" + esc(t("relAltBodyLate")) + "</p>" +
        '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' +
        late.map(l => "<li><strong>" + esc(titleOf(l.title, humanizeId(l.railwayId))) + "</strong> " +
          esc(t("lateLine", { total:l.live.total, delayed:l.live.delayed, max:fmtDelayMin(l.live.max) })) +
          "</li>").join("") + "</ul>" + checkedTag + "</div></div>";
    } else if (late.length){
      html += '<div class="banner warn"><div class="ico">⏱️</div><div>' +
        "<h3>" + esc(tripHeadline("lateTrip", "lateTitle")) + "</h3>" +
        "<p>" + esc(t("lateBody")) + "</p>" +
        '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' +
        late.map(l => "<li><strong>" + esc(titleOf(l.title, humanizeId(l.railwayId))) + "</strong> " +
          esc(t("lateLine", { total:l.live.total, delayed:l.live.delayed, max:fmtDelayMin(l.live.max) })) +
          "</li>").join("") + "</ul>" + checkedTag + "</div></div>";
    } else if (anyChecked){
      html += '<div class="banner ok"><div class="ico">👍</div><div>' +
        "<h3>" + esc(tripHeadline("norelTrip", "norelTitle")) + "</h3><p>" + esc(t("norelNoDelay")) + "</p>" +
        tripStrip(from, to, null) +
        checkedTag + "</div></div>";
    } else {
      html += '<div class="banner neutral"><div class="ico">ℹ️</div><div>' +
        "<h3>" + esc(t("routeNoInfoTitle")) + "</h3><p>" + esc(t("routeNoInfoBody")) + "</p>" +
        checkedTag + "</div></div>";
    }
  }

  /* disruptions at either end that the trip may or may not touch */
  if (other.length){
    html += '<div class="banner warn" style="margin-top:10px"><div class="ico">ℹ️</div><div>' +
      "<h3>" + esc(t("refTitle")) + "</h3><p>" + esc(t("refBody")) + "</p>" +
      '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' +
      other.map(l => "<li><strong>" + esc(titleOf(l.title, humanizeId(l.railwayId))) + "</strong>" +
        infoSummaryHtml(l.railwayId, l.info, "margin-top:5px") +
        origTextHtml(l.info, "margin-top:5px") +
        "</li>").join("") + "</ul></div></div>";
  }

  /* the point of the app is not the verdict but what to do next */
  /* One link for the trip, not one per card. Every train card here is the same
     origin and the same destination — the cards differ by which line to ride,
     which is precisely what the URL cannot carry — so a link on each would be
     three buttons that all do the same thing. The 「別の駅から」 rows keep their
     own: those really do start somewhere else. */
  /* Filled by renderHowTo, which is the only thing that knows which lines the
     offered routes actually run on. Empty until then, and empty for good when
     no middle line has anything to say. */
  html += '<div id="routeNotice"></div>';

  html += '<h2 class="section">' + esc(t("howtoTitle")) + "</h2>" +
          (from && to
            ? '<div class="hint" style="margin:0 0 8px">' + esc(t("mapsHint")) +
              mapsRouteLink(from.name, to.name) + "</div>"
            : "") +
          '<div id="howto" class="list"></div>';

  html += '<h2 class="section">' + esc(t("routeLines")) + "</h2>" +
    '<div class="hint" style="margin:0 0 6px">' + esc(t("routeChipHint")) + "</div>" +
    '<div class="list">' +
    endpoint("routeFrom", parsed.origin, from) +
    endpoint("routeTo",   parsed.destination, to) +
    "</div>" +
    '<p class="hint">' + esc(t("routeCaveat")) + "</p>";

  if (myTurn !== routeCheckSeq) return;
  out.innerHTML = html;
  syncStaffButtons();

  /* 迂回できないときだけ、周辺の路線図へ戻す道を出す */
  const jump = $("#railMapJump");
  if (jump) jump.classList.toggle("hidden",
    !(state.routeVerdict && state.routeVerdict.affected && $("#railMapSvg")));
  const bikeBtn = out.querySelector("#bikeAltBtn");
  if (bikeBtn) bikeBtn.addEventListener("click", () => {
    const sect = $("#sectBike");
    if (sect){
      foldByUser.add("#sectBike");                      // asked for by name; the default no longer applies
      sect.open = true;                                 // the toggle event fetches the ports
      goStep(5, { force:true });
    }
  });
  renderHowTo(from, to, index);
  if (state.lines.length) withScrollAnchor($("#routeCard"), render);   // station verdicts
  loadBusReach().then(() => {
    if (myTurn !== routeCheckSeq) return;
    withScrollAnchor($("#routeCard"), renderBus);
    markBusDestinations();
    renderHowTo(from, to, index);
  }).catch(() => { if (myTurn === routeCheckSeq) renderHowTo(from, to, index); });
  markBusDestinations();
  if (opts && opts.scroll) goStep(4, { force:true });
}

/* ------------------------- favourite destinations ---------------------- */
/* Only the destination is stored: the origin is filled in from wherever the
   user happens to be, so a saved "Haneda Airport" works from anywhere. */
let favs = [];
let originFavs = [];
/* Same storage story as the language (see detectLang): under file:// with a
   fresh query string every launch, localStorage is not dependable. The
   language moved to the Android side after testers lost it; favourites shared
   the failure mode, so they live there too. localStorage stays as the browser
   path and as migration source for favourites saved before this existed. */
function loadFavs(){
  let raw = "";
  try{
    if (window.AndroidApp && window.AndroidApp.getFavorites) raw = window.AndroidApp.getFavorites() || "";
  }catch(e){}
  const fromBridge = !!raw;
  if (!raw){ try{ raw = localStorage.getItem("tdr.favs") || ""; }catch(e){} }
  let parsed = null;
  try{ parsed = JSON.parse(raw || "[]"); }catch(e){ parsed = null; }
  /* Destinations were stored as a bare array. Origins joined later, so the
     shape became {to:[…], from:[…]} — the old array still loads as before. */
  if (Array.isArray(parsed)) { favs = parsed; originFavs = []; }
  else if (parsed && typeof parsed === "object") {
    favs = Array.isArray(parsed.to) ? parsed.to : [];
    originFavs = Array.isArray(parsed.from) ? parsed.from : [];
  } else { favs = []; originFavs = []; }
  const clean = a => a.filter(x => typeof x === "string" && x.trim()).slice(0, 12);
  favs = clean(favs); originFavs = clean(originFavs);
  if (!fromBridge && (favs.length || originFavs.length)) saveFavs();   // one-time migration
}
function saveFavs(){
  const json = JSON.stringify({ to: favs, from: originFavs });
  try{
    if (window.AndroidApp && window.AndroidApp.setFavorites) window.AndroidApp.setFavorites(json);
  }catch(e){}
  try{ localStorage.setItem("tdr.favs", json); }catch(e){}
}
/* Two boxes, so nobody has to type an arrow. A Google Maps URL pasted into
   either box still carries both ends, and「新宿 → 品川」typed into one box
   keeps working for anyone used to it. */
function routeFields(){
  const a = ($("#routeFrom").value || "").trim();
  const b = ($("#routeTo").value || "").trim();
  for (const v of [b, a]){
    if (/^https?:\/\//i.test(v)) return parseRouteInput(v);
  }
  if (!b && a && /(?:→|⇒|->|=>|~|〜|＞|>|,|、|;|から|to)/i.test(a)) return parseRouteInput(a);
  if (!a && !b) return { error:"empty" };
  return { origin:a, destination:b };
}
function routeOrigin(){
  const p = routeFields();
  return (p && !p.error && p.origin) ? p.origin : "";
}
function renderFavs(){
  const box = $("#routeFavs");
  if (!box) return;
  box.innerHTML = favs.length
    ? favs.map((name,i) =>
        '<span class="chip fav"><button type="button" class="favuse" data-fav="' + i + '">' +
          esc(name) + '</button><button type="button" class="favdel" data-del="' + i + '" title="' +
          esc(t("favRemove")) + '">×</button></span>').join("")
    : '<span class="hint" style="margin:0">' + esc(t("favEmpty")) + "</span>";
  updateFavBtn();
}
/* Origins get the same treatment destinations already had: a ☆ button beside
   the box, chips under it, one tap to reuse, × to drop. The saved places from
   the Android settings screen (📍) are a different thing — those are managed
   on another screen and drive the notifications; these are the page's own. */
function renderFromFavs(){
  const box = $("#routeFromFavs");
  if (!box) return;
  box.innerHTML = originFavs.length
    ? originFavs.map((name,i) =>
        '<span class="chip fav"><button type="button" class="favuse" data-fav="' + i + '">' +
          esc(name) + '</button><button type="button" class="favdel" data-del="' + i + '" title="' +
          esc(t("favRemove")) + '">×</button></span>').join("")
    : '<span class="hint" style="margin:0">' + esc(t("favFromEmpty")) + "</span>";
  updateFavBtn();
}
/* The offer appears under the box that was just filled and asks; taking it
   makes it disappear, because a saved thing is already shown as a chip below.
   A permanently parked button that read 「★ 登録済み」 was a control with
   nothing left to do, sitting where the eye expects an action. */
function updateFavBtn(){
  const offer = (box, value, list, add) => {
    if (!box) return;
    const show = !!value && list.indexOf(value) < 0;
    box.classList.toggle("hidden", !show);
    if (!show){ box.innerHTML = ""; return; }
    box.innerHTML = '<button type="button">☆ ' + esc(t("favOffer", { name: value })) + "</button>";
    box.firstChild.onclick = add;
  };
  offer($("#favToOffer"), routeDestination(), favs, toggleFav);
  offer($("#favFromOffer"), routeOrigin(), originFavs, toggleFromFav);
}
function toggleFromFav(){
  const orig = routeOrigin();
  if (!orig) return;          // the offer only exists once there is a value
  if (originFavs.indexOf(orig) >= 0) return;    // already saved; the chip's × removes it
  originFavs.unshift(orig);
  originFavs = originFavs.slice(0, 12);
  saveFavs(); renderFromFavs();
}
/* Reusing a saved origin means scanning there — same as picking it from the
   suggestions, so the surroundings follow the origin as everywhere else. */
async function useFromFav(name){
  /* same wait as typing, and the same reason to say so */
  if (!cache.stationIndex) setStatus($("#scanStatus"), t("hitsLoading"), "busy");
  const idx = await getStationIndex().catch(() => null);
  const p = idx ? searchPlaces(name)[0] : null;
  if (p) { scanPlace(p); return; }
  $("#routeFrom").value = name;
  /* the scanning path re-judges, so it takes care of itself; this one only
     fills the box, and without this the previous trip's verdict stayed up */
  clearStaleVerdict();
  updateFavBtn(); updateTripBar();
}
function toggleFav(){
  const dest = routeDestination();
  if (!dest){ setStatus($("#routeStatus"), t("favNeedDest"), "err"); return; }
  if (favs.indexOf(dest) >= 0) return;          // already saved; the chip's × removes it
  favs.unshift(dest);
  favs = favs.slice(0, 12);
  saveFavs();
  renderFavs();
}
/* Same rule as picking from the suggestions: choosing the destination is the
   action, and the action is the check. */
function useFav(name){
  const origin = routeOrigin() ||
    (state.stations && state.stations.length
      ? titleOf(state.stations[0]["odpt:stationTitle"], state.stations[0]["dc:title"]) : "");
  if (origin) $("#routeFrom").value = origin;
  $("#routeTo").value = name;
  clearStaleVerdict();
  updateFavBtn();
  updateTripBar();
  syncActions();
  setStatus($("#routeStatus"), t("routeReady"), "");
}

/* The stations between two points are already in odpt:Railway's stationOrder,
   with multilingual names — no extra request is needed. A loop line repeats its
   terminus as the last entry, which is how it can be detected. */
function railwaySegment(rid, fromIds, toIds){
  const rw = cache.railwayById.get(rid) || {};
  const order = rw["odpt:stationOrder"] || [];
  if (order.length < 2) return null;
  const sorted = order.slice().sort((a,b) => (a["odpt:index"] || 0) - (b["odpt:index"] || 0));
  const ids = sorted.map(o => o["odpt:station"]);
  const loop = ids.length > 2 && ids[0] === ids[ids.length - 1];
  const ring = loop ? ids.slice(0, -1) : ids;
  const i = ring.findIndex(id => fromIds.has(id));
  const j = ring.findIndex(id => toIds.has(id));
  if (i < 0 || j < 0 || i === j) return null;

  let seq = [];
  if (loop){
    const fwd = (j - i + ring.length) % ring.length;
    const bwd = (i - j + ring.length) % ring.length;
    const n = Math.min(fwd, bwd), step = fwd <= bwd ? 1 : -1;
    for (let k = 0; k <= n; k++) seq.push(ring[(i + step * k + ring.length * 2) % ring.length]);
  } else {
    seq = i < j ? ring.slice(i, j + 1) : ring.slice(j, i + 1).reverse();
  }
  const titleById = new Map(sorted.map(o => [o["odpt:station"], o["odpt:stationTitle"] || null]));
  return seq.map(id => {
    const tt = titleById.get(id);
    return { id, title:tt, ja:(tt && tt.ja) || humanizeId(id) };
  });
}

/* --- loop lines: the other way round may avoid the trouble --------------
   A ring line offers two ways between the same two stations. When the service
   information names the affected section (odpt:stationFrom/To, or a range like
   「品川〜取手駅間」), we can say which way avoids it. */
function railwayRing(rid){
  const rw = cache.railwayById.get(rid) || {};
  const order = (rw["odpt:stationOrder"] || []).slice()
    .sort((a,b) => (a["odpt:index"] || 0) - (b["odpt:index"] || 0));
  if (order.length < 2) return null;
  const ids = order.map(o => o["odpt:station"]);
  const loop = ids.length > 2 && ids[0] === ids[ids.length - 1];
  return {
    loop,
    ring: loop ? ids.slice(0, -1) : ids,
    titleById: new Map(order.map(o => [o["odpt:station"], o["odpt:stationTitle"] || null]))
  };
}
function ringStation(r, id){
  const tt = r.titleById.get(id);
  return { id, title:tt, ja:(tt && tt.ja) || humanizeId(id) };
}
/* both ways round, longer one included */
function railwayDirections(rid, fromIds, toIds){
  const r = railwayRing(rid);
  if (!r) return [];
  const i = r.ring.findIndex(id => fromIds.has(id));
  const j = r.ring.findIndex(id => toIds.has(id));
  if (i < 0 || j < 0 || i === j) return [];
  const build = step => {
    const out = [];
    for (let k = 0; ; k++){
      const idx = (i + step * k + r.ring.length * 4) % r.ring.length;
      out.push(r.ring[idx]);
      if (idx === j) break;
      if (k > r.ring.length) return null;
    }
    return out;
  };
  if (!r.loop){
    const seq = i < j ? r.ring.slice(i, j + 1) : r.ring.slice(j, i + 1).reverse();
    return [{ ids:seq, stations:seq.map(id => ringStation(r, id)), hops:seq.length - 1 }];
  }
  return [build(1), build(-1)].filter(Boolean)
    .map(ids => ({ ids, stations:ids.map(id => ringStation(r, id)), hops:ids.length - 1 }))
    .sort((a,b) => a.hops - b.hops);
}
/* which stations the operator says are affected — null when it does not say */
function disruptedSpan(rid, info){
  const r = railwayRing(rid);
  if (!r) return null;
  const span = (a, b) => {
    const i = r.ring.indexOf(a), j = r.ring.indexOf(b);
    if (i < 0 || j < 0) return null;
    const lo = Math.min(i, j), hi = Math.max(i, j);
    return new Set(r.ring.slice(lo, hi + 1));
  };
  if (info && info.stationFrom && info.stationTo){
    const set = span(info.stationFrom, info.stationTo);
    if (set) return set;
  }
  /* 「品川〜取手駅間」 — the names come from the same dataset, so they match */
  const src = ((info && info.range) || "") + " " + ((info && info.text) || "");
  const m = src.match(/([^\s、。（(]{2,12})[〜～]([^\s、。（(]{2,12}?)駅?間/);
  if (m){
    const a = normLoose(m[1]), b = normLoose(m[2]);
    const byName = id => normLoose(ringStation(r, id).ja);
    const ia = r.ring.find(id => byName(id) === a), ib = r.ring.find(id => byName(id) === b);
    if (ia && ib) return span(ia, ib);
  }
  /* The operator named no section — but the trains themselves say where they
     are. Take the stations the late ones are sitting between. Only what is
     actually reported is marked, never a filled range: on a ring line the
     stretch between the lowest and highest index is the wrong way round half
     the time, and claiming a clear direction is affected is worse than saying
     nothing. */
  const g = liveFor(rid);
  if (g && g.late.length){
    const set = new Set();
    g.late.forEach(x => {
      if (x.from && r.ring.indexOf(x.from) >= 0) set.add(x.from);
      if (x.to   && r.ring.indexOf(x.to)   >= 0) set.add(x.to);
    });
    if (set.size) return set;
  }
  return null;
}

/* ---------------- "how do I actually get there" panel ------------------ */
/* No journey planner exists in ODPT, so only what can be stated truthfully:
   lines that serve both ends without a change, and buses whose route passes a
   stop near the user and reaches the destination. */
/* Is the trip starting near where the scan happened? Anything the scan
   collected — ports, bus stops, nearby lines — describes that place and not
   the typed origin. Same 1.2 km rule loadBusReach uses for fromHere. */
function nearScanPoint(from){
  if (!state.position) return false;
  if (!from) return true;                 // no origin typed: the scan point is the origin
  const st = (from.stations || []).find(x => x["geo:lat"] && x["geo:long"]);
  if (!st) return true;                   // cannot tell — do not hide a working link
  return haversine(state.position.lat, state.position.lon,
                   st["geo:lat"], st["geo:long"]) < 1200;
}

/* The stations you could walk to from a given point, in the shape the scan
   produces. stationGroups is the scan's answer and belongs to the scan point;
   when a route origin is typed it can be somewhere else entirely — 大網 while
   the last scan was 新宿 — and offering "新宿, 60 m" to someone in 大網 is
   nonsense 58 km wide. Cheap: one pass over ~2,000 stations. */
function stationsNear(lat, lon, radiusM, limit){
  if (!isFinite(lat) || !isFinite(lon)) return [];
  const groups = [];
  for (const st of (cache.stationIndex || [])){
    const y = st["geo:lat"], x = st["geo:long"];
    if (!y || !x) continue;
    const d = haversine(lat, lon, y, x);
    if (d > radiusM) continue;
    const name = titleOf(st["odpt:stationTitle"], st["dc:title"]);
    let g = groups.find(v => normName(v.name) === normName(name) && Math.abs(v.d - d) < 700);
    if (!g){
      g = { name, ja:st["dc:title"] || "", d, lat:y, lon:x, codes:[], railways:[], own:[] };
      groups.push(g);
    }
    if (d < g.d){ g.d = d; g.lat = y; g.lon = x; }
    const rid = st["odpt:railway"];
    if (rid && g.own.indexOf(rid) < 0) g.own.push(rid);
    [rid].concat(st["odpt:connectingRailway"] || []).forEach(r => {
      if (r && g.railways.indexOf(r) < 0) g.railways.push(r);
    });
  }
  groups.sort((a, b) => a.d - b.d);
  return groups.slice(0, limit || 6);
}

/* The same pill as everywhere else, just tighter — an alternative route puts
   it inline after a sentence rather than at the end of a row.
   NOT named statusPill: there is already one of those, and a second function
   declaration of the same name silently replaces it for the whole script.
   That is what happened when this was added — the scan's line list started
   printing 「情報提供なし」 over 運転見合わせ. */
/* The route drawn from the stations themselves.

   Every station's position is in the index and the line's stationOrder gives
   the sequence, so joining the dots is the whole of it — no tiles, no key, no
   request. That matters: tile.openstreetmap.org forbids exactly this kind of
   use ("Bulk downloading is strictly prohibited", offline and distribution
   features "not permitted", and they may block without notice), and a
   commercial provider would mean another key to keep out of the repository and
   another host to depend on.

   No basemap under it either. Rivers and ward boundaries are not what the
   reader is asking about — the shape of the line is. 和光市→立川 through 新宿
   dives southeast and comes back west; the same trip through 朝霞台 arcs
   straight across. That is visible without a single street.

   Straight between stations, since the operators publish no track geometry —
   a schematic, and honest about being one. */
/* Web Mercator, in the 0..1 square the whole world occupies, because that is
   the grid the tiles are cut on. */
function mercPt(p){
  const s = Math.sin(p.lat * Math.PI / 180);
  return { wx: (p.lon + 180) / 360,
           wy: 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI) };
}
/* the drawable legs: each one a line id and the stations it calls at */
function mapRuns(parts){
  const g = stationGeoMap();
  return (parts || []).map(pt => ({
    rid: pt.rid,
    pts: ((pt.dir && pt.dir.stations) || [])
      .map(st => { const c = g.get(st.id); return c ? { ja: st.ja, title: st.title, lat: c.lat, lon: c.lon } : null; })
      .filter(Boolean)
  })).filter(r => r.pts.length > 1);
}
/* A view is where the world sits behind the picture: the world coordinate at
   the top-left corner, and how many picture-pixels one unit of world is worth.
   Panning moves the corner; zooming changes the pixels. */
function fitView(runs, W, H, pad){
  const all = [].concat.apply([], runs.map(r => r.pts)).map(mercPt);
  const x0 = Math.min.apply(null, all.map(v => v.wx)), x1 = Math.max.apply(null, all.map(v => v.wx));
  const y0 = Math.min.apply(null, all.map(v => v.wy)), y1 = Math.max.apply(null, all.map(v => v.wy));
  const spanX = x1 - x0, spanY = y1 - y0;
  if (!spanX && !spanY) return null;
  const per = Math.min(spanX ? (W - pad * 2) / spanX : Infinity,
                       spanY ? (H - pad * 2) / spanY : Infinity);
  return { x0: x0 - (W - spanX * per) / 2 / per,
           y0: y0 - (H - spanY * per) / 2 / per,
           per: per, w: W, h: H };
}
/* z16 is as close as this goes. Past that the tiles are a street plan the route
   crosses in three strides, and every step in costs another set of images on
   somebody's mobile connection. */
const MAP_MAX_PER = 256 * Math.pow(2, 16);

/* The <image> tags covering a view. Kept apart from the drawing because the
   drawing is built once and the tiles arrive later — and, in the large map,
   again after every pinch. */
/* 標準地図, not 淡色. The pale sheet is quieter, but roads have no colour and
   the railways are barely there — and the railways are what this picture is
   about. The standard sheet draws them, names places more legibly, and costs
   nothing extra: same terms, same grid, no key. It is louder, so the CSS
   below turns it down further than the pale one ever needed. */
const GSI_TILE = "https://cyberjapandata.gsi.go.jp/xyz/std/";
function tileList(v){
  if (!v || !v.per) return [];
  const z = Math.max(2, Math.min(16, Math.round(Math.log2(v.per / 256))));
  const n = Math.pow(2, z), size = v.per / n;
  const tx0 = Math.floor(v.x0 * n), ty0 = Math.floor(v.y0 * n);
  const tx1 = Math.floor((v.x0 + v.w / v.per) * n), ty1 = Math.floor((v.y0 + v.h / v.per) * n);
  const out = [];
  for (let x = tx0; x <= tx1; x++){
    for (let y = ty0; y <= ty1; y++){
      if (x < 0 || y < 0 || x >= n || y >= n) continue;
      out.push({ key: z + "/" + x + "/" + y, url: GSI_TILE + z + "/" + x + "/" + y + ".png",
                 x: (x / n - v.x0) * v.per, y: (y / n - v.y0) * v.per, size: size });
    }
  }
  return out;
}
function tileMarkup(v){
  return tileList(v).map(t =>
    '<image href="' + t.url + '" x="' + t.x.toFixed(2) + '" y="' + t.y.toFixed(2) +
    '" width="' + t.size.toFixed(2) + '" height="' + t.size.toFixed(2) +
    '" preserveAspectRatio="none"/>').join("");
}
/* Panning must not throw the images away and ask for them again. Keyed by
   z/x/y, the tiles already on screen stay exactly where they are and only the
   ones coming over the edge are created — no flicker, no refetch. */
function syncTiles(g, v){
  const want = tileList(v);
  const have = new Map();
  Array.prototype.forEach.call(g.children, n => have.set(n.getAttribute("data-k"), n));
  want.forEach(tl => {
    let n = have.get(tl.key);
    if (n) have.delete(tl.key);
    else {
      n = document.createElementNS("http://www.w3.org/2000/svg", "image");
      n.setAttribute("data-k", tl.key);
      n.setAttribute("href", tl.url);
      n.setAttribute("preserveAspectRatio", "none");
      g.appendChild(n);
    }
    n.setAttribute("x", tl.x.toFixed(2));
    n.setAttribute("y", tl.y.toFixed(2));
    n.setAttribute("width", tl.size.toFixed(2));
    n.setAttribute("height", tl.size.toFixed(2));
  });
  have.forEach(n => n.remove());
}

/* The route itself, drawn for a given view. k scales the ink: the small figure
   is a 320-wide viewBox stretched across the card, the large one is drawn at
   the screen's own pixels, so the same numbers would come out thin there. */
function mapBody(runs, v, opts){
  const o = opts || {};
  const k = o.k || 1;
  const X = p => (mercPt(p).wx - v.x0) * v.per;
  const Y = p => (mercPt(p).wy - v.y0) * v.per;
  const nameOf = p => titleOf(p.title, p.ja);
  let body = "", hurt = false;
  runs.forEach(r => {
    const rw = cache.railwayById.get(r.rid) || {};
    const colour = rw["odpt:color"] || "var(--muted)";
    const st = lineInfo(r.rid).status;
    const pts = r.pts.map(p => X(p).toFixed(1) + "," + Y(p).toFixed(1)).join(" ");
    body += '<polyline fill="none" stroke="' + esc(colour) + '" stroke-width="' + (4.5 * k) +
            '" stroke-linecap="round" stroke-linejoin="round" points="' + pts + '"/>';
    /* a leg on a disrupted line is drawn over in red dashes, so the picture
       says which part of the journey the notice is about */
    if (st === "alert" || st === "unknown"){
      hurt = true;
      body += '<polyline fill="none" stroke="var(--bad)" stroke-width="' + (4.5 * k) +
              '" stroke-dasharray="' + (7 * k) + " " + (6 * k) + '" stroke-linecap="round" ' +
              'stroke-linejoin="round" points="' + pts + '"/>';
    }
    r.pts.slice(1, -1).forEach(p => {
      body += '<circle cx="' + X(p).toFixed(1) + '" cy="' + Y(p).toFixed(1) + '" r="' + (1.9 * k) +
              '" fill="var(--surface)" stroke="' + esc(colour) + '" stroke-width="' + (1.3 * k) + '"/>';
    });
  });

  /* Labels go down one at a time and are skipped where they would land on one
     already written. On the small figure only the three that matter fit; on a
     full screen the stations in between can be named too, and the same check
     is what stops them piling into each other. */
  const placed = [];
  const fs = 9.5 * k;
  const fits = (x, y, txt, anchor) => {
    const wpx = txt.length * fs * 0.95;
    const box = { x: anchor === "end" ? x - wpx : x, y: y - fs, w: wpx, h: fs * 1.5 };
    if (box.x < 0 || box.x + box.w > v.w || box.y < 0 || box.y + box.h > v.h) return false;
    if (placed.some(q => !(box.x + box.w < q.x || q.x + q.w < box.x ||
                           box.y + box.h < q.y || q.y + q.h < box.y))) return false;
    placed.push(box);
    return true;
  };
  const label = (p, txt, dy, force) => {
    const x = X(p), y = Y(p) + dy, anchor = x > v.w / 2 ? "end" : "start";
    const tx = x + (anchor === "end" ? -6 * k : 6 * k);
    const ok = fits(tx, y, txt, anchor);
    if (!ok && !force) return "";
    return '<text x="' + tx.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + fs.toFixed(1) +
      '" font-weight="700" text-anchor="' + anchor + '" fill="var(--text)" ' +
      'style="paint-order:stroke;stroke:var(--surface);stroke-width:' + (3.5 * k) +
      ';stroke-linejoin:round">' + esc(txt) + "</text>";
  };
  const mark = (p, r, fill) =>
    '<circle cx="' + X(p).toFixed(1) + '" cy="' + Y(p).toFixed(1) + '" r="' + (r * k) +
    '" fill="' + fill + '" stroke="var(--surface)" stroke-width="' + (1.8 * k) + '"/>';

  const lastRun = runs[runs.length - 1];
  const first = runs[0].pts[0], last = lastRun.pts[lastRun.pts.length - 1];
  let marks = "", names = "";
  runs.slice(0, -1).forEach(r => {
    const p = r.pts[r.pts.length - 1];
    marks += mark(p, 3.4, "var(--warn)");
    names += label(p, nameOf(p), -6 * k, true);
  });
  /* Arrival is green, not red. Red is already saying "this leg is disrupted" on
     the same picture, and one colour cannot mean both. */
  marks += mark(first, 4.2, "var(--accent)") + mark(last, 4.2, "var(--ok)");
  names += label(first, nameOf(first), 13 * k, true) + label(last, nameOf(last), 13 * k, true);
  /* the stations passed through, once there is a screen big enough for them */
  if (o.labels === "all")
    runs.forEach(r => r.pts.slice(1, -1).forEach(pp => { names += label(pp, nameOf(pp), -7 * k, false); }));
  return { body: body + marks + names, hurt: hurt };
}

/* A page can hold six of these at once, and url(#id) resolves against the whole
   document — one shared id would point every clip at the first drawing's. */
let routeMapSeq = 0;
/* the legs behind each drawing, so tapping one can open that route full screen */
let mapFigures = [];
/* ===================== the same route, as a diagram =====================

   A route map is not a map. It keeps the order of the stations and the turns
   between them, and throws the distances away — which is exactly what can be
   built from what this app already holds: the running order from
   odpt:Railway, the operator's colour, and the station numbers people actually
   read off the signs. No route-map coordinates are published anywhere, so
   nothing is copied and nothing breaks when an operator redraws its own.

   The station numbers are the reason this exists. A visitor standing on a
   platform is matching M08 against a sign, not a station name in a script they
   cannot read. */
let stationCodes = null, stationCodesFor = null;
function stationCodeMap(){
  if (stationCodes && stationCodesFor === cache.stationIndex) return stationCodes;
  const m = new Map();
  (cache.stationIndex || []).forEach(st => {
    const id = st["owl:sameAs"], c = st["odpt:stationCode"];
    if (id && c && !m.has(id)) m.set(id, c);
  });
  /* an empty one is a fetch that has not landed, not an answer */
  if (m.size){ stationCodes = m; stationCodesFor = cache.stationIndex; }
  return m;
}

/* One list of stations for the whole trip, with the leg's colour on each.

   An interchange is one dot when both legs call it by the same name, and two
   dots joined by a dashed link when they do not — 朝霞台 and 北朝霞 are a walk
   apart, and a diagram that pretends otherwise is lying about the trip. */
function schemaPath(parts){
  const geo = stationGeoMap(), codes = stationCodeMap();
  const out = [];
  (parts || []).forEach((pt, li) => {
    const rw = cache.railwayById.get(pt.rid) || {};
    const colour = rw["odpt:color"] || "var(--muted)";
    const st0 = lineInfo(pt.rid).status;
    const bad = st0 === "alert" || st0 === "unknown";
    const list = (pt.dir && pt.dir.stations) || [];
    list.forEach((st, i) => {
      const c = geo.get(st.id);
      if (!c) return;
      const last = out[out.length - 1];
      if (li && i === 0 && last && normName(last.ja) === normName(st.ja)){
        last.change = true;                       // the same platform, once
        return;
      }
      out.push({ ja: st.ja, title: st.title, code: codes.get(st.id) || "",
                 lat: c.lat, lon: c.lon, colour: colour, bad: bad,
                 walk: !!(li && i === 0),          // reached on foot from the last dot
                 change: i === list.length - 1 && li < parts.length - 1 });
    });
  });
  /* the turns, rounded to the eight directions a route map is drawn in */
  let x = 0, y = 0;
  if (out.length) { out[0].x = 0; out[0].y = 0; }
  for (let i = 1; i < out.length; i++){
    const a = out[i - 1], b = out[i];
    const dx = (b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180);
    const dy = -(b.lat - a.lat);
    const ang = (dx || dy) ? Math.atan2(dy, dx) : 0;
    const snap = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
    x += Math.cos(snap); y += Math.sin(snap);
    b.x = x; b.y = y;
  }
  return out;
}

/* opts.fit: squeeze into W x H (the thumbnail). Otherwise natural size and let
   the container scroll, which is how a route map is meant to be read. */
function schemaSvg(parts, W, H, opts){
  const o = opts || {};
  const path = schemaPath(parts);
  if (path.length < 2) return null;
  const xs = path.map(p => p.x), ys = path.map(p => p.y);
  const spanX = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  const spanY = Math.max.apply(null, ys) - Math.min.apply(null, ys);
  const nameOf = p => titleOf(p.title, p.ja);
  /* The margins are measured, not chosen.

     A dot carries a number to one side and a name to the other, and on a
     stretch that runs across the picture the name is turned 45 degrees, which
     throws it as far up as it is long. Fixed margins were fine until a route
     began with 和光市 at the top of the drawing: the turned name went to -13
     and a dozen number chips sat on the y=0 line, all of them cut off. The
     numbers here come from the longest name and the longest code actually in
     this route, so the picture always has room for what it draws. */
  const fsName = o.fit ? 11.5 : 14, fsCode = o.fit ? 9.5 : 11;
  const longest = (f) => path.reduce((m, q) => Math.max(m, (f(q) || "").length), 0);
  const nameW = longest(nameOf) * fsName * 0.95;      // CJK glyphs run about 1em
  const chipW = longest(q => q.code) * (fsCode * 0.62) + 8;
  const chipH = fsCode + 5;
  const padR = Math.ceil(nameW + 22);
  const padL = Math.ceil(chipW + 18);
  /* a turned name reaches up (or down) by its length times cos 45 */
  const padT = Math.ceil(o.fit ? chipH + 18 : nameW * 0.72 + chipH + 14);
  const padB = padT;
  /* How far apart two neighbouring stations are drawn.

     The thumbnail shrinks to fit its box. The full screen used to hold a fixed
     46 and let the canvas grow past the stage instead, which is right for a
     thirty-station route — it becomes something to scroll — but wrong for a
     short one: 東京→新宿 is five stations, and at a fixed 46 it drew a diagram
     the size of a postage stamp in the middle of a phone screen, with the
     turned names piled on top of each other because they do not shrink with
     it. So the full screen grows to fill as well, and only stops growing when
     the picture is already comfortable. */
  const UMAX = o.fit ? 34 : 46;
  const UBIG = 130;
  let u = UMAX;
  const fitW = spanX ? (W - padL - padR) / spanX : Infinity;
  const fitH = spanY ? (H - padT - padB) / spanY : Infinity;
  if (o.fit){
    u = Math.min(fitW, fitH, UMAX);
    u = Math.max(u, 11);
  } else {
    /* never smaller than before, so a long route still overflows and scrolls */
    u = Math.max(UMAX, Math.min(fitW, fitH, UBIG));
  }
  const w = Math.max(W, spanX * u + padL + padR);
  const h = Math.max(H, spanY * u + padT + padB);
  const ox = padL + (w - padL - padR - spanX * u) / 2 - Math.min.apply(null, xs) * u;
  const oy = padT + (h - padT - padB - spanY * u) / 2 - Math.min.apply(null, ys) * u;
  const X = p => ox + p.x * u, Y = p => oy + p.y * u;
  const showAll = !o.fit || u >= 24;

  let body = "", hurt = false;
  /* one stroke per stretch of the same colour, so the change of line is the
     change of colour, at the dot where it happens */
  let seg = [], cur = null;
  const flush = () => {
    if (seg.length > 1){
      const d = seg.map((p, i) => (i ? "L" : "M") + X(p).toFixed(1) + " " + Y(p).toFixed(1)).join(" ");
      body += '<path d="' + d + '" fill="none" stroke="' + esc(cur.colour) + '" stroke-width="' +
              (o.fit ? 5 : 7) + '" stroke-linecap="round" stroke-linejoin="round"/>';
      if (cur.bad){
        hurt = true;
        body += '<path d="' + d + '" fill="none" stroke="var(--bad)" stroke-width="' +
                (o.fit ? 5 : 7) + '" stroke-linecap="round" stroke-linejoin="round" ' +
                'stroke-dasharray="' + (o.fit ? "7 6" : "10 8") + '"/>';
      }
    }
    seg = [];
  };
  path.forEach((p, i) => {
    if (p.walk){                                   // a walk, not a ride
      flush();
      const a = path[i - 1];
      if (a) body += '<path d="M' + X(a).toFixed(1) + " " + Y(a).toFixed(1) + "L" +
                     X(p).toFixed(1) + " " + Y(p).toFixed(1) + '" fill="none" stroke="var(--faint)" ' +
                     'stroke-width="2.5" stroke-dasharray="3 4" stroke-linecap="round"/>';
      cur = p; seg = [p];
      return;
    }
    if (!cur || p.colour !== cur.colour){ flush(); cur = p; seg = [path[i - 1], p].filter(Boolean); }
    else seg.push(p);
  });
  flush();

  /* Which way the line is running through this dot. On a stretch that runs
     across the picture the names have to leave it — set upright to the right
     they collide with each other after three stations. Every route map in the
     world turns them 45 degrees at that point, and so does this one. */
  const runDir = i => {
    const a = path[Math.max(0, i - 1)], b = path[Math.min(path.length - 1, i + 1)];
    return { dx: b.x - a.x, dy: b.y - a.y };
  };
  path.forEach((p, i) => {
    const big = i === 0 || i === path.length - 1 || p.change || p.walk;
    const cx = X(p), cy = Y(p), r = big ? (o.fit ? 6.5 : 8.5) : (o.fit ? 3.6 : 4.6);
    const d = runDir(i);
    /* Upright to the right only works where the line runs down the picture.
       Anywhere else the names lie along it and collide, so they are turned to
       cross it — one way on a descending diagonal, the other on a rising one. */
    const flat = Math.abs(d.dx) >= Math.abs(d.dy);
    const turn = (d.dx * d.dy < 0) ? 45 : -45;
    /* Which side of the dot the name goes, decided once. The chip then takes
       the other side — that was always the intent ("opposite side from the
       name, so the two never argue"), but the two were asking different
       questions: the name compared cx against the longest name in the route,
       the chip against a hard-coded 92. Every dot that fell between the two
       answers got its name and its number stacked in the same spot, which is
       how 東京 and JC01, and 神田 and JC02, came to be drawn on top of each
       other with the chip hiding the name completely. */
    const nameLeft = cx + nameW + 14 > w;
    body += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r +
            '" fill="var(--surface)" stroke="var(--text)" stroke-width="' + (big ? 3 : 2.2) + '"/>';
    /* In the thumbnail an intermediate dot gets its number and not its name.
       320x190 has no room for both: 東京→新宿 drew five names and five chips
       into it and JC02 covered 87% of 四ツ谷. The number is the compact half,
       and the half a reader holds up against the sign on the platform, so that
       is the one that stays. Ends and interchanges keep both — they are the
       dots the reader is looking for. */
    if (big || (showAll && !o.fit)){
      const fs = big ? (o.fit ? 11.5 : 14) : (o.fit ? 10 : 12.5);
      const common = ' font-size="' + fs + '" font-weight="' + (big ? 800 : 600) +
                     '" fill="var(--text)" stroke="var(--bg)" stroke-width="3" paint-order="stroke"';
      /* Turned names only in the full drawing. In the thumbnail they would run
         off the edge, and there only the ends and the interchanges are named
         anyway — few enough to lay flat, and flipped to the inside when the dot
         is near the right edge. */
      if (flat && !o.fit){
        const lx = cx + r + 4, ly = turn < 0 ? cy - r - 4 : cy + r + 4 + fs;
        body += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" transform="rotate(' + turn + " " +
                lx.toFixed(1) + " " + ly.toFixed(1) + ')"' + common + ">" + esc(nameOf(p)) + "</text>";
      } else {
        body += '<text x="' + (nameLeft ? cx - r - 6 : cx + r + 6).toFixed(1) + '" y="' + (cy + 4.5).toFixed(1) +
                '" text-anchor="' + (nameLeft ? "end" : "start") + '"' + common + ">" + esc(nameOf(p)) + "</text>";
      }
    }
    if (p.code && (big || showAll)){
      const fs = o.fit ? 9.5 : 11;
      const tw = p.code.length * (fs * 0.62) + 8, th = fs + 5;
      /* opposite side from the name, so the two never argue */
      const turned = flat && !o.fit;
      const bx = turned ? cx - tw / 2 : (nameLeft ? cx + r + 6 : cx - r - 6 - tw);
      const by = turned ? (turn < 0 ? cy + r + 4 : cy - r - 4 - th) : cy - th / 2;
      body += '<g transform="translate(' + bx.toFixed(1) + "," + by.toFixed(1) + ')">' +
              '<rect width="' + tw.toFixed(1) + '" height="' + th + '" rx="3.5" fill="' + esc(p.colour) + '"/>' +
              '<text x="' + (tw / 2).toFixed(1) + '" y="' + (fs + 0.5) + '" text-anchor="middle" font-size="' + fs +
              '" font-weight="800" fill="#fff">' + esc(p.code) + "</text></g>";
    }
  });
  return { body: body, w: Math.round(w), h: Math.round(h), u: u, hurt: hurt };
}

/* The diagram is read by running along it, not by flying over it, so it grows
   and shrinks in place and the box scrolls. It opens at its natural size —
   that is the size the names are legible at, and being able to read them is
   the whole reason it exists. The ⤢ shows the whole thing at once. */
let schemaScale = 1, schemaNat = null;
function applySchemaScale(){
  const box = $("#mapSchema"), svg = box && box.querySelector("svg");
  if (!svg || !schemaNat) return;
  svg.setAttribute("width", Math.round(schemaNat.w * schemaScale));
  svg.setAttribute("height", Math.round(schemaNat.h * schemaScale));
}
/* cx/cy are where the fingers are: that point stays put while the rest grows
   around it, which is what makes a pinch feel like a pinch. */
function zoomSchema(f, cx, cy){
  const box = $("#mapSchema");
  if (!box || !schemaNat) return;
  const was = schemaScale;
  schemaScale = Math.max(0.35, Math.min(4, schemaScale * f));
  if (schemaScale === was) return;
  const r = box.getBoundingClientRect();
  const ax = cx == null ? r.width / 2 : cx - r.left;
  const ay = cy == null ? r.height / 2 : cy - r.top;
  const px = (box.scrollLeft + ax) / was, py = (box.scrollTop + ay) / was;
  applySchemaScale();
  box.scrollLeft = px * schemaScale - ax;
  box.scrollTop  = py * schemaScale - ay;
}
function fitSchema(){
  const box = $("#mapSchema");
  if (!box || !schemaNat) return;
  schemaScale = Math.max(0.35, Math.min(box.clientWidth / schemaNat.w,
                                        box.clientHeight / schemaNat.h, 1));
  applySchemaScale();
  centreSchema();
}
/* The drawing sits in the middle of its canvas, and for a route long enough to
   need scrolling that canvas is larger than the window onto it. Opening at the
   top-left corner therefore opens on the margin: 和光市→立川 filled the screen
   with empty ground and left the line below the fold, which reads as a broken
   picture rather than a scrollable one. Start in the middle — then whatever the
   shape of the route, some of it is on screen to scroll away from. */
function centreSchema(){
  const box = $("#mapSchema");
  if (!box) return;
  box.scrollLeft = Math.max(0, (box.scrollWidth  - box.clientWidth)  / 2);
  box.scrollTop  = Math.max(0, (box.scrollHeight - box.clientHeight) / 2);
}

/* Which of the two the reader last chose. One switch for the whole page: two
   pictures of the same trip in two different shapes is the confusion the
   switch exists to remove. */
let mapMode = "geo";
try{ if (localStorage.getItem("mapMode") === "schema") mapMode = "schema"; }catch(e){}
function setMapMode(m){
  mapMode = (m === "schema") ? "schema" : "geo";
  try{ localStorage.setItem("mapMode", mapMode); }catch(e){}
  document.body.setAttribute("data-mapmode", mapMode);
  redrawFigures();
  if (bigMap) paintBig(bigMap.idx);
}
function modeSwitch(){
  const b = (m, key) => '<button type="button" data-mode="' + m + '" aria-pressed="' +
    (mapMode === m) + '">' + esc(t(key)) + "</button>";

/* The thumbnails are already on the page, and each remembers which route it

function redrawFigures(){
  $$(".mapwrap").forEach(w => {
    const btn = w.querySelector(".mapexpand");
    const idx = btn ? Number(btn.getAttribute("data-map")) : -1;
    const parts = mapFigures[idx];
    if (!parts) return;
    const inner = figureInner(parts, idx);
    if (inner){
      w.innerHTML = inner;

}
let routeMapSeq2 = 0;
function figureInner(parts, idx){

    const d = schemaSvg(parts, W, H, { fit:true });
    if (!d) return "";
    return '<svg class="routemap schema" viewBox="0 0 ' + d.w + " " + d.h + '" width="100%" ' +
      'role="img" aria-label="' + esc(t("routeMapAlt")) + '" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="' + d.w + '" height="' + d.h + '" rx="10" fill="var(--surface2)"/>' +
      d.body + "</svg>" + modeSwitch() +

      esc(t("mapExpand")) + '">\u2922</button>';

  const runs = mapRuns(parts);

  const view = fitView(runs, W, H, 32);

  const clipId = "rmclip" + (++routeMapSeq2) + "x" + idx;
  const drawn = mapBody(runs, view, { k: 1, labels: "ends" });
  return '<svg class="routemap" viewBox="0 0 ' + W + " " + H + '" width="100%" ' +
      'role="img" aria-label="' + esc(t("routeMapAlt")) + '" xmlns="http://www.w3.org/2000/svg" ' +
      "data-view='" + esc(JSON.stringify(view)) + "'>" +

      '<g class="tiles" clip-path="url(#' + clipId + ')"></g>' +

      drawn.body + "</svg>" + modeSwitch() +

      esc(t("mapExpand")) + '">\u2922</button>';

function routeMapFigure(parts){
  const runs = mapRuns(parts);
  if (!runs.length) return "";
  const idx = mapFigures.push(parts) - 1;
  /* Which of the two shapes gets drawn is decided in figureInner, so the
     switch on the picture can redraw it later without any of this running
     again. The tiles are still filled lazily, when the details opens. */
  const inner = figureInner(parts, idx);
  if (!inner) return "";
  const wrap = '<div class="mapwrap">' + inner + "</div>";
  const drawn = { hurt: runs.some(r => {
    const st = lineInfo(r.rid).status;
    return st === "alert" || st === "unknown";
  }) };

  /* The legend is HTML, not part of the drawing. The SVG scales with the card
     width, so text inside it grows on a wide screen; the legend has to stay at
     the size of the rest of the page.
     Only what is actually on this picture is listed — the red entry appears
     when a leg is drawn red, and not otherwise. A legend for something that is
     not there sends the reader looking for it. */
  const key = (swatch, txt) => '<span>' + swatch + esc(txt) + "</span>";
  const dotKey = (v, txt) => key('<i style="background:var(--' + v + ')"></i>', t(txt));
  let legend = dotKey("accent", "mapKeyFrom");
  if (runs.length > 1) legend += dotKey("warn", "mapKeyVia");
  legend += dotKey("ok", "mapKeyTo");
  /* the dashes drawn the same way the map draws them, rather than as a styled
     box: a 3px-tall <i> kept coming out 34px, and chasing which rule won that
     argument is not worth it when the shape can simply be drawn */
  if (drawn.hurt)
    legend += key('<svg width="20" height="6" viewBox="0 0 20 6" aria-hidden="true">' +
      '<line x1="1.5" y1="3" x2="18.5" y2="3" stroke="var(--bad)" stroke-width="3" ' +
      'stroke-linecap="round" stroke-dasharray="5 4"/></svg>', t("mapKeyBad"));
  /* the attribution the licence asks for, with the link it asks for */
  legend += '<span class="mapcredit"><a href="https://maps.gsi.go.jp/development/ichiran.html"' +
    (location.protocol === "file:" ? "" : ' target="_blank" rel="noopener noreferrer"') +
    ">" + esc(t("mapCredit")) + "</a></span>";
  /* the large map borrows this legend rather than building a second one */
  const modal = $("#mapModal");
  if (modal) modal.dataset.legend = legend;
  return wrap + '<div class="maplegend">' + legend + "</div>";
}

/* 「約42 km」. Ten kilometres and up the decimal says nothing. */
/* The pale 地理院タイル under the drawing.

   Free, no key, and the terms ask only for the attribution: 「ウェブサイトや
   ソフトウェア、アプリケーション上でリアルタイムに読み込んで利用する場合、
   地理院タイルは出典の明示のみで申請不要」. So the credit below the map is not
   decoration — it is the whole of the licence.

   Painted faintly and behind everything: the reader is looking at a route, and
   the map is there to say roughly where in the city that is. If a tile fails
   to load the picture is exactly what it was before. */
function fillMapTiles(svg){
  if (!svg || svg.dataset.tiled) return;
  let v;
  try{ v = JSON.parse(svg.dataset.view || ""); }catch(e){ return; }
  if (!v || !v.per) return;
  const g = svg.querySelector(".tiles");
  if (!g) return;
  svg.dataset.tiled = "1";
  g.innerHTML = tileMarkup(v);
}
/* Only the drawing the reader just opened fetches anything. */
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!d || d.tagName !== "DETAILS" || !d.open) return;
  d.querySelectorAll("svg.routemap[data-view]").forEach(fillMapTiles);
}, true);

/* ------------------------- the map, full screen ------------------------ */
/* The small drawing answers "which way does this go". This answers "where is
   that", which needs room, and room means the whole screen: a map that pans
   inside a scrolling page cannot tell a drag meant for it from a drag meant for
   the page. Full screen removes the question — nothing else is scrolling. */
let bigMap = null;      // { runs, view, rv, fit, minPer }

/* Rebuilding the whole drawing on every frame of a drag is what made it stutter:
   forty polyline points restrung, the labels re-placed, and — the expensive part
   — every tile <image> destroyed and made again, which is a new raster each time
   even when the bytes are in cache.

   A map does not work that way. The picture that is already on screen is moved
   with one transform while the finger is down, and only when the gesture settles
   is it drawn again at the new place. rv is the view the DOM currently holds;
   view is where the finger has got to. */
function renderBigMap(){
  if (!bigMap || bigMap.schema) return;
  const svg = $("#mapBig"), v = bigMap.view;
  svg.setAttribute("viewBox", "0 0 " + v.w + " " + v.h);
  let tiles = $("#mapTiles"), ink = $("#mapInk");
  if (!tiles || !ink){
    svg.innerHTML = '<g id="mapTiles"></g><g id="mapInk"></g>';
    tiles = $("#mapTiles"); ink = $("#mapInk");
  }
  syncTiles(tiles, v);
  ink.innerHTML = mapBody(bigMap.runs, v, { k: 1.7, labels: "all" }).body;
  bigMap.rv = Object.assign({}, v);
  tiles.removeAttribute("transform");
  ink.removeAttribute("transform");
}
/* one attribute write per frame instead of a rebuild */
function nudgeBigMap(){
  if (!bigMap || bigMap.schema || !bigMap.rv) return;
  const v = bigMap.view, r = bigMap.rv;
  const k = v.per / r.per;
  const tr = "translate(" + ((r.x0 - v.x0) * v.per).toFixed(2) + "," +
             ((r.y0 - v.y0) * v.per).toFixed(2) + ") scale(" + k.toFixed(6) + ")";
  const tiles = $("#mapTiles"), ink = $("#mapInk");
  if (tiles) tiles.setAttribute("transform", tr);
  if (ink) ink.setAttribute("transform", tr);
}
let bigMapFrame = 0, bigMapSettle = null;
function moveBigMap(){
  if (bigMapFrame) return;
  bigMapFrame = requestAnimationFrame(() => { bigMapFrame = 0; nudgeBigMap(); });
}
/* Drawn again once the hand has stopped. Immediately on lift, and after a pause
   for the wheel, which has no lift. */
function settleBigMap(delay){
  clearTimeout(bigMapSettle);
  bigMapSettle = setTimeout(() => { if (bigMap) renderBigMap(); }, delay || 0);
}
/* zoom about a point, so whatever is under the fingers stays under them */
function zoomBigMap(px, py, factor){
  if (!bigMap || bigMap.schema) return;
  const v = bigMap.view;
  const per = Math.max(bigMap.minPer, Math.min(MAP_MAX_PER, v.per * factor));
  if (per === v.per) return;
  v.x0 = v.x0 + px / v.per - px / per;
  v.y0 = v.y0 + py / v.per - py / per;
  v.per = per;
  moveBigMap();
}
function panBigMap(dx, dy){
  if (!bigMap || bigMap.schema) return;
  bigMap.view.x0 -= dx / bigMap.view.per;
  bigMap.view.y0 -= dy / bigMap.view.per;
  moveBigMap();
}
/* Painting is separate from opening, so switching between the map and the
   diagram redraws what is already on screen instead of closing and reopening
   it — which would leave a stray entry in the history. */
function paintBig(idx){
  const parts = mapFigures[idx];
  if (!parts) return false;
  const stage = $("#mapStage"), big = $("#mapBig"), box = $("#mapSchema"), tools = $(".maptools");
  $("#mapModeHead").innerHTML = modeSwitch();
  if (mapMode === "schema"){
    const d = schemaSvg(parts, stage.clientWidth || 360, stage.clientHeight || 480, { fit:false });
    if (!d) return false;
    big.classList.add("hidden");
    if (tools) tools.classList.remove("hidden");     // ＋ − ⤢ work here too
    box.classList.remove("hidden");
    box.innerHTML = '<svg width="' + d.w + '" height="' + d.h + '" viewBox="0 0 ' + d.w + " " + d.h +
      '" xmlns="http://www.w3.org/2000/svg"><rect width="' + d.w + '" height="' + d.h +
      '" fill="var(--surface)"/>' + d.body + "</svg>";
    schemaNat = { w:d.w, h:d.h };
    schemaScale = 1;
    applySchemaScale();
    centreSchema();
    bigMap = { schema:true, idx:idx };
    return true;
  }
  box.classList.add("hidden");
  box.innerHTML = "";
  big.classList.remove("hidden");
  if (tools) tools.classList.remove("hidden");
  return openGeoMap(idx);
}
function openGeoMap(idx){
  const parts = mapFigures[idx];
  const runs = parts && mapRuns(parts);
  if (!runs || !runs.length) return false;
  const stage = $("#mapStage"), modal = $("#mapModal");
  const r = stage.getBoundingClientRect();
  const W = Math.max(120, Math.round(r.width)), H = Math.max(120, Math.round(r.height));
  const view = fitView(runs, W, H, 34);
  if (!view){ modal.classList.add("hidden"); return false; }
  /* Zooming in about the centre walks away from the route, and at street level
     there is nothing on screen to steer by. Keep the view that showed the whole
     journey so one press can always get back to it. */
  bigMap = { runs: runs, view: view, fit: Object.assign({}, view), minPer: view.per * 0.4, idx: idx };
  $("#mapBig").innerHTML = "";
  const ends = runs[runs.length - 1].pts;
  $("#mapTitle").textContent = titleOf(runs[0].pts[0].title, runs[0].pts[0].ja) + " \u2192 " +
                               titleOf(ends[ends.length - 1].title, ends[ends.length - 1].ja);
  $("#mapFoot").innerHTML = $("#mapModal").dataset.legend || "";
  renderBigMap();
  return true;
}
function openBigMap(idx){
  const modal = $("#mapModal");
  modal.classList.remove("hidden");
  const parts = mapFigures[idx];
  if (parts){
    const runs = mapRuns(parts);
    const ends = runs.length ? runs[runs.length - 1].pts : [];
    if (runs.length)
      $("#mapTitle").textContent = titleOf(runs[0].pts[0].title, runs[0].pts[0].ja) + " \u2192 " +
                                   titleOf(ends[ends.length - 1].title, ends[ends.length - 1].ja);
  }
  if (!paintBig(idx)){ modal.classList.add("hidden"); return; }
  /* so the phone's back button closes the map instead of leaving the page.
     Counted with the page pushes: "go home" undoes the whole stack, and the
     map's entry is part of it. */
  try{ history.pushState({ bigMap:1, step:step }, ""); stepPushes++; }catch(e){}
}
function closeBigMap(fromHistory){
  /* Not `|| bigMap.schema`. Closing is the one thing both kinds of picture do
     the same way, and a blanket edit that fenced off the geographic machinery
     took this with it — the × on the diagram did nothing at all. */
  if (!bigMap) return;
  bigMap = null;
  clearTimeout(bigMapSettle);
  $("#mapModal").classList.add("hidden");
  $("#mapBig").innerHTML = "";
  $("#mapSchema").innerHTML = "";

}
window.addEventListener("popstate", e => {
  /* one entry left the stack either way, so the count comes down either way */
  stepPushes = Math.max(0, stepPushes - 1);
  /* our own unwind landing: the page is already home, and the entry we landed
     on may name a different one */
  if (goingHome){
    goingHome = false;
    clearTimeout(goingHomeTimer);
    stepPushes = 0;
    goStep(1, { fromHistory:true, force:true });
    return;
  }
  if (bigMap){ closeBigMap(true); return; }
  const st = e.state;
  goStep(st && st.step ? st.step : 1, { fromHistory:true, force:true });

document.addEventListener("keydown", e => { if (e.key === "Escape" && bigMap) closeBigMap(); });

/* opening: the handle on the drawing, or the drawing itself */
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest(".mapexpand");
  if (btn){ e.preventDefault(); openBigMap(Number(btn.dataset.map)); return; }
  const svg = e.target.closest && e.target.closest("svg.routemap");
  if (svg){
    const w = svg.parentElement && svg.parentElement.querySelector(".mapexpand");
    if (w) openBigMap(Number(w.dataset.map));
  }
});

/* ---- gestures ---- */
(function(){
  const stage = $("#mapStage");
  if (!stage) return;
  const at = (t, r) => ({ x: t.clientX - r.left, y: t.clientY - r.top });
  let drag = null, pinch = null;
  const gap = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

  stage.addEventListener("touchstart", e => {
    if (!bigMap || bigMap.schema) return;
    clearTimeout(bigMapSettle);
    if (e.touches.length === 1){ drag = { x: e.touches[0].clientX, y: e.touches[0].clientY }; pinch = null; }
    else if (e.touches.length >= 2){
      drag = null;
      const r = stage.getBoundingClientRect();
      const m = at(e.touches[0], r), n = at(e.touches[1], r);
      pinch = { d: gap(e.touches[0], e.touches[1]), x: (m.x + n.x) / 2, y: (m.y + n.y) / 2 };
    }
  }, { passive: true });

  stage.addEventListener("touchmove", e => {
    if (!bigMap || bigMap.schema) return;
    e.preventDefault();                       // the page must not scroll under it
    if (pinch && e.touches.length >= 2){
      const d = gap(e.touches[0], e.touches[1]);
      if (pinch.d > 0 && d > 0){ zoomBigMap(pinch.x, pinch.y, d / pinch.d); pinch.d = d; }
      return;
    }
    if (drag && e.touches.length === 1){
      const t = e.touches[0];
      panBigMap(t.clientX - drag.x, t.clientY - drag.y);
      drag = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  stage.addEventListener("touchend", e => {
    if (e.touches.length === 0){ drag = null; pinch = null; settleBigMap(0); }
  }, { passive: true });

  /* mouse and wheel, for a browser */
  stage.addEventListener("mousedown", e => {
    if (!bigMap || bigMap.schema) return;
    clearTimeout(bigMapSettle);
    drag = { x: e.clientX, y: e.clientY };
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => {
    if (!bigMap || bigMap.schema || !drag) return;
    panBigMap(e.clientX - drag.x, e.clientY - drag.y);
    drag = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener("mouseup", () => { if (drag){ drag = null; settleBigMap(0); } });
  stage.addEventListener("wheel", e => {
    if (!bigMap || bigMap.schema) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomBigMap(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.25 : 1 / 1.25);
    settleBigMap(180);                        // the wheel never lifts
  }, { passive: false });

  const step = f => () => {
    if (bigMap && bigMap.schema){ zoomSchema(f, null, null); return; }
    if (!bigMap) return;
    zoomBigMap(bigMap.view.w / 2, bigMap.view.h / 2, f);
    settleBigMap(140);
  };
  $("#mapFit").addEventListener("click", () => {
    if (bigMap && bigMap.schema){ fitSchema(); return; }
    if (!bigMap) return;
    bigMap.view = Object.assign({}, bigMap.fit);
    moveBigMap();
    settleBigMap(140);
  });
  $("#mapZoomIn").addEventListener("click", step(1.6));
  $("#mapZoomOut").addEventListener("click", step(1 / 1.6));
  $("#mapClose").addEventListener("click", () => closeBigMap());

  /* Pinch on the diagram. One finger still scrolls it — touch-action keeps
     pan for the browser and leaves the two-finger case to us. */
  const box = $("#mapSchema");
  if (box){
    const pts = new Map();
    let base = 0, baseScale = 1;
    const mid = () => {
      const a = Array.from(pts.values());
      return { x:(a[0].clientX + a[1].clientX) / 2, y:(a[0].clientY + a[1].clientY) / 2,
               d:Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY) };
    };
    box.addEventListener("pointerdown", e => {
      if (!bigMap || !bigMap.schema) return;
      pts.set(e.pointerId, e);
      if (pts.size === 2){ base = mid().d; baseScale = schemaScale; }
    });
    box.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, e);
      if (pts.size === 2 && base){
        const m = mid();
        if (!m.d) return;
        zoomSchema((baseScale * (m.d / base)) / schemaScale, m.x, m.y);
        e.preventDefault();
      }
    }, { passive:false });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) base = 0; };
    box.addEventListener("pointerup", up);
    box.addEventListener("pointercancel", up);
    box.addEventListener("wheel", e => {
      if (!bigMap || !bigMap.schema) return;
      e.preventDefault();
      zoomSchema(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
    }, { passive:false });
  }
})();

/* ---------------- next departures, and what the ride costs --------------

   Both hang off the route cards, and both arrive after the cards are drawn:
   the card is built from data already in hand, and these two are fetched for
   whatever ended up on screen. A card with neither simply reads as it did
   before — nothing waits for them. */

/* Weekday or SaturdayHoliday, and the operator's own special days. A public
   holiday falling on a Tuesday runs the holiday timetable, and the day-of-week
   alone would get that wrong; the operators publish the dates. */
async function getCalendars(){
  if (cache.calendars) return cache.calendars;
  return shareInflight("calendars", async () => {
    if (cache.calendars) return cache.calendars;
    const chunks = await Promise.all([
      odpt("pub", "odpt:Calendar", null, { timeout:30000 }).catch(() => []),
      odpt("chl", "odpt:Calendar", null, { timeout:30000 }).catch(() => [])
    ]);
    const all = [].concat.apply([], chunks);
    if (all.length) cache.calendars = all;
    return all;
  });
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function calendarPicker(){
  const iso = todayKey(), day = new Date().getDay();
  const special = new Set();
  (cache.calendars || []).forEach(c => {
    if ((c["odpt:day"] || []).indexOf(iso) >= 0) special.add(c["owl:sameAs"]);
  });
  const generic = (day === 0 || day === 6) ? "SaturdayHoliday" : "Weekday";
  return cal => {
    if (!cal) return 0;
    if (special.has(cal)) return 2;                 // the operator named today
    return cal.indexOf(generic) >= 0 ? 1 : 0;
  };
}
/* Which of the timetables at this station goes the way we are going. The record
   carries a direction id we have no dictionary for, so judge it by where its
   trains end up: on the line's own running order, are the destinations on the
   same side of us as the next station of our leg? */
function timetableFacing(list, rid, fromId, nextId){
  const r = railwayRing(rid);
  if (!r) return list[0] || null;
  const idx = id => r.ring.indexOf(id);
  const here = idx(fromId), next = idx(nextId);
  if (here < 0 || next < 0) return list[0] || null;
  const wanted = Math.sign(next - here);
  let best = null, bestScore = -1;
  list.forEach(tt => {
    const objs = tt["odpt:stationTimetableObject"] || [];
    let hit = 0, seen = 0;
    objs.forEach(o => {
      const dests = o["odpt:destinationStation"] || [];
      dests.forEach(d => {
        const di = idx(d);
        if (di < 0 || di === here) return;
        seen++;
        if (Math.sign(di - here) === wanted) hit++;
      });
    });
    const score = seen ? hit / seen : 0;
    if (score > bestScore){ bestScore = score; best = tt; }
  });
  return bestScore > 0.5 ? best : null;
}
const depCache = new Map();
/* the day's timetable for this platform, fetched once and shared */
async function todaysTimetable(rid, fromId, nextId){
  const key = rid + "|" + fromId;
  if (!depCache.has(key)){
    depCache.set(key, (async () => {
      await getCalendars().catch(() => []);
      for (const src of ["pub", "chl"]){
        try{
          const d = await odpt(src, "odpt:StationTimetable",
            { "odpt:station": fromId, "odpt:railway": rid }, { timeout:30000 });
          if (d.length) return d;
        }catch(e){}
      }
      return [];
    })());
  }
  const all = await depCache.get(key);
  if (!all.length) return null;
  const rank = calendarPicker();
  const best = Math.max.apply(null, all.map(x => rank(x["odpt:calendar"])));
  const today = all.filter(x => rank(x["odpt:calendar"]) === best);
  return timetableFacing(today, rid, fromId, nextId) || null;
}

async function nextDepartures(rid, fromId, nextId, n, fromMin){
  const tt = await todaysTimetable(rid, fromId, nextId);
  if (!tt) return null;
  /* The clock this is measured against. Normally now; for someone who has not
     landed yet it is the minute they expect to reach the platform, which is a
     time in the future and possibly after midnight. */
  const mins = fromMin == null
    ? (new Date().getHours() * 60 + new Date().getMinutes())
    : fromMin;
  const parsed = (tt["odpt:stationTimetableObject"] || [])
    .map(o => {
      const t = String(o["odpt:departureTime"] || "");
      const m = /^(\d{1,2}):(\d{2})$/.exec(t);
      if (!m) return null;
      /* after midnight the timetable keeps counting in the small hours */
      let at = Number(m[1]) * 60 + Number(m[2]);
      if (at < mins - 180) at += 24 * 60;
      return { at, text: t, type: o["odpt:trainType"] || "",
               dest: (o["odpt:destinationStation"] || [])[0] || "" };
    })
    .filter(Boolean)
    .sort((a, b) => a.at - b.at);
  const rows = parsed.filter(x => x.at >= mins);
  return rows.length ? rows.slice(0, n || 3) : null;
}

/* "Is there anything left tonight" is a different question from "what leaves
   next", and it needs a different clock.

   The rule above — anything more than three hours behind belongs to tomorrow —
   is right for "next", and wrong for "last of the day": measured from 20:20 it
   promoted an afternoon 17:12 departure into tomorrow, which made it the
   largest number in the list and therefore the last train. The card said the
   last train was 17:12, three hours before the reader was standing there.

   A railway day is not midnight to midnight; it runs from about four in the
   morning until the small hours. Count in those terms and every case falls
   out: 00:08 becomes 24:08 and is genuinely the last train, 02:10 on the
   platform becomes 26:10 and is after all of them, and an afternoon departure
   stays in the afternoon where it belongs. */
const SERVICE_DAY_START = 240;                 // 04:00
const serviceMin = m => (m % 1440) < SERVICE_DAY_START ? (m % 1440) + 1440 : (m % 1440);
async function departuresFrom(rid, fromId, nextId, fromMin){
  const tt = await todaysTimetable(rid, fromId, nextId);
  if (!tt) return null;
  const all = (tt["odpt:stationTimetableObject"] || [])
    .map(o => {
      const text = String(o["odpt:departureTime"] || "");
      const m = /^(\d{1,2}):(\d{2})$/.exec(text);
      if (!m) return null;
      return { at: serviceMin(Number(m[1]) * 60 + Number(m[2])), text: text,
               dest: (o["odpt:destinationStation"] || [])[0] || "" };
    })
    .filter(Boolean)
    .sort((a, b) => a.at - b.at);
  const from = serviceMin(fromMin);
  return { all: all, rows: all.filter(x => x.at >= from),
           lastOfDay: all.length ? all[all.length - 1] : null };
}
/* The slot the card leaves for it. Filled once the cards are on screen. */
function nextDepSlot(rid, dir, style){
  if (!dir || !dir.ids || dir.ids.length < 2) return "";
  return '<span class="nextdep"' + (style ? ' data-style="' + esc(style) + '"' : "") +
         ' data-rw="' + esc(rid) + '" data-from="' + esc(dir.ids[0]) +
         '" data-next="' + esc(dir.ids[1]) + '"></span>';
}
/* The head of a route card: when the next train leaves, then what the ride is.
   The time is the only thing on the card that is about now, and the only thing
   that separates two cards leaving the same platform - so it goes first, and
   at the size of a number worth reading across the concourse. */
function routeHead(rid, dir, fareLegs, metaHtml){
  const dep = rid && dir ? nextDepSlot(rid, dir, "big") : "";
  return '<div class="rhead">' + dep +
    '<span class="rmeta">' + metaHtml + fareSlot(fareLegs) + "</span></div>";
}
async function fillNextDepartures(){
  const slots = $$(".nextdep:not([data-done])");
  for (const el of slots){
    el.dataset.done = "1";
    try{
      const rows = await nextDepartures(el.dataset.rw, el.dataset.from, el.dataset.next, 3,
                                        boardClock());
      if (!rows) continue;
      /* two shapes for the same three times: the head of a card leads with the
         first one, everywhere else they are a footnote */
      el.innerHTML = el.dataset.style === "big"
        ? '<span class="deptime">' + esc(rows[0].text) + "</span>" +
          (rows.length > 1
            ? '<span class="deprest">' + esc(t("nextDep")) + " " +
              rows.slice(1).map(r => esc(r.text)).join(" \u30fb ") + "</span>"
            : "")
        : ' \u30fb <span class="dep">' + esc(t("nextDep")) + " " +
          rows.map(r => esc(r.text)).join(" \u30fb ") + "</span>";
    }catch(e){}
  }
}

/* What the ride costs. Every leg has to be known, or the total would be a
   guess dressed as a number — and JR East and Odakyu publish no fares at all,
   so on a great many trips the honest output is nothing. */
/* Two operators publish no fares at all — the catalogue has no fare dataset for
   them and the API returns nothing. Asking anyway costs a request per leg on
   most Tokyo trips, since one of them is JR East. Read the operator out of the
   station id and do not ask. */
const NO_FARE_OPERATORS = new Set(["JR-East", "Odakyu"]);
function stationOperator(id){
  const m = /^odpt\.Station:([^.]+)\./.exec(String(id || ""));
  return m ? m[1] : "";
}
const fareCache = new Map();
async function legFare(fromId, toId){
  const key = fromId + ">" + toId;
  if (!fareCache.has(key)){
    fareCache.set(key, (async () => {
      for (const src of ["pub", "chl"]){
        try{
          const d = await odpt(src, "odpt:RailwayFare",
            { "odpt:fromStation": fromId, "odpt:toStation": toId }, { timeout:30000 });
          if (d.length){
            const f = d[0];
            const v = f["odpt:icCardFare"];
            return typeof v === "number" ? v : (typeof f["odpt:ticketFare"] === "number" ? f["odpt:ticketFare"] : null);
          }
        }catch(e){}
      }
      return null;
    })());
  }
  return fareCache.get(key);
}
function fareSlot(legs){
  const pairs = (legs || []).map(d => (d && d.ids && d.ids.length > 1)
    ? [d.ids[0], d.ids[d.ids.length - 1]] : null).filter(Boolean);
  if (!pairs.length) return "";
  /* one unpriceable leg makes the total unknowable, so the slot is not even made */
  if (pairs.some(([a2]) => NO_FARE_OPERATORS.has(stationOperator(a2)))) return "";
  return '<span class="farebox" data-legs="' + esc(JSON.stringify(pairs)) + '"></span>';
}
async function fillFares(){
  const slots = $$(".farebox:not([data-done])");
  for (const el of slots){
    el.dataset.done = "1";
    let pairs;
    try{ pairs = JSON.parse(el.dataset.legs); }catch(e){ continue; }
    try{
      const vals = [];
      for (const [a, b] of pairs) vals.push(await legFare(a, b));
      if (vals.some(v => v == null)) continue;      // one unknown leg, no total
      const sum = vals.reduce((n, v) => n + v, 0);
      el.innerHTML = " \u30fb " + esc(t("fareIc", { n: sum }));
    }catch(e){}
  }
}

function kmTag(metres){
  if (!metres) return "";
  const km = metres / 1000;
  return " ・ " + esc(t("legKm", { d: km >= 10 ? Math.round(km) : Math.round(km * 10) / 10 }));
}
function altStatusPill(status){
  return ' <span class="pill' + (status === "normal" ? " ok" : "") +
    '" style="padding:1px 6px">' +
    esc(t(status === "normal" ? "statusNormal" : "statusNoData")) + "</span>";
}
function renderHowTo(from, to, index){
  const box = $("#howto");
  if (!box) return;
  const blocks = [];
  /* One definition of "this line is no good", used by every section below.
     Three of them used to carry their own, and they disagreed. */
  const badLine = l => l.status === "alert" || l.status === "unknown";
  let directAllBad = false;      // set once the direct lines are known
  let clearOneChange = 0;        // one-change routes that are clear end to end
  /* One list for every way there by train, whatever the number of changes.
     Three headings that differed only by that number made the reader compare
     across sections — and the sections were in the wrong order for it, since
     「乗り換えなし」 came first even when it was twice as far. The number of
     changes belongs on the card, beside the stops and the distance, where it
     can be weighed against them. What orders the list is what matters: running
     first, then shortest. */
  const trainCards = [];
  /* Distance alone is not effort either: 東京→新宿 is 7.3 km and nine stops on
     the 丸ノ内線 against 8.5 km and four on the 中央線快速, and the longer one is
     the quicker. With no timetable, the closest honest thing is to price the
     other two costs in metres and add them up — a stop is worth roughly the
     distance a train covers while slowing, waiting and getting going again, and
     a change costs a few minutes on a platform. Rough weights standing in for
     times we do not have; they only ever compare routes with each other. */
  const effort = c => effortOf(c.metres, c.hops, c.changes);

  /* --- direct trains: a line present at both stations --- */
  let direct = [];
  const idsFrom = new Set(from ? from.stations.map(x => x["owl:sameAs"]) : []);
  const idsTo   = new Set(to   ? to.stations.map(x => x["owl:sameAs"])   : []);
  if (from && to){
    direct = Array.from(from.railways).filter(rid => to.railways.has(rid));
    if (direct.length){
      const rows = direct.map(rid => {
        const rw = cache.railwayById.get(rid) || {};
        const scanned = lineInfo(rid);
        const pill = scanned
          ? ' <span class="pill ' + (scanned.status === "normal" ? "ok" : scanned.status === "alert" ? "bad" : "") + '">' +
            esc(scanned.status === "normal" ? t("statusNormal") : scanned.status === "alert" ? t("statusAlert") : t("statusNoData")) + "</span>"
          : "";
        const dirs = railwayDirections(rid, idsFrom, idsTo);
        const name = esc(titleOf(rw["odpt:railwayTitle"], humanizeId(rid)));
        const colour = rw["odpt:color"] || "";
        if (!dirs.length){
          return routeDiagram([from.name, to.name],
            [{ name: titleOf(rw["odpt:railwayTitle"], humanizeId(rid)), color: colour, pill: pill }], "");
        }
        /* a ring line gives two ways round; say which one avoids the trouble */
        const span = dirs.length > 1 && scanned && scanned.status === "alert"
          ? disruptedSpan(rid, scanned.info) : null;
        const ways = dirs.map(d => {
          const mid = d.stations.slice(1, -1);
          const via = mid.length
            ? [mid[Math.floor(mid.length / 3)], mid[Math.floor(mid.length * 2 / 3)]]
                .filter(Boolean).map(x => LANG === "ja" ? x.ja : ((x.title && x.title.en) || x.ja))
            : [];
          const uniq = via.filter((v,i2) => via.indexOf(v) === i2);
          const hit = span ? d.ids.some(id => span.has(id)) : null;
          const tag = hit === null ? ""
            : hit ? ' <span class="pill bad">' + esc(t("loopAffected")) + "</span>"
                  : ' <span class="pill ok">' + esc(t("loopClear")) + "</span>";
          const label = (uniq.length ? esc(t("loopVia",{ via:uniq.join("・") })) + " ・ " : "") +
                        esc(t("howtoTrainStops",{ n:d.hops }));
