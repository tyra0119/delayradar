/* longest key contained in the value wins; null when nothing is recognised */
function tiTerm(dict, ja){
  if (!ja) return null;
  const s = String(ja).replace(/\s+/g, "");
  let best = null;
  Object.keys(dict).forEach(k => { if (s.indexOf(k) >= 0 && (!best || k.length > best.length)) best = k; });
  if (!best) return null;
  return LANG === "ja" ? best : (dict[best][LANG] || dict[best].en || best);
}
/* the station names in a range come from the same dataset as the timetable, so
   they can be looked up and shown in the reader's language */
function localizeStationName(rid, ja){
  const want = normLoose(String(ja).replace(/駅$/, ""));
  if (!want) return "";
  const r = railwayRing(rid);
  if (r){
    for (const id of r.ring){
      const s = ringStation(r, id);
      if (normLoose(s.ja) === want) return titleOf(s.title, s.ja);
    }
  }
  /* a through service may name a station of another line */
  for (const s of (cache.stationIndex || [])){
    const tt = s["odpt:stationTitle"] || {};
    const ja2 = tt.ja || s["dc:title"] || "";
    if (normLoose(ja2) === want) return titleOf(tt, ja2);
  }
  return "";
}
function tiRange(rid, info){
  const raw = ((info && info.range) || "").trim();
  if (!raw) return "";
  if (LANG === "ja") return raw;
  if (/^全線$/.test(raw)) return t("rangeWholeLine");
  const m = raw.match(/^(.+?)[〜～](.+?)駅?間$/);
  if (m){
    const a = localizeStationName(rid, m[1]), b = localizeStationName(rid, m[2]);
    if (a && b) return t("rangeBetween", { a:a, b:b });
  }
  return info.rangeEn || raw;
}
/* One line a traveller can act on, built from the fields rather than the prose:
   「Service suspended · cause: heavy rain · section: between Honda and Mobara」 */
function infoSummary(rid, info){
  if (!info) return "";
  const st = tiTerm(TI_STATUS, info.statusJa) || (LANG !== "ja" ? info.statusEn : info.statusJa) || "";
  const ca = tiTerm(TI_CAUSE,  info.causeJa)  || (LANG !== "ja" ? info.causeEn  : info.causeJa)  || "";
  const rg = tiRange(rid, info);
  const parts = [];
  if (st) parts.push(st);
  if (ca) parts.push(t("infoCause", { cause:ca }));
  if (rg) parts.push(t("infoRange", { range:rg }));
  return parts.join(" · ");
}
/* The two halves of the summary, separately. The verdict block puts the state
   at headline size and the reason underneath it, which is the shape the state
   already has - it was only ever glued into one sentence for a one-line row. */
/* A status with no translation used to come out empty, and the headline then
   read 「Asakusa Line」 with nothing after it — the English reader was told
   which line and not what was wrong, which is the one thing this app exists to
   tell them. 「ダイヤ乱れ」 did exactly that, live, while 遅延 and 運転見合わせ
   beside it translated fine.

   The table has grown, but no table will ever be complete: operators write
   their own, and today one of them published 「ＴＨ　ＬＩＮＥＲ運休」. So the
   last resort is the Japanese word itself rather than nothing. An English
   reader who cannot read it is no worse off than with a blank, and can hold it
   up at the window — which is the same reason the operator's original sentence
   is kept on the page. */
function infoStatusWord(info){
  if (!info) return "";
  return tiTerm(TI_STATUS, info.statusJa) ||
         (LANG !== "ja" ? info.statusEn : "") ||
         info.statusJa || "";
}
function infoDetailText(rid, info){
  if (!info) return "";
  const ca = tiTerm(TI_CAUSE, info.causeJa) || (LANG !== "ja" ? info.causeEn : info.causeJa) || "";
  const rg = tiRange(rid, info);
  const parts = [];
  if (ca) parts.push(t("infoCause", { cause:ca }));
  if (rg) parts.push(t("infoRange", { range:rg }));
  return parts.join(" \u00b7 ");
}
/* The operator's own sentence is the evidence, not the answer — and it is the
   longest thing on the page, printed twice over when several lines are down.
   Keep the one-line summary visible and put the original behind a toggle. */
function origTextHtml(info, style){
  const ja = info && info.text ? String(info.text) : "";
  const en = info && info.textEn && LANG !== "ja" ? String(info.textEn) : "";
  if (!ja && !en) return "";
  return '<details class="fold orig-fold"' + (style ? ' style="' + style + '"' : "") + ">" +
    "<summary>" + esc(t("showOriginal")) + "</summary>" +
    (en ? '<div class="orig" style="margin-top:5px">' + esc(en) + "</div>" : "") +
    (ja ? '<div class="orig" lang="ja" style="margin-top:5px">' + esc(ja) + "</div>" : "") +
    "</details>";
}
function infoSummaryHtml(rid, info, style){
  const s = infoSummary(rid, info);
  /* 振替輸送: the official text names it, but a visitor has never heard of it.
     Detected from the wording, since no structured field carries it. */
  const alt = !!(info && /振替輸送|振替乗車/.test(info.text || ""));
  if (!s && !alt) return "";
  return '<div class="summary"' + (style ? ' style="' + style + '"' : "") + ">" + esc(s) +
    (alt ? (s ? " " : "") + '<span class="pill warn" style="padding:1px 6px">' + esc(t("altTicket")) + "</span>" : "") +
    "</div>" +
    (alt ? '<div class="meta" style="margin-top:3px">' + esc(t("altTicketHint")) + "</div>" : "");
}

/* ------------------------- data access (cached) ------------------------ */
/* the same railway is published by both hosts with different completeness —
   keep whichever record carries more (station order, titles, colour) */
function richerRailway(a, b){
  const sa = (a["odpt:stationOrder"]||[]).length, sb = (b["odpt:stationOrder"]||[]).length;
  if (sa !== sb) return sa > sb ? a : b;
  const ka = Object.keys(a["odpt:railwayTitle"]||{}).length, kb = Object.keys(b["odpt:railwayTitle"]||{}).length;
  if (ka !== kb) return ka > kb ? a : b;
  return a["odpt:color"] ? a : b;
}
/* Prevent the same bulk fetch from running twice at once. Only completed
   results were cached, so two fields both waking getStationIndex() during the
   load window fired the whole 15-operator round again — measured 45 requests
   for three concurrent callers. The in-flight promise is shared and forgotten
   once settled, so a failure can still be retried. */
const inflight = new Map();
function shareInflight(key, fn){
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => { try { return await fn(); } finally { inflight.delete(key); } })();
  inflight.set(key, p);
  return p;
}
async function getRailways(){
  if (cache.railways && cache.railways.length) return cache.railways;
  return shareInflight("railways", async () => {
  if (cache.railways && cache.railways.length) return cache.railways;
  const chunks = await Promise.all([
    odpt("pub", "odpt:Railway", null, { timeout:30000 }).catch(() => []),
    odpt("chl", "odpt:Railway", null, { timeout:30000 }).catch(() => [])
  ]);
  const all = [].concat.apply([], chunks);
  all.forEach(r => {
    const id = r["owl:sameAs"], cur = cache.railwayById.get(id);
    cache.railwayById.set(id, cur ? richerRailway(cur, r) : r);
  });
  if (all.length) cache.railways = all;
  return all;
  });
}
/* one bulk call per host (a few KB gzipped) instead of one call per operator.
   Held only briefly: a rescan 15 minutes later must not be answered from the
   copy fetched when the page was opened. */
async function getTrainInfo(){
  if (cache.ti && fresh(cache.tiAt)) return cache.ti;
  return shareInflight("ti", async () => {
  if (cache.ti && fresh(cache.tiAt)) return cache.ti;
  const chunks = await Promise.all([
    odpt("pub", "odpt:TrainInformation").catch(() => []),
    odpt("chl", "odpt:TrainInformation").catch(() => [])
  ]);
  const byRailway = new Map(), byOperator = new Map();
  [].concat.apply([], chunks).forEach(i => {
    const txt = i["odpt:trainInformationText"] || {};
    const st = i["odpt:trainInformationStatus"] || {};
    const ca = i["odpt:trainInformationCause"]  || {};
    const rg = i["odpt:trainInformationRange"]  || {};
    const rec = {
      text:     txt.ja || txt.en || "",
      textEn:   txt.en || "",
      statusJa: st.ja || "",
      statusEn: st.en || "",
      causeJa:  ca.ja || "",
      causeEn:  ca.en || "",
      range:    rg.ja || "",
      rangeEn:  rg.en || "",
      stationFrom: i["odpt:stationFrom"] || "",
      stationTo:   i["odpt:stationTo"] || "",
      date:     i["dc:date"] || ""
    };
    if (i["odpt:railway"]) byRailway.set(i["odpt:railway"], rec);
    /* Keikyu and Seibu publish a single notice covering their whole network */
    else if (i["odpt:operator"]) byOperator.set(i["odpt:operator"], rec);
  });
  /* Same rule as the station index: an empty result is a failed fetch, not
     news. There are always a hundred-odd records; caching nothing for a minute
     turned a moment offline into 「遅延の有無は判定できません」 for every trip
     until the timer ran out. */
  const got = { byRailway, byOperator };
  if (byRailway.size || byOperator.size){
    cache.ti = got;
    cache.tiAt = Date.now();
  }
  return got;
  });
}

/* 区間運休。こちらのサーバが貯めた走行位置から、「運転見合わせ」と出ている路線で
   実際に位置を変えた列車を数えている。7本以上 動いていれば、止まっているのは
   別の区間。

   **失敗しても黙って諦める。** ODPT の運行情報と違ってこれは付加情報で、無ければ
   これまでどおりに出るだけ。サーバが落ちている・collect が止まっている（stale）
   ときに古い判断を出すほうが害が大きい。 */
async function getPartial(){
  if (cache.partial && fresh(cache.partialAt)) return cache.partial;
  try {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const to = ctl ? setTimeout(() => ctl.abort(), 4000) : 0;
    const r = await fetch(PARTIAL_URL, ctl ? { signal: ctl.signal } : {});
    if (to) clearTimeout(to);
    if (!r.ok) throw 0;
    const d = await r.json();
    /* 収集が5分以上 途切れていたら使わない。古い観測で「動いています」と
       言うのが、この機能でいちばん危ない外し方 */
    const set = new Set();
    if (d && !d.stale && d.lines){
      Object.keys(d.lines).forEach(k => { if (d.lines[k].partial) set.add(k); });
    }
    cache.partial = set;
    cache.partialAt = Date.now();
    return set;
  } catch (e) {
    return cache.partial || new Set();
  }
}

/* Live train positions, summarised per railway. Where odpt:TrainInformation
   says only that something is wrong, this says how wrong: how many trains are
   running, how many are late, by how much, and where the worst of them is.
   The operator id here is the same one the station and railway records use
   (odpt.Operator:JR-East), so unlike odpt:TrainInformation — published under
   odpt.Operator:jre-is — the railway id joins directly. */
async function getTrainLocations(){
  if (cache.trains && fresh(cache.trainsAt)) return cache.trains;
  return shareInflight("trains", async () => {
  if (cache.trains && fresh(cache.trainsAt)) return cache.trains;
  const chunks = await Promise.all([
    odpt("pub", "odpt:Train").catch(() => []),
    odpt("chl", "odpt:Train").catch(() => [])
  ]);
  const byRailway = new Map();
  [].concat.apply([], chunks).forEach(tr => {
    const rid = tr["odpt:railway"];
    if (!rid) return;
    let g = byRailway.get(rid);
    if (!g){ g = { total:0, delays:[], late:[] }; byRailway.set(rid, g); }
    g.total++;
    /* Keikyu publishes odpt:Train without any odpt:delay — those trains still
       count as running, but they must not be read as "on time". */
    const d = tr["odpt:delay"];
    if (typeof d !== "number") return;
    g.delays.push(d);
    if (d >= TRAIN_LATE_SEC){
      g.late.push({
        delay: d,
        from:  tr["odpt:fromStation"] || "",
        to:    tr["odpt:toStation"]   || "",
        dir:   tr["odpt:railDirection"] || ""
      });
    }
  });
  byRailway.forEach(g => {
    g.known   = g.delays.length;
    g.max     = g.known ? Math.max.apply(null, g.delays) : 0;
    g.delayed = g.delays.filter(d => d >= TRAIN_SHOW_SEC).length;
    g.late.sort((a,b) => b.delay - a.delay);
  });
  if (byRailway.size){
    cache.trains  = byRailway;
    cache.trainsAt = Date.now();
  }
  return byRailway;
  });
}
/* null unless this railway's operator publishes odpt:Train at all */
function liveFor(rid){
  return (cache.trains && cache.trains.get(rid)) || null;
}
/* Status of any line, whether or not it turned up in a location scan.
   Step 2 used to require step 1 because it compared against the scan result;
   the service information is a couple of KB for every operator, so the route
   check can stand on its own — and this way a disruption at the far end is
   no longer missed just because it is not near the user. */
/* The scan freezes each line's status at the moment it ran; service
   information expires after a minute and the scan repeats every fifteen.
   Anything drawn from state.lines in between is showing an old clock. Bring
   the frozen rows forward so the whole page agrees — otherwise the fix in
   lineInfo would make the station chips disagree with the line list above
   them, which is the same split all over again. */
const STATUS_RANK = { alert:0, unknown:1, normal:2, nodata:3 };
function refreshScannedStatuses(){
  if (DEMO || !cache.ti || !state.lines.length) return;
  if (!(cache.tiAt > (state.scannedAt ? state.scannedAt.getTime() : 0))) return;
  state.lines.forEach(l => {
    const meta = cache.railwayById.get(l.railwayId) || {};
    const info = infoFor(l.railwayId, meta["odpt:operator"], cache.ti);
    l.info   = info;
    l.status = info ? classify(info) : "nodata";
    l.live   = liveFor(l.railwayId);
  });
  state.lines.sort((a,b) => STATUS_RANK[a.status] - STATUS_RANK[b.status] || a.distance - b.distance);
  state.disrupted = state.lines.filter(l => l.status === "alert" || l.status === "unknown");
}
/* 路線図に塗る色を決める。アプリ本体の classify() は alert / normal / unknown の
   3値で、地図が要る「遅延」と「運転見合わせ」の区別を持っていない。表記は事業者
   ごとにばらばらで（「遅延」「列車遅延」「運転見合わせ」…）、文字列で来ることも
   多言語オブジェクトで来ることもある。ここで受け止める。

   平常運転のときは odpt:trainInformationStatus 自体が無いことが多い。だから
   「何も返ってこない＝平常」であって、異常ではない。 */
function railStatus(info){
  if (!info) return null;
  const status = String(info.statusJa || "");
  const text   = String(info.text || "").replace(/\s+/g, "");
  if (!status && !text) return null;

  /* 平常かどうかを先に見る。ここを後回しにすると誤爆する — 大江戸線が
     「現在、１５分以上の遅延はありません。」で 遅延 の2文字に引っかかり、
     平常運転の路線がオレンジに塗られた。**外国人には確かめる術がないので、
     こういう嘘は無いより悪い。** RE_NORMAL は本体の判定でも同じ役をしている。 */
  if (!status && (RE_NORMAL.test(text) || RE_NORMAL_EN.test(text))) return null;
  if (status && RE_NOTICE_STATUS.test(status)) return null;   // お知らせは異常ではない

  const v = status + text;
  if (/見合わせ|運転中止|全線運休|折返し運転|折返運転/.test(v)) return "suspended";
  if (/遅延|遅れ/.test(v)) return "delay";
  return null;
}

/* 直通運転。**ODPTに直通の系統データは無い**（odpt:connectingRailway は駅での
   接続であって直通ではない）ので、手で持つ。

   これが要る理由。TrainInformation は路線単位で出る。日比谷線が止まっても
   東武スカイツリーラインは「平常」で返ってくるが、実際には直通が切られて
   スカイツリーライン側も乱れる。**東横線に乗ろうとしている旅行者が、
   副都心線の見合わせを「自分には関係ない」と読んでしまう。**

   波及先は .affected（薄い破線）にして、実際に情報が出ている .delay /
   .suspended とは見た目を変える。**推測であることを、推測に見える形で出す。**

   片側だけ書けばよい。読むときに両向きへ広げる。 */
const THROUGH = {
  "odpt.Railway:TokyoMetro.Hibiya":     ["odpt.Railway:Tobu.TobuSkytree"],
  "odpt.Railway:TokyoMetro.Hanzomon":   ["odpt.Railway:Tokyu.DenEnToshi",
                                         "odpt.Railway:Tobu.TobuSkytree"],
  "odpt.Railway:TokyoMetro.Fukutoshin": ["odpt.Railway:Tokyu.Toyoko",
                                         "odpt.Railway:Seibu.Ikebukuro",
                                         "odpt.Railway:Seibu.SeibuYurakucho",
                                         "odpt.Railway:Tobu.Tojo"],
  "odpt.Railway:TokyoMetro.Yurakucho":  ["odpt.Railway:Seibu.Ikebukuro",
                                         "odpt.Railway:Seibu.SeibuYurakucho",
                                         "odpt.Railway:Tobu.Tojo"],
  "odpt.Railway:TokyoMetro.Chiyoda":    ["odpt.Railway:JR-East.JobanLocal",
                                         "odpt.Railway:Odakyu.Odawara"],
  "odpt.Railway:TokyoMetro.Tozai":      ["odpt.Railway:JR-East.ChuoSobuLocal"],
  "odpt.Railway:TokyoMetro.Namboku":    ["odpt.Railway:Tokyu.Meguro"],
  "odpt.Railway:Toei.Asakusa":          ["odpt.Railway:Keikyu.Main"],
  "odpt.Railway:Toei.Mita":             ["odpt.Railway:Tokyu.Meguro"],
  "odpt.Railway:Tokyu.TokyuShinYokohama":  ["odpt.Railway:Sotetsu.SotetsuShinYokohama",
                                            "odpt.Railway:Tokyu.Meguro",
                                            "odpt.Railway:Tokyu.Toyoko"],
  "odpt.Railway:Sotetsu.SotetsuShinYokohama": ["odpt.Railway:Sotetsu.Main"],
  "odpt.Railway:JR-East.SotetsuDirect": ["odpt.Railway:JR-East.SaikyoKawagoe",
                                         "odpt.Railway:Sotetsu.Main"],
  "odpt.Railway:Keikyu.Main":           ["odpt.Railway:Keikyu.Airport"],
  "odpt.Railway:Tobu.TobuSkytree":      ["odpt.Railway:Tobu.Isesaki"]
};
let throughBoth = null;
function throughOf(rid){
  if (!throughBoth){
    throughBoth = new Map();
    const add = (a, b) => {
      if (!throughBoth.has(a)) throughBoth.set(a, new Set());
      throughBoth.get(a).add(b);
    };
    Object.keys(THROUGH).forEach(a => THROUGH[a].forEach(b => { add(a, b); add(b, a); }));
  }
  return throughBoth.get(rid) || new Set();
}

/* 事業者単位でしか出てこない記録を、どの路線に配るか。

   西武は路線ごとの記録を出さず、**事業者に1件**だけ出す。本文には路線名が
   書いてある — 「池袋線・西武有楽町線は…一部列車に遅れ…」。そのまま
   infoFor のフォールバックに任せると、**その1件が西武12路線ぜんぶに配られて、
   多摩湖線も山口線も西武秩父線もオレンジになった。**

   本文に名前が出ている路線だけを塗る。照合するのは ODPT が持っている
   odpt:railwayTitle そのものなので、文章から路線名を推測しているのではない。
   どの路線名も出てこないときは、全線に向けた告知（「全線で運転を見合わせ」など）
   とみなして、その事業者の路線すべてに配る。 */
function operatorHits(rid, meta, info){
  const text = String((info && info.text) || "");
  if (!text) return true;
  const op = meta["odpt:operator"];
  let named = 0, mine = false;
  (cache.railways || []).forEach(r => {
    if (r["odpt:operator"] !== op) return;
    const ja = (r["odpt:railwayTitle"] || {}).ja || r["dc:title"] || "";
    if (ja && text.indexOf(ja) >= 0){
      named++;
      if (r["owl:sameAs"] === rid) mine = true;
    }
  });
  return named ? mine : true;
}

/* つまんで拡大、引きずって移動。viewBox を動かすだけで、線も文字も一緒に伸びる。

   電話では駅名を隠しているが（2.9px で読めないため）、**拡大したら出す。**
   全体を見るときは形と色だけ、寄せたときは名前も、という切り替え。 */
let RM = null;
function rmSetup(){
  const svg = $("#railMapSvg"), box = $("#railMap"), reset = $("#railMapReset");
  if (!svg || !box || RM) return;
  const v = (svg.getAttribute("viewBox") || "0 0 1240 1000").trim().split(/[\s,]+/).map(Number);
  const base = { x:v[0], y:v[1], w:v[2], h:v[3] };
  const pj = (svg.getAttribute("data-proj") || "").trim().split(/[\s,]+/).map(Number);
  RM = { base:base, vb:Object.assign({}, base), pts:new Map(), pinch:0,
         proj: pj.length === 6 && pj.every(n => !isNaN(n)) ? pj : null };

  function apply(){
    const b = RM.base, o = RM.vb;
    o.w = Math.min(b.w, Math.max(b.w / 8, o.w));
    o.h = o.w * b.h / b.w;
    o.x = Math.min(b.x + b.w - o.w, Math.max(b.x, o.x));
    o.y = Math.min(b.y + b.h - o.h, Math.max(b.y, o.y));
    svg.setAttribute("viewBox", o.x + " " + o.y + " " + o.w + " " + o.h);
    /* r は user 単位なので、拡大するほど画面上で大きくなる。寄せるほど○だらけに
       なるのはこれ。**画面上の実寸で決め直す。**

       r(user) = 欲しいpx × viewBoxの幅 ÷ 実際に表示されている幅

       最初これを base.w で割ってしまい、どの倍率でも 1px 前後にしかならず、
       出発地の印が見えなかった。基準にするのは元の図の幅ではなく、いま画面に
       出ている幅。 */
    const px = svg.getBoundingClientRect().width || b.w;
    const u = o.w / px;                       // 1画面px が何 user 単位か
    if (!RM.dots) RM.dots = svg.querySelectorAll(".xf");
    RM.dots.forEach(c => c.setAttribute("r", (2.5 * u).toFixed(2)));
    svg.querySelectorAll(".pin").forEach(c => c.setAttribute("r", (5.5 * u).toFixed(2)));
    const zoomed = b.w / o.w > 1.02;
    box.classList.toggle("zoomed", b.w / o.w > 1.6);
    if (reset) reset.classList.toggle("hidden", !zoomed);
  }
  RM.apply = apply;
  RM.reset = function(){ RM.vb = Object.assign({}, RM.base); apply(); };

  const svgAt = (cx, cy) => {
    const r = svg.getBoundingClientRect();
    return { x: RM.vb.x + (cx - r.left) / r.width * RM.vb.w,
             y: RM.vb.y + (cy - r.top) / r.height * RM.vb.h };
  };
  function zoom(f, cx, cy){
    const b = RM.base, o = RM.vb, p = svgAt(cx, cy);
    let w = Math.min(b.w, Math.max(b.w / 8, o.w / f));
    const k = w / o.w;
    o.x = p.x - (p.x - o.x) * k;
    o.y = p.y - (p.y - o.y) * k;
    o.w = w;
    apply();
  }

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX, e.clientY);
  }, { passive:false });

  const mid = () => {
    const a = Array.from(RM.pts.values());
    return { x:(a[0].x + a[1].x) / 2, y:(a[0].y + a[1].y) / 2,
             d:Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) };
  };
  svg.addEventListener("pointerdown", e => {
    RM.pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (RM.pts.size === 2) RM.pinch = mid().d;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!RM.pts.has(e.pointerId)) return;
    const prev = RM.pts.get(e.pointerId);
    RM.pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (RM.pts.size >= 2){
      e.preventDefault();
      const m = mid();
      if (RM.pinch > 0) zoom(m.d / RM.pinch, m.x, m.y);
      RM.pinch = m.d;
      return;
    }
    /* 全体表示のときは動かさない。指1本はページの縦スクロールに渡す */
    if (RM.base.w / RM.vb.w <= 1.02) return;
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    RM.vb.x -= (e.clientX - prev.x) / r.width * RM.vb.w;
    RM.vb.y -= (e.clientY - prev.y) / r.height * RM.vb.h;
    apply();
  });
  const up = e => { RM.pts.delete(e.pointerId); if (RM.pts.size < 2) RM.pinch = 0; };
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", up);
  svg.addEventListener("dblclick", e => { e.preventDefault(); zoom(1.8, e.clientX, e.clientY); });
  if (reset) reset.addEventListener("click", () => RM.reset());

  /* 大きさは「いま画面に出ている幅」で決めているので、幅が変わったら測り直す。
     **折りたたみが閉じている間は幅が0**で、そのときに測ると印が 0.67px になった。
     開いた瞬間・画面の回転・窓の伸縮、どれもここで拾える。 */
  if (window.ResizeObserver){
    new ResizeObserver(() => { if (svg.getBoundingClientRect().width) apply(); }).observe(box);
  }
  apply();
}

/* 路線図の駅名を、いま選ばれている言語にする。

   **日本語名だけ出しても、日本語を読めない人には読めても意味がない。**
   build.py が data-ja / data-en / data-zh / data-ko を持たせているので、
   ここで選ぶ。持っていない言語のときは英語、無ければ日本語に落ちる。 */
function rmLang(){
  const svg = $("#railMapSvg");
  if (!svg) return;
  svg.querySelectorAll(".nm").forEach(el => {
    const d = el.dataset;
    el.textContent = d[LANG] || d.en || d.ja || el.textContent;
  });
}

/* 緯度経度を図の上の座標に直す。build.py が data-proj に6個の数字を残している。
   駅の一覧を丸ごと埋め込むと数十KB増えるので、こちらで計算する。 */
function rmProject(lat, lon){
  const P = RM && RM.proj;
  if (!P || lat == null || lon == null) return null;
  const x = P[4] + (lon * Math.cos(P[0] * Math.PI / 180) - P[1]) * P[3];
  const y = P[5] + (P[2] - lat) * P[3];
  const b = RM.base;
  if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) return null;   // 図の外
  return { x: x, y: y };
}

/* 出発地と目的地の印。線と同じ図の上に置く。

   駅の名前ではなく**緯度経度**で置いている。名前で引くと、同じ名前の別の駅
   （中野・大久保・霞ケ関…）を掴む余地が残る。座標なら曖昧さが無い。 */
function rmPins(){
  const svg = $("#railMapSvg");
  if (!svg || !RM) return;
  let g = svg.querySelector("#railMapPins");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("id", "railMapPins");
    svg.appendChild(g);                       // 線より上に描く
  }
  g.textContent = "";

  const geoOf = st => st && st["geo:lat"] != null
    ? { lat: Number(st["geo:lat"]), lon: Number(st["geo:long"]) } : null;
  const from = geoOf((state.stations || [])[0]);

  /* state.destMatch は {name, text, railways} だけで、座標を持っていない。
     名前から引き直す — searchPlaces はアプリの他の場所でも使っている解決器で、
     同名の別の駅は距離で分けたうえで返ってくる。 */
  let to = null;
  if (state.destMatch && state.destMatch.name && cache.stationIndex){
    const pl = searchPlaces(state.destMatch.name)[0];
    if (pl && pl.lat != null) to = { lat: pl.lat, lon: pl.lon };
  }

  [[from, "pin-from"], [to, "pin-to"]].forEach(pair => {
    const p = pair[0] && rmProject(pair[0].lat, pair[0].lon);
    if (!p) return;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "pin " + pair[1]);
    c.setAttribute("cx", p.x.toFixed(1));
    c.setAttribute("cy", p.y.toFixed(1));
    const px = svg.getBoundingClientRect().width || RM.base.w;
    c.setAttribute("r", (5.5 * RM.vb.w / px).toFixed(2));
    g.appendChild(c);
  });
}

/* 線に色を塗るだけ。レイアウトは触らない（ビルド時に決まっている）。 */
function paintRailMap(){
  rmSetup();
  rmLang();
  rmPins();
  const svg = $("#railMapSvg");
  if (!svg) return;
  let delay = 0, susp = 0;
  const shown = new Set();
  svg.querySelectorAll("[data-railway]").forEach(el => {
    const rid = el.getAttribute("data-railway");
    const meta = (cache.railwayById && cache.railwayById.get(rid)) || {};
    const ti = cache.ti;
    let info = ti ? ti.byRailway.get(rid) : null;
    if (!info && ti && meta["odpt:operator"]){
      const alt = ti.byOperator.get(meta["odpt:operator"]);
      if (alt && operatorHits(rid, meta, alt)) info = alt;
    }
    const k = railStatus(info);
    el.classList.remove("delay", "suspended", "partial");
    if (k){
      el.classList.add(k);
      if (k === "suspended") susp++; else delay++;
      /* 見合わせのままにしておく（実際そう出ているので）。見た目だけ落とす */
      if (k === "suspended" && cache.partial && cache.partial.has(rid)){
        el.classList.add("partial");
        shown.add(rid);
      }
    }
  });
  /* 直通先。実際に情報が出ている路線だけを起点にして、1段だけ広げる。
     2段3段と辿ると、1本の遅れが首都圏の半分を塗ることになる。 */
  const hit = new Set();
  svg.querySelectorAll(".line.delay, .line.suspended").forEach(el => {
    throughOf(el.getAttribute("data-railway")).forEach(r => hit.add(r));
  });
  let aff = 0;
  svg.querySelectorAll("[data-railway]").forEach(el => {
    el.classList.remove("affected");
    const rid = el.getAttribute("data-railway");
    if (hit.has(rid) && !el.classList.contains("delay") && !el.classList.contains("suspended")){
      el.classList.add("affected");
      aff++;
    }
  });

  markPartial(shown);
  const n = delay + susp;
  const cnt = $("#railMapCount");
  if (cnt) cnt.textContent = n ? t("railMapCount", { n: n }) : "";
  /* 何か起きているときだけ開く。平常なら畳んだままにして、画面を占有させない */
  const sect = $("#sectRailMap");
  if (sect && n && !sect.dataset.touched) sect.open = true;
}

document.addEventListener("toggle", e => {
  if (e.target && e.target.id === "sectRailMap") e.target.dataset.touched = "1";
}, true);

/* 運行情報の一覧に一行 足す。作り直さず、出来ている DOM に差す — 一覧はこの時点で
   もう表示されていて、書き直すと読んでいる途中の画面が飛ぶ。

   **「乗れます」とは言わない。** 動いている列車を7本 数えただけで、それが利用者の
   行きたい区間とは限らない。言えるのは「全線が止まっているわけではない」まで。 */
function markPartial(shown){
  /* **一覧の item の class は "alert" で、"suspended" ではない**（classify は
     normal / alert / unknown / nodata の4値）。見合わせかどうかは路線図を塗った
     ときの判定を受け取る — 二重に判定して食い違わせない */
  document.querySelectorAll('#lines .item[data-railway]').forEach(el => {
    const on = !!(shown && shown.has(el.getAttribute("data-railway")));
    const had = el.querySelector(".partial-note");
    if (on && !had){
      const p = document.createElement("div");
      p.className = "partial-note";
      p.style.cssText = "margin-top:6px;font-size:12.5px;color:var(--muted)";
      p.textContent = t("partialNote");
      const body = el.querySelector(".msg") || el.querySelector(".body") || el;
      body.appendChild(p);
    } else if (!on && had){
      had.remove();
    }
  });
}

function lineInfo(rid){
  const meta = cache.railwayById.get(rid) || {};
  const info = cache.ti ? infoFor(rid, meta["odpt:operator"], cache.ti) : null;
  const scanned = state.lines.find(l => l.railwayId === rid);
  if (scanned){
    /* The scan freezes a line's status at the moment it ran. Service
       information expires after a minute; the scan repeats every fifteen.
       Between the two, judging a trip read the CLOSE lines from a
       quarter-hour-old snapshot and the distant ones from live data — and the
       close ones are the ones that matter. Take the newer of the two, keeping
       everything else the scan knows (distance, which station, its name).
       ?demo=1 rewrites state.lines to fake a disruption; leave that alone or
       the demo cures itself a minute later. */
    const stale = cache.ti && !DEMO &&
      cache.tiAt > (state.scannedAt ? state.scannedAt.getTime() : 0);
    if (!stale) return scanned;
    return Object.assign({}, scanned, {
      info: info,
      status: info ? classify(info) : "nodata",
      live: liveFor(rid)
    });
  }
  return {
    railwayId: rid,
    title: meta["odpt:railwayTitle"] || { ja:meta["dc:title"] || humanizeId(rid), en:humanizeId(rid) },
    color: meta["odpt:color"] || "",
    info: info,
    live: liveFor(rid),
    status: info ? classify(info) : "nodata",
    distance: Infinity
  };
}
function infoFor(railwayId, operatorId, ti){
  return ti.byRailway.get(railwayId) || (operatorId ? ti.byOperator.get(operatorId) : null) || null;
}
/* full station list of covered operators — only needed for route matching */
/* An empty array is truthy. Every one of these caches used to accept one, so a
   single failed fetch — a tunnel, a dropped connection at the moment the app
   was opened — was remembered as "there are no stations", and stayed
   remembered until the page was reloaded. The user saw 「駅を特定できませんでした」
   for the rest of the session with the network back and working. */
async function getStationIndex(){
  if (cache.stationIndex && cache.stationIndex.length) return cache.stationIndex;
  return shareInflight("stations", async () => {
  if (cache.stationIndex && cache.stationIndex.length) return cache.stationIndex;
  const reqs = [];
  [COVERAGE, COVERAGE_SILENT].forEach(set => {
    Object.keys(set).forEach(src => set[src].forEach(op => {
      reqs.push(odpt(src, "odpt:Station", { "odpt:operator":"odpt.Operator:"+op }, { timeout:45000 }).catch(() => []));
    }));
  });
  const chunks = await Promise.all(reqs);
  const all = [].concat.apply([], chunks);
  if (all.length) cache.stationIndex = all;    // nothing came back: try again next time
  return all;
  });
}

/* ------------------------------- SCAN ---------------------------------- */
function setStatus(el, msg, kind, rawHtml){
  el.innerHTML = msg
    ? (kind === "busy" ? '<span class="spinner"></span>' : "") +
      '<span class="' + (kind === "err" ? "err" : "") + '">' + (rawHtml ? msg : esc(msg)) + "</span>"
    : "";
}

/* The place the last scan was about, in the language now selected. */
function scanPlaceName(){
  const d = state.scanDone;
  if (!d) return "";
  return d.plain !== undefined ? d.plain : titleOf(d.title, d.ja);
}
/* Rebuilt on every language switch, so the line under the scan button speaks
   the language now selected rather than the one it was scanned in. */
function scanDoneMessage(){
  if (!state.scanDone || !state.scannedAt) return "";
  const min = getScanIntervalMinutes();
  const latestStr = fmtTime(state.scannedAt.toISOString());
  const prevStr = state.prevScannedAt ? fmtTime(state.prevScannedAt.toISOString()) : latestStr;
  const d = state.scanDone;
  const here = d.plain !== undefined ? d.plain : titleOf(d.title, d.ja);
  const key = d.manual ? "stDoneWithOriginManual" : "stDoneWithOrigin";
  /* rendered as rawHtml for the pill below, and t() does not escape its
     variables — so the one value that is not our own literal gets escaped */
  return (here ? t(key, { latest: latestStr, prev: prevStr, station: esc(here) })
               : t("stDone") + " (" + latestStr + ")") +
    ' <span class="pill ok" style="margin-left:6px">' + esc(t("autoScanBadge", { min })) + "</span>";
}

function getPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code:0 });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy }),
      e => reject(e),
      { enableHighAccuracy:true, timeout:15000, maximumAge:30000 }
    );
  });
}

/* opts.scroll: bring the verdict into view once the scan lands. Only for scans
   the user asked for — the automatic refresh every 15 minutes must not yank the
   page out from under whatever they are reading. */
async function runScan(pos, opts){
  if (state.busy) return;
  state.busy = true;
  const btn = $("#scanBtn"), st = $("#scanStatus");
  btn.disabled = true;
  btn.classList.add("busy");
  try{
    /* 1. position */
    if (!pos){
      setStatus(st, t("stGeo"), "busy");
      try{
        pos = await getPosition();
      }catch(e){
        const code = e && e.code;
        /* over plain http:// (other than localhost) browsers refuse geolocation
           outright and report it as a permission denial — say what it really is */
        const msg = (code === 1 && !window.isSecureContext) ? t("errInsecure")
                  : code === 1 ? t("errGeoDenied")
                  : code === 0 ? t("errGeoUnsupported")
                  : t("errGeoUnavail");
        /* The station box used to be hidden behind a link, so this opened it.
           It is the origin field now and always visible — but the message must
           still point at it, or the user is left with an error and no way on.
           Reaching for an element that no longer exists threw here, and the
           outer catch reported it as 「通信エラー」: a geolocation failure was
           being shown as a network failure. */
        setStatus(st, msg + " " + t("errUseStation"), "err");
        $("#routeFrom").focus({ preventScroll: true });
        return;
      }
    }
    state.position = pos;

    /* 2. nearby stations — geo search on both hosts, so we never download every
          station. Each host only knows its own operators, hence the merge. */
    setStatus(st, t("stStations"), "busy");
    let found = [];
    /* Offline, both hosts reject and the loop ends with nothing found — which
       used to be reported as 「周辺に対象事業者の駅が見つかりませんでした」 to a
       user standing at 東京駅. Being told the wrong reason is worse than being
       told nothing: they go looking for a station instead of for a signal. */
    let reachable = false;
    for (const radius of SCAN_RADII){
      const chunks = await Promise.all([
        odpt("pub", "places/odpt:Station", { lat:pos.lat, lon:pos.lon, radius }).then(v => { reachable = true; return v; }).catch(() => []),
        odpt("chl", "places/odpt:Station", { lat:pos.lat, lon:pos.lon, radius }).then(v => { reachable = true; return v; }).catch(() => [])
      ]);
      const seen = new Set();
      found = [];
      [].concat.apply([], chunks).forEach(s => {
        const id = s["owl:sameAs"];
        if (!id || seen.has(id)) return;
        seen.add(id); found.push(s);
      });
      if (found.some(s => COVERED_OPERATORS.has(s["odpt:operator"]))) break;
    }
    if (!found.length){
      setStatus(st, reachable ? t("errNoStation") : t("errNet"), "err");
      if (reachable) $("#routeFrom").focus({ preventScroll: true });
      return;
    }
    found.forEach(s => { s._d = haversine(pos.lat, pos.lon, s["geo:lat"], s["geo:long"]); });
    found.sort((a,b) => a._d - b._d);

    /* stations genuinely "around you"; if none of those is an operator we have
       service information for, still show the 3 nearest covered ones */
    let near = found.filter(s => s._d <= NEAR_STATION_M);
    if (!near.some(s => COVERED_OPERATORS.has(s["odpt:operator"]))){
      near = near.concat(found.filter(s => COVERED_OPERATORS.has(s["odpt:operator"]) && s._d > NEAR_STATION_M).slice(0,3));
    }

    /* 3. service information (bulk, both hosts) + railway metadata */
    setStatus(st, t("stInfo"), "busy");
    /* train positions ride along with the service information — same order of
       magnitude in bytes, and the two are only useful together */
    const [railways, ti] = await Promise.all([
      getRailways(), getTrainInfo(), getTrainLocations().catch(() => null)
    ]);
    void railways;

    /* 4. build one row per nearby railway */
    /* Some stations carry no coordinates at all (Keio's Shinjuku among them), so
       a geo search alone misses lines that are physically right there. Pull them
       in through the connecting railways of the stations we did find. */
    const byRailway = new Map();
    near.forEach(s => {
      [s["odpt:railway"]].concat(s["odpt:connectingRailway"] || []).forEach(rw => {
        if (!rw) return;
        if (!byRailway.has(rw) || byRailway.get(rw)._d > s._d) byRailway.set(rw, s);
      });
    });
    const RANK = { alert:0, unknown:1, normal:2, nodata:3 };
    state.lines = Array.from(byRailway.entries()).map(([rwId, s]) => {
      const meta = cache.railwayById.get(rwId) || {};
      const operator = meta["odpt:operator"] || s["odpt:operator"] || "";
      const info = infoFor(rwId, operator, ti);
      return {
        railwayId: rwId,
        operator: String(operator).split(":")[1] || "",
        title: meta["odpt:railwayTitle"] || { ja: meta["dc:title"] || humanizeId(rwId), en: humanizeId(rwId) },
        color: meta["odpt:color"] || "",
        code: meta["odpt:lineCode"] || "",
        /* no record at all = this operator does not publish service info */
        status: info ? classify(info) : "nodata",
        info: info,
        live: liveFor(rwId),
        stationTitle: s["odpt:stationTitle"] || { ja:s["dc:title"] },
        stationCode: s["odpt:stationCode"] || "",
        distance: s._d
      };
    }).sort((a,b) => RANK[a.status] - RANK[b.status] || a.distance - b.distance);

    /* ?demo=1 — inject a fictional disruption so the alert UI can be reviewed
       even while everything is running normally. Clearly labelled on screen. */
    if (DEMO && state.lines.length){
      const target = state.lines.filter(l => l.status === "normal").pop() || state.lines[state.lines.length-1];
      target.status = "alert";
      target.info = { text:t("demoText"), textEn:"", statusJa:"運転見合わせ", date:new Date().toISOString() };
      state.lines.sort((a,b) => RANK[a.status] - RANK[b.status] || a.distance - b.distance);
    }

    state.disrupted = state.lines.filter(l => l.status === "alert" || l.status === "unknown");
    state.stations  = near.slice(0, 14);   // grouped down to ~5 rows when rendered
    if (state.scannedAt) {
      state.prevScannedAt = state.scannedAt;
    }
    state.scannedAt = new Date();

    /* A place the user named stays named that way. Overwriting it with the
       nearest station turned 「お台場（東京テレポート）」 into 東京ビッグサイト,
       which is nearer but is not what was asked for. GPS is the other case:
       there the nearest station IS the answer to "where am I". */
    const here = pos.manualName ||
      (state.stations.length
        ? titleOf(state.stations[0]["odpt:stationTitle"], state.stations[0]["dc:title"])
        : "");
    $("#routeFrom").value = here;

    render();
    /* keep the station's multilingual title, not the name resolved just now:
       scanning in Japanese and then switching to English left 「東京」 sitting
       in an otherwise English sentence */
    state.scanDone = state.stations.length
      ? { title: state.stations[0]["odpt:stationTitle"], ja: state.stations[0]["dc:title"], manual: !!pos.manualName }
      : { plain: pos.manualName || "", manual: !!pos.manualName };
    setStatus(st, scanDoneMessage(), "", true);
    /* the answer is below the fold on a phone: after tapping scan, or picking a
       station, the next thing wanted is「遅れているのか」, not the button just
       pressed */
    /* the answer has its own page now, so arriving at it is the scroll */
    if (opts && opts.scroll) goStep(2, { force:true });
    /* The button on page 1 keeps saying what it does: take my location. It
       used to turn into 「最新の情報に更新」 after a scan, which on that page is
       an offer to refresh something the reader has not seen yet — the
       information is on page 2, so that is where the refresh lives now. */

    /* 5. buses — independent, never blocks the train result */
    try{ await loadBus(pos); renderBus(); }
    catch(e){ state.bus = null; $("#busNote").textContent = t("errNet"); }
    loadBusReach().then(() => {
      withScrollAnchor($("#routeCard"), renderBus);
      markBusDestinations();
    }).catch(() => {});
    markBusDestinations();
    try{ await loadBusRt(pos); renderBusRt(); }
    catch(e){ state.busRt = null; renderBusRt(); }
    /* the counts belong to the old position — drop them, then reload if the
       section happens to be open (applyFolds opens it when something is wrong) */
    state.bike = null;
    renderBike();
    refreshBike();
    setStatus(st, scanDoneMessage(), "", true);

    startAutoScan();

    /* A scan moves the origin; the destination is the user's own choice and
       outlives it — the whole point of saving 「羽田空港」 is that it works from
       wherever you happen to be. Wiping it here also left the nearest-station
       badges naming a destination the app had just forgotten, because render()
       ran further up: 朝霞 still read 「池袋」行きに運行情報 with the destination
       box empty. Re-judge from the new origin instead. */
    if (routeDestination()){
      checkRoute();
    } else {
      state.busReach = null;
      state.destMatch = null;
      $("#routeResult").innerHTML = "";
      setStatus($("#routeStatus"), "", "");
      render();                 // drop any badge left by an earlier destination
    }
    updateFavBtn();

  }catch(err){
    console.error(err);
    setStatus($("#scanStatus"), t("errNet"), "err");
  }finally{
    state.busy = false;
    $("#scanBtn").classList.remove("busy");
    syncActions();
  }
}

/* ------------------------------ render --------------------------------- */
function getScanIntervalMinutes(){
  if (window.AndroidApp && typeof window.AndroidApp.getScanInterval === "function"){
    try{
      const m = window.AndroidApp.getScanInterval();
      if (m && m > 0) return m;
    }catch(e){}
  }
  return 15;
}

function startAutoScan(){
  if (state.autoScanInterval) clearInterval(state.autoScanInterval);
  const min = getScanIntervalMinutes();
  state.autoScanInterval = setInterval(() => {
    if (state.position && !state.busy && document.visibilityState !== "hidden"){
      runScan(state.position);
    }
  }, min * 60 * 1000);
}

/* 27 分 — a pill has no room for 「27分00秒」, and the seconds say nothing here */
function fmtDelayMin(sec){
  const m = Math.round(sec / 60);
  return m >= 1 ? t("liveMin",{ m }) : t("liveUnderMin");
}
/* 「坂戸〜北坂戸」 — the names come from the railway's own stationOrder, so a
   train's fromStation/toStation always resolves */
function sectionLabel(rid, from, to){
  const r = railwayRing(rid);
  const nm = id => {
    if (!id) return "";
    if (!r) return humanizeId(id);
    const s = ringStation(r, id);
    return LANG === "ja" ? s.ja : titleOf(s.title, s.ja);
  };
  const a = nm(from), b = nm(to);
  if (a && b && a !== b) return t("liveSpan",{ from:a, to:b });
  return a || b || "";
}
/* What the live train records add to a line row: a pill with the worst delay,
   and a sentence giving the count and where that worst train is. */
function liveBits(l){
  const g = l.live;
  if (!g || !g.total) return { pill:"", note:"" };
  if (!g.known) return { pill:"", note:t("liveRunningOnly",{ n:g.total }) };
  /* A couple of minutes is ordinary running on these lines — the operators say
     so themselves (Toei reports 「１５分以上の遅延はありません」 as normal). Colour
     the pill only past TRAIN_LATE_SEC, or a green 平常運転 sits next to an orange
     badge and the two look like they disagree. */
  const pill = g.max >= TRAIN_SHOW_SEC
    ? ' <span class="pill' + (g.max >= TRAIN_LATE_SEC ? " bad" : "") + '">' +
      esc(t("liveMaxPill",{ d:fmtDelayMin(g.max) })) + "</span>"
    : ' <span class="pill ok">' + esc(t("liveOnTime")) + "</span>";
  let note = g.delayed
    ? t("liveSummary",{ total:g.total, delayed:g.delayed, max:fmtDelayMin(g.max) })
    : t("liveSummaryClear",{ total:g.total });
  const worst = g.late[0];
  if (worst){
    const span = sectionLabel(l.railwayId, worst.from, worst.to);
    if (span) note += " ・ " + t("liveWorst",{ span, d:fmtDelayMin(worst.delay) });
  }
  return { pill, note };
}

/* The same four states as statusPill, said in the row's right-hand column
   instead of in a badge beside the name. */
function statusWord(status){
  const k = status === "normal" ? "ok" : status === "alert" ? "bad" : status === "nodata" ? "none" : "warn";
  const key = status === "normal" ? "statusNormal" : status === "alert" ? "statusAlert"
            : status === "nodata" ? "statusNoData" : "statusUnknown";
  return '<span class="statustext ' + k + '">' + esc(t(key)) + "</span>";
}
function statusPill(status){
  if (status === "normal") return '<span class="pill ok">'  + esc(t("statusNormal"))  + "</span>";
  if (status === "alert")  return '<span class="pill bad">' + esc(t("statusAlert"))   + "</span>";
  if (status === "nodata") return '<span class="pill">'     + esc(t("statusNoData"))  + "</span>";
  return '<span class="pill warn">' + esc(t("statusUnknown")) + "</span>";
}

function render(){
  if (!state.lines.length) return;
  refreshScannedStatuses();
  const sw = $("#scanWait");
  if (sw) sw.classList.add("hidden");
  $("#results").classList.remove("hidden");
  syncStaffButtons();

  /* --- headline verdict --- */
  const alerts   = state.lines.filter(l => l.status === "alert");
  const unknown  = state.lines.filter(l => l.status === "unknown");
  const withInfo = state.lines.filter(l => l.status !== "nodata");
  const noInfo   = state.lines.length - withInfo.length;
  /* 「周辺」 of where? The reader chose the place, so say its name back — on
     every one of these headings, not just the calm one. scanPlaceName() keeps
     the multilingual title, so a language switch renames it too. */
  const hereName = scanPlaceName();
  const at = (key, vars) => hereName ? t(key + "At", Object.assign({ place:hereName }, vars || {}))
                                     : t(key, vars);
  /* The headline is the news, and when something is wrong the news is which
     line and what it is doing - not how many lines have notices. So the count
     becomes the eyebrow above it and the line takes the headline, at the size
     it would have on a departure board. Everything here already existed; it
     was being flattened into one sentence. */
  let b;
  if (alerts.length){
    const w = alerts[0];
    const word = infoStatusWord(w.info);
    const rest = infoDetailText(w.railwayId, w.info);
    b = { cls:"bad", eyebrow:at("badTitle",{n:alerts.length}),
          h:titleOf(w.title, humanizeId(w.railwayId)) + (word ? "\n" + word : ""),
          p:rest || t("badBody") };
  } else if (unknown.length){
    b = { cls:"warn", ico:"?", h:at("warnTitle",{n:unknown.length}), p:t("warnBody") };
  } else if (!withInfo.length){
    b = { cls:"neutral", ico:"i", h:at("nodataTitle"), p:t("nodataBody") };
  } else {
    b = { cls:"ok", ico:"\u2713", h:at("okTitle"),
          p:t("okBody",{ n:withInfo.length, time:fmtTime(state.scannedAt.toISOString()) }) +
            (noInfo ? " " + t("okBodyNoInfo",{ n:noInfo }) : "") };
  }
  /* A scan lands every 15 minutes whether or not the reader is still looking
     at its answer. Rewriting page 2 under someone who has walked on to the
     route list is not an update, it is a rug pull — so the page is redrawn (it
     is off screen; nothing moves) and a notice appears saying the answer
     changed. They come back when they want to. */
  const sig = b.cls + "/" + alerts.length + "/" + unknown.length;
  if (state.verdictSig && state.verdictSig !== sig && step >= 3) showUpdateChip();
  state.verdictSig = sig;

  const min = getScanIntervalMinutes();
  const latestStr = state.scannedAt ? fmtTime(state.scannedAt.toISOString()) : "";
  const prevStr = state.prevScannedAt ? fmtTime(state.prevScannedAt.toISOString()) : "";
  const timeInfo = prevStr
    ? t("scanTimeline", { prev: prevStr, latest: latestStr })
    : latestStr ? t("lastUpdated", { time: latestStr }) : "";
  const locText = (state.position.manualName
    ? t("locManual") + ": " + state.position.manualName
    : t("locLabel") + (state.position.accuracy ? " (" + t("accuracy",{m:Math.round(state.position.accuracy)}) + ")" : "")) +
    (timeInfo ? " ｜ " + timeInfo : "");
  const askNext = alerts.length || unknown.length;
  /* Where and when the scan happened is context for the verdict, not part of
     it - inside the block it was a third paragraph competing with the answer,
     and on the filled block it would have to be white text at 85% over green.
     It sits above, in the quiet colour, where a timestamp belongs. */
  $("#verdictBanner").innerHTML =
    (DEMO ? '<div class="banner neutral" style="margin-bottom:10px"><div class="ico">🧪</div>' +
            '<div><p style="color:var(--warn)">' + esc(t("demoBadge")) + "</p></div></div>" : "") +
    '<div class="scanmeta"><span>\ud83d\udccd ' + esc(locText) + '</span>' +
      '<span class="live">' + esc(t("autoScanBadge", { min })) + "</span>" +
      '<button type="button" class="linkbtn" id="rescanBtn">' + esc(t("scanBtnAgain")) + "</button></div>" +
    '<div class="banner solid ' + b.cls + '">' +
      (b.ico ? '<div class="bicon">' + esc(b.ico) + "</div>" : "") +
      '<div class="btext">' +
        (b.eyebrow ? '<div class="eyebrow">' + esc(b.eyebrow) + "</div>" : "") +
        "<h3>" + esc(b.h).replace(/\n/g, "<br>") + "</h3><p>" + esc(b.p) + "</p>" +
      "</div></div>";

  /* What used to stand here was a block that said 「次は目的地を入れてください」
     in a paragraph, three numbered steps and a button. All of it is now one
     word on the bar at the bottom of the screen, in the same place on every
     page. Advice about what to do next is the shape of a control, not the
     shape of a paragraph. */

  /* --- line list: problems stay open, the rest folds away --- */
  const lineItem = l => {
    const name = titleOf(l.title, humanizeId(l.railwayId));
    const jaName = (l.title && l.title.ja) || "";
    const secondary = (LANG !== "ja" && jaName && jaName !== name) ? " / " + jaName : "";
    let msg;
    if (l.status === "normal"){
      msg = '<div class="msg" style="color:var(--muted)">' + esc(t("normalMsg")) + "</div>";
    } else if (l.status === "nodata"){
      msg = '<div class="msg" style="color:var(--muted)">' + esc(t("noDataMsg")) + "</div>";
    } else {
      const en   = (l.info && l.info.textEn) || "";
      /* the structured line first — it is the only part that exists in every
         language, and it is what the traveller acts on */
      msg = '<div class="msg">' +
              infoSummaryHtml(l.railwayId, l.info) +
              /* only when there is nothing official to read: the note says the
                 update is Japanese-only, which is untrue once en is present */
              (LANG !== "ja" && !en ? '<span style="color:var(--muted);font-size:12.5px">' + esc(t("origNote")) + "</span>" : "") +
              origTextHtml(l.info) +
            "</div>";
    }
    const live = liveBits(l);
    /* Name on the left, state on the right, the railway's own colour on both
       edges. The code used to be a grey outlined chip identical to every other
       chip on the page; it is the one piece of text that already has a colour
       of its own, so it wears it. */
    return '<div class="item ' + (l.status === "normal" ? "" : l.status) +
      '" data-railway="' + esc(l.railwayId) + '">' +
      '<div class="bar" style="background:' + esc(l.color || "var(--faint)") + '"></div>' +
      '<div class="body">' +
        '<div class="title">' +
          (l.code ? '<span class="lbadge" style="background:' + esc(l.color || "var(--faint)") + '">' +
                    esc(l.code) + "</span>" : "") +
          esc(name + secondary) +
        "</div>" +
        '<div class="meta">' + esc(titleOf(l.stationTitle, "") ) + " · " + esc(fmtDist(l.distance)) +
          (l.info && l.info.date ? " · " + esc(fmtTime(l.info.date)) : "") + "</div>" +
        (live.note ? '<div class="meta">🚃 ' + esc(live.note) + "</div>" : "") +
        msg +
      "</div>" +
      '<div class="rowend">' + statusWord(l.status) + live.pill + "</div></div>";
  };
  const open   = state.lines.filter(l => l.status === "alert" || l.status === "unknown");
  const folded = state.lines.filter(l => l.status === "normal" || l.status === "nodata");
  const nNormal = folded.filter(l => l.status === "normal").length;
  const nNoData = folded.length - nNormal;
  const summary = [nNormal ? t("foldNormal",{n:nNormal}) : "", nNoData ? t("foldNoData",{n:nNoData}) : ""]
    .filter(Boolean).join(" ・ ");
  $("#lines").innerHTML = open.map(lineItem).join("") +
    (folded.length
      ? '<details class="fold"><summary>' + esc(summary) + "</summary>" +
        '<div class="list" style="margin-top:8px">' + folded.map(lineItem).join("") + "</div></details>"
      : "");

  const newest = state.lines.map(l => l.info && l.info.date).filter(Boolean).sort().pop();
  $("#linesUpdated").textContent = newest ? t("updated",{t:fmtTime(newest)}) : "";

  /* Why anyone would press the button below. It changes with the answer above
     it: with delays it is about whether they matter to this trip, without them
     it is about being ready for the next one. */
  const nl = $("#nextLine");
  nl.textContent = t(askNext ? "ctaBody" : "ctaBodyOk");
  nl.classList.remove("hidden");

  /* nothing is wrong → the point of the page is answered; keep the rest folded */
  state.calm = !alerts.length && !unknown.length;
  applyFolds();
  /* 路線図はここで塗る。走査のたび（＝15分ごとの自動更新でも）通る */
  paintRailMap();
  /* 区間運休は待たない。届いたら塗り直す。**届かなくても画面は完成している** */
  getPartial().then(set => { if (set && set.size) paintRailMap(); });

  /* --- nearest stations: one row per station, tap to use as route origin --- */
  const groups = [];
  (state.stations || []).forEach(s => {
    const name = titleOf(s["odpt:stationTitle"], s["dc:title"]);
    let gr = groups.find(x => normName(x.name) === normName(name) && Math.abs(x.d - s._d) < 700);
    if (!gr){ gr = { name, ja:s["dc:title"] || "", d:s._d, lat:s["geo:lat"], lon:s["geo:long"], codes:[], railways:[], own:[] }; groups.push(gr); }
    if (s._d < gr.d){ gr.lat = s["geo:lat"]; gr.lon = s["geo:long"]; }
    gr.d = Math.min(gr.d, s._d);
    if (s["odpt:stationCode"] && gr.codes.indexOf(s["odpt:stationCode"]) < 0) gr.codes.push(s["odpt:stationCode"]);
    /* railways = everything you can change to here; own = what actually stops
       at this station. Only the latter can take you somewhere. */
    if (s["odpt:railway"] && gr.own.indexOf(s["odpt:railway"]) < 0) gr.own.push(s["odpt:railway"]);
    [s["odpt:railway"]].concat(s["odpt:connectingRailway"] || []).forEach(r => {
      if (r && gr.railways.indexOf(r) < 0) gr.railways.push(r);
    });
  });
  groups.sort((a,b) => a.d - b.d);
  stationGroups = groups.slice(0, 5);
  $("#stations").innerHTML =
    (stationGroups.length ? '<div class="hint" style="margin:0 0 6px">' + esc(t("stationsHint")) + "</div>" : "") +
    stationGroups.map((g,i) => {
      const chips = g.railways.slice(0,6).map(r => {
        const rw = cache.railwayById.get(r) || {};
        /* lineInfo, not state.lines: these chips include connectingRailway, and
           a line that only connects here need not have turned up in the scan.
           The badge to the right of them already used lineInfo, so one row was
           reading two sources and could mark a line clear that the badge called
           disrupted. */
        const st = lineInfo(r);
        return '<span class="chip">' +
          '<span class="dot" style="background:' + esc(rw["odpt:color"] || "var(--faint)") + '"></span>' +
          esc(titleOf(rw["odpt:railwayTitle"], humanizeId(r))) +
          (st.status === "alert" ? ' <span class="pill bad" style="padding:1px 6px">!</span>' : "") +
          "</span>";
      }).join("") + (g.railways.length > 6 ? '<span class="chip">+' + (g.railways.length - 6) + "</span>" : "");
      const reach = stationReach(g);
      const badge = !reach ? ""
        : !reach.ok ? ' <span class="pill">' + esc(t("stNoDirect",{ q:state.destMatch.name })) + "</span>"
        : reach.down ? ' <span class="pill bad">' + esc(t("stReachDown",{ q:state.destMatch.name })) + "</span>"
        : reach.unsure ? ' <span class="pill">' + esc(t("stReachNoInfo",{ q:state.destMatch.name })) + "</span>"
                     : ' <span class="pill ok">' + esc(t("stReach",{ q:state.destMatch.name })) + "</span>";
      return '<div class="item' + (reach && reach.ok && !reach.down && !reach.unsure ? " okrow" : "") + '">' +
        '<div class="bar" style="background:var(--accent)"></div>' +
        '<div class="body"><div class="title">' + esc(g.name) + badge +
          (g.codes.length ? ' <span class="pill code">' + esc(g.codes.slice(0,4).join(" ")) +
            (g.codes.length > 4 ? " +" + (g.codes.length - 4) : "") + "</span>" : "") +
        "</div>" +
        (LANG !== "ja" && g.ja && g.ja !== g.name ? '<div class="meta" lang="ja">' + esc(g.ja) + "</div>" : "") +
        (reach && reach.ok ? '<div class="meta">' + esc(t("stVia",{ lines:reach.lines.slice(0,3).join(" / ") })) + "</div>" : "") +
        '<div class="linechips">' + chips + "</div>" +
        '<div class="rowacts">' +
          '<button type="button" class="linkbtn" data-i="' + i + '">' + esc(t("useAsOrigin")) + "</button>" +
          walkLink(g.lat, g.lon) +
          /* A station this app cannot route from is exactly where a link out
             earns its place. 「直通なし」 and 「行きは動いていません」 are the two
             rows that end in a dead end: the badge states the problem and then
             offers nothing. Google can plan from here even when no single line
             does. The rows that DO have a working line already name it, and the
             trip's own Maps link sits above, so they are left alone. */
          (reach && state.destMatch && (!reach.ok || reach.down)
            ? mapsRouteLink(g.name, state.destMatch.name) : "") +
        "</div></div>" +
        '<div class="dist">' + esc(fmtDist(g.d)) + "</div></div>";
    }).join("");
}

/* The sections below the verdict are reference material. They matter when
   something is wrong, or when a destination has been entered. */
/* What applyFolds last set each section to, and which sections the reader has
   since decided about for themselves.

   applyFolds runs at the end of every render, and renderBike() renders on every
   press of 「続きを表示」. So opening the share-cycle section and pressing the
   button did this: open → fetch → render → applyFolds → shut again, over and
   over. The reader was fighting the default and losing every round.

   The toggle event fires asynchronously, so a flag set around the assignment is
   already cleared by the time it arrives. Comparing against the value we asked
   for works whenever it happens: if the section no longer matches, somebody
   else moved it. */
const foldWanted = new Map();
const foldByUser = new Set();
function setFold(sel, want){
  const el = $(sel);
  if (!el || foldByUser.has(sel)) return;
  el.open = want;
  foldWanted.set(sel, want);
}
["#sectStations", "#sectBusStops", "#sectBusRunning", "#sectBike"].forEach(sel => {
  const el = $(sel);
  if (!el) return;
  el.addEventListener("toggle", () => {
    if (foldWanted.get(sel) !== el.open) foldByUser.add(sel);
  });
});
/* Only the counts now. Which of these sections is open is decided by which
   page you are on — see goStep — because each of them now has a page, and a
   section that is the page should be open when you get there. */
function applyFolds(){
  const nSt = (stationGroups || []).length;
  $("#stationsCount").textContent = nSt ? t("foldStations",{ n:nSt }) : "";

  const stops = state.bus ? Math.min(state.bus.stops.length, 5) : 0;
  $("#busStopsCount").textContent = state.bus ? t("foldStops",{ n:stops }) : "";

  const veh = state.bus ? state.bus.vehicles.length : 0;
  const rt  = (state.busRt || []).reduce((n, a) => n + a.vehicles.length, 0);
  $("#busRunCount").textContent = (veh || rt) ? t("foldRunning",{ n:veh + rt }) : "";

  const bikes = (state.bike || []).reduce((n, f) => n + f.ports.length, 0);
  $("#bikeCount").textContent = bikes ? t("foldBike",{ n:bikes }) : "";
}

/* A list of nearby stations is not an answer on its own: which of them gets me
   to where I am going? Same judgement the bus stops already carry. */
function stationReach(g){
  const dm = state.destMatch;
  const own = g.own || [];
  if (!dm || !own.length) return null;
  const ids = own.filter(r => dm.railways.has(r));
  if (!ids.length) return { ok:false };
  const lines = ids.map(lineInfo);
  const normal = lines.filter(l => l.status === "normal");
  /* nodata is "we cannot see", not "it has stopped". 小田急・相鉄・ゆりかもめ
     publish no service information at all, so a station served only by them
     was permanently wearing a red 「◯◯行きに運行情報」 badge. The route panel
     was taught this in 1.9.10; the badge had been left behind. */
  const noInfo = lines.filter(l => l.status === "nodata");
  const named = (normal.length ? normal : lines)
    .map(l => titleOf(l.title, humanizeId(l.railwayId)));
  return { ok:true,
           down:  normal.length === 0 && noInfo.length === 0,   // every line actually disrupted
           unsure:normal.length === 0 && noInfo.length > 0,     // nothing confirmed either way
           lines:named };
}

/* tapping a nearby station pre-fills step 2 — you are here, where next? */
let stationGroups = [];
/* Step 2 lives in the other tab. Scrolling to it while that tab is hidden does
   nothing at all, which is why 「目的地を入力する」 and 「出発地にする」 both
   looked like dead buttons: the value was set, on a screen nobody could see. */
/* Step 2 is no longer a tab but the next card down the page. Kept as a named
   function because every caller means "take me to where the destination goes",
   not "scroll by N pixels". */
function openRouteTab(){
  goStep(3, { force:true });
}
/* From the nearest-station list. The station is a few hundred metres away, so
   its surroundings are worth refetching too — otherwise the page would judge
   from one place and describe another, which is the split this page removed. */
function useAsOrigin(name, place){
  if (place && isFinite(place.lat) && isFinite(place.lon)){
    /* Not the same as typing in the box on page 1. This is a station picked
       from a list of stations, several pages in, and the whole reason for
       picking it is to see what is going on there — so this one does travel. */
    pickOrigin({ lat:place.lat, lon:place.lon, name });
    runScan({ lat:place.lat, lon:place.lon, accuracy:null, manualName:name }, { scroll:true });
    return;
  }
  $("#routeFrom").value = name;
  updateFavBtn();
  if (routeDestination()){ checkRoute({ scroll:true }); return; }   // checkRoute scrolls to its verdict
  /* say what just happened — the field is one of two identical boxes */
  setStatus($("#routeStatus"), t("originSet", { station: name }), "");
  openRouteTab();
  setTimeout(() => $("#routeTo").focus({ preventScroll: true }), 400);
}

function groupPoles(poles, pos){
  poles.forEach(p => { p._d = haversine(pos.lat, pos.lon, p["geo:lat"], p["geo:long"]); });
  poles.sort((a,b) => a._d - b._d);
  const stops = [];
  poles.forEach(p => {
    const name = p["dc:title"] || p["owl:sameAs"];
    let g = stops.find(x => x.name === name);
    if (!g){ g = { name, title:p.title || null, d:p._d, poles:[], patterns:new Set() }; stops.push(g); }
    g.d = Math.min(g.d, p._d);
    g.poles.push(p);
    (p["odpt:busroutePattern"] || []).forEach(id => g.patterns.add(id));
  });
  return stops;
}

async function loadBus(pos){
  const poles = await busPolesNear(pos.lat, pos.lon, BUS_RADIUS);
  const stops = groupPoles(poles, pos);

  let vehicles = [];
  if (poles.length){
    const poleIds = new Set(poles.map(p => p["owl:sameAs"]));
    /* odpt:Bus carries no coordinates, but it does carry the bus stop poles it
       just left / is heading to — match those against the poles near the user. */
    /* live vehicles, from whichever of them publishes any */
    const buses = [].concat.apply([], await Promise.all(BUS_OPERATORS.map(op =>
      odpt("pub", "odpt:Bus", { "odpt:operator":"odpt.Operator:" + op }, { timeout:30000 })
        .catch(() => []))));
    vehicles = buses.filter(b => poleIds.has(b["odpt:fromBusstopPole"]) || poleIds.has(b["odpt:toBusstopPole"]));
    vehicles.sort((a,b) => String(b["odpt:fromBusstopPoleTime"]).localeCompare(String(a["odpt:fromBusstopPoleTime"])));
  }
  state.bus = { stops, vehicles };
}

      /* the route number is how you tell this bus from the next one at the same
