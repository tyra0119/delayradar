};

/* ------------------------------ language ------------------------------- */
function applyLang(lang){
  LANG = I18N[lang] ? lang : "en";
  document.documentElement.lang = t("htmlLang");
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("#routeFrom").placeholder = t("routeFromPlaceholder");
  $("#routeTo").placeholder = t("routeToPlaceholder");
  if (typeof syncBarSpace === "function") syncBarSpace();
  if (typeof renderAirport === "function") renderAirport();
  if (typeof rmLang === "function") rmLang();          // 路線図の駅名もこの言語に
  /* the map's controls are glyphs; their names live only in aria-label */
  [["#mapClose","mapCloseLbl"], ["#mapZoomIn","mapZoomIn"], ["#mapZoomOut","mapZoomOut"], ["#mapFit","mapFit"]]
    .forEach(([sel, key]) => { const el = $(sel); if (el) el.setAttribute("aria-label", t(key)); });

  try {
    if (window.AndroidApp) {
      window.AndroidApp.onLanguageChanged(lang);
    }
  } catch(e) {}

  renderFavs();
  renderFromFavs();

  /* one-tap shortcuts next to the station search */
  renderQuickList();

  try{ localStorage.setItem("tdr.lang", LANG); }catch(e){}
  /* the line under the scan button was written in the old language and stays
     there until it is rebuilt — same for the "updated at" line */
  if (state.scanDone) setStatus($("#scanStatus"), scanDoneMessage(), "", true);
  /* proxy mode needs a real web server — say so instead of failing obscurely */
  const proxied = Object.keys(SOURCES).some(k => !SOURCES[k].key);
  if (proxied && location.protocol === "file:") setStatus($("#scanStatus"), t("errFileMode"), "err");
  if (state.lines.length){
    render();
    renderBus();
    renderBusRt();
    renderBike();
  }
  /* step 2 works without a scan, so its result must re-render on its own */
  if ($("#routeResult").innerHTML) checkRoute();
  updateTripBar();                       // the placeholders are language-dependent
}

function detectLang(){
  /* The page is loaded from file:// with a fresh query string every launch, and
     DOM storage for that origin does not survive reliably — the app came back in
     the phone's language however the user had set it. The Android side already
     keeps the choice in its own settings, so ask it first. */
  try{
    if (window.AndroidApp && window.AndroidApp.getLanguage){
      const native = window.AndroidApp.getLanguage();
      if (native && I18N[native]) return native;
    }
  }catch(e){}
  try{
    const saved = localStorage.getItem("tdr.lang");
    if (saved && I18N[saved]) return saved;
  }catch(e){}
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("ja")) return "ja";
  if (n.startsWith("ko")) return "ko";
  if (n.startsWith("zh")) return "zh";
  return "en";
}

/* -------------------------------- wire up ------------------------------ */
$$(".langs button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
/* 「現在地」 answers one question — where am I — and writes the answer in the
   box. It does not fetch service information and it does not change the page:
   the reader may want to correct the station it guessed before spending a
   request on it. */
async function useHere(){
  const btn = $("#hereBtn"), st = $("#scanStatus");
  if (btn.disabled) return;
  btn.disabled = true;
  let go = false;
  setStatus(st, t("stGeo"), "busy");
  try{
    const pos = await getPosition();
    const idx = await getStationIndex().catch(() => null);
    const near = idx ? stationsNear(pos.lat, pos.lon, 2500, 1) : [];
    const name = near.length ? near[0].name : "";
    state.hereFix = { lat:pos.lat, lon:pos.lon, accuracy:pos.accuracy, name:name };
    if (name){
      $("#routeFrom").value = name;
      routeFromHits = [];
      renderHitsList($("#routeFromHits"), [], "");
      clearStaleVerdict();
      updateFavBtn();
      updateTripBar();
      setStatus(st, t("hereFound", { place:name }), "");
      go = true;
    } else {
      setStatus(st, t("hereNoStation"), "");
    }
    syncActions();
  }catch(e){
    const code = e && e.code;
    setStatus(st, (code === 1 && !window.isSecureContext) ? t("errInsecure")
                : code === 1 ? t("errGeoDenied")
                : code === 0 ? t("errGeoUnsupported")
                : t("errGeoUnavail"), "err");
  }
  btn.disabled = false;

  /* Straight to the answer. The station just decided on goes up large on the
     next page while the reply is still out, so the reader still sees what the
     app understood — which was the whole reason for making them press a second
     button — without being made to wait for it.

     Outside the catch above, because a failure here is a failure of the scan
     and must not be reported as a failure of the phone's location. And only on
     success with a station in hand: arriving on a page that has nothing to say
     is worse than staying here with the reason why. */
  if (!go) return;
  const wait = $("#scanWait");
  if (wait){
    $("#scanWaitName").textContent = state.hereFix.name;
    wait.classList.remove("hidden");
    $("#results").classList.add("hidden");
  }
  goStep(2);
  try{ await scanFromField(); }catch(e){}
  if (!(state.lines && state.lines.length)){
    /* nothing came back; the message is on page 1, so put the reader back
       where it is rather than leaving them on a spinner */
    if (wait) wait.classList.add("hidden");
    goStep(1, { force:true });
  }
}
$("#hereBtn").addEventListener("click", useHere);

/* The only thing on this page that goes anywhere. It reads the box, because
   the box is where "the place I am" now lives — however it got there. */
async function scanFromField(){
  const name = ($("#routeFrom").value || "").trim();
  const fix = state.hereFix;
  /* The device's own coordinates beat a station's centroid, so they are used
     whenever the box still holds what the fix put there — or holds nothing and
     the fix found no station to name. */
  if (fix && (!name || normLoose(fix.name || "") === normLoose(name)))
    return runScan({ lat:fix.lat, lon:fix.lon, accuracy:fix.accuracy, manualName:name || "" },
                   { scroll:true });
  if (!name) return runScan(null, { scroll:true });
  if (!cache.stationIndex) setStatus($("#scanStatus"), t("hitsLoading"), "busy");
  const idx = await getStationIndex().catch(() => null);
  const p = idx ? searchPlaces(name)[0] : null;
  if (!p){ setStatus($("#scanStatus"), t("routeUnmatched", { q:name }), "err"); return; }
  const nm = titleOf(p.title, p.ja);
  $("#routeFrom").value = nm;

/* What can I reach from this stop? The pole lists its route patterns; each
   pattern carries its own name and stop order. Fetched on demand, cached. */
async function loadStopRoutes(det){
  const box = det.querySelector(".stoproutes");
  if (!box) return;
  box.innerHTML = '<div class="empty"><span class="spinner"></span> ' + esc(t("busRouteLoading")) + "</div>";
  const poles = (det.dataset.poles || "").split(",").filter(Boolean);
  const pairs = [];
  (state.bus ? state.bus.stops : []).forEach(g => {
    g.poles.forEach(p => {
      if (poles.indexOf(p["owl:sameAs"]) < 0) return;
      (p["odpt:busroutePattern"] || []).forEach(id => pairs.push({ id, pole:p["owl:sameAs"] }));
    });
  });
  /* one pattern can be listed by several poles of the same stop */
  const seen = new Set(), uniq = [];
  pairs.forEach(pr => { if (!seen.has(pr.id)){ seen.add(pr.id); uniq.push(pr); } });

  /* Which of them actually go where the reader is going. The card above says
     「「巣鴨」へ行けます・直通：草６３ …」 and this list is what it is talking
     about, so the named routes have to be in it — and they were not.
     池袋駅東口 has forty-five routes, only the first twenty were fetched, and
     both 草６３ fell outside that window: the card promised a bus and the list
     underneath showed eight unrelated ones and 「ほか25系統は省略しています」.
     They go first now, and they are labelled, so the answer is the first thing
     under the heading instead of the missing thing. */
  const reach = state.busReach;
  const hits = (reach && reach.fromHere && det.dataset.stop)
    ? (reach.byStop.get(det.dataset.stop) || []) : [];
  const hitIds = new Set(hits.map(h => h.id));
  const heads = uniq.filter(pr => hitIds.has(pr.id));
  const tails = uniq.filter(pr => !hitIds.has(pr.id));
  const shown = heads.concat(tails).slice(0, 20), extra = uniq.length - shown.length;

  const rows = [];
  const build = async pr => {
    try{
      const stops = await busStops(pr.id);
      const here = stops.findIndex(x => x.id === pr.pole);
      if (here < 0 || here >= stops.length - 1) return;              // terminus: nothing ahead
      const rec = cache.patterns.get(pr.id) || {};
      const title = rec.title || humanizeId(pr.id);
      if (rows.some(r => r.title === title)) return;
      rows.push({ id:pr.id, title, label:patternLabel(pr.id, stops), hit:hitIds.has(pr.id),
                  from:here, to:stops.length - 1, ahead:stops.length - 1 - here });
    }catch(e){}
  };
  /* the reaching ones are built first and on their own, so that when two
     patterns share a title it is the one that gets there which survives the
     de-duplication above */
  await Promise.all(shown.filter(pr => hitIds.has(pr.id)).map(build));
  await Promise.all(shown.filter(pr => !hitIds.has(pr.id)).map(build));

  if (!rows.length){ box.innerHTML = '<div class="empty">' + esc(t("busRouteNone")) + "</div>"; return; }
  rows.sort((a,b) => (b.hit ? 1 : 0) - (a.hit ? 1 : 0) ||
                     a.label.main.localeCompare(b.label.main, LANG === "ja" ? "ja" : "en"));
  box.innerHTML = '<div class="meta" style="margin:6px 0 4px">' + esc(t("stopRoutesTitle")) + "</div>" +
    rows.map(r =>
      '<details class="busroute sub" data-terminus="1" data-pattern="' + esc(r.id) + '" data-from="' + r.from + '" data-to="' + r.to + '">' +
        '<summary><div class="stoprow' + (r.hit ? " hit" : "") + '"><span class="stopdot"></span><span class="stopname">' +
          patternLabelHtml(r.label) +
          (r.hit ? ' <span class="pill bad">' + esc(t("stopRouteHits",{ q:reach.dest || "" })) + "</span>" : "") +
          " " + esc(t("stopRouteAhead",{ n:r.ahead })) +
          ' <span class="pill">' + esc(t("stopSpanOpen")) + "</span>" +
        "</span></div></summary>" +
        '<div class="routebody" style="margin:4px 0 8px 14px"></div>' +
      "</details>").join("") +
    (extra > 0 ? '<div class="hint" style="margin-top:4px">' + esc(t("stopRoutesMore",{ n:extra })) + "</div>" : "");
}

async function openStopSpan(e){
  const sum = e.target.closest("details.busroute.sub > summary");
  if (!sum) return;
  const det = sum.parentElement;
  if (!det || !det.dataset.pattern) return;
  if (det.dataset.loaded) return;
  det.dataset.loaded = "1";
  const body = det.querySelector(".routebody");
  body.innerHTML = '<div class="empty"><span class="spinner"></span> ' + esc(t("busRouteLoading")) + "</div>";
  try{
    const stops = await busStopsNamed(det.dataset.pattern);
    body.innerHTML = det.dataset.terminus
      ? renderStopSpan(stops, Number(det.dataset.from), Number(det.dataset.to), "stopRouteSpanTitle", "busTerminal")
      : renderStopSpan(stops, Number(det.dataset.from), Number(det.dataset.to));
  }catch(err){
    det.dataset.loaded = "";
    body.innerHTML = '<div class="empty err">' + esc(t("errNet")) + "</div>";
  }
  return true;
}

/* An answer outlives its question the moment a box is edited: judge 池袋→新宿,
   then type 渋谷, and the verdict, the route cards, the station badges and the
   bus flags all still describe 新宿. Clear them and ask for the button again —
   the same reasoning that stopped the app judging on its own. */
/* Whose clock is this?

   The airport sets a time in the future, and that time only means anything for
   the airport it was set at. The first version cleared it whenever the origin
   box fired an input event — which never happens when the box is written to by
   code, and every way of choosing an origin except typing writes to it by
   code. Pick 新宿 from the one-tap chips after checking a flight and the app
   went on answering with the flight's midnight: it reported the last train out
   of 新宿 as though the reader were standing at Haneda with a suitcase.

   So the clock is not cleared at each of the places an origin can change —
   there are five and I would miss the sixth. It is checked where it is used,
   against the origin it belongs to. A clock whose station is not the station
   in the box is not this reader's clock. */
function boardClock(){
  if (state.boardAt == null) return null;
  const here = normName(($("#routeFrom").value || "").trim());
  const mine = normName((state.airport && state.airport.station) || "");
  if (!here || !mine || here !== mine){ forgetAirport(); return null; }
  return state.boardAt;
}
function forgetAirport(){
  if (state.boardAt == null) return;
  state.boardAt = null;
  state.airport = null;
  depCache.clear();
  const el = $("#airVerdict");
  if (el){ el.innerHTML = ""; el.classList.add("hidden"); }
}
function clearStaleVerdict(){
  /* A verdict going stale is exactly the moment the airport clock might be
     stale too — every path that changes the origin passes through here. The
     check inside boardClock is still the guarantee; this only stops the old
     wording sitting in the DOM until the reader walks back to it. */
  boardClock();
  const j = state.judgedFor;
  if (!j) return;
  if (j.from === (routeOrigin() || "") && j.to === (routeDestination() || "")) return;
  state.judgedFor = null;
  state.destMatch = null;
  state.busReach = null;
  state.routeVerdict = null;
  state.originMatch = null;
  state.originCoords = null;
  $("#routeResult").innerHTML = "";
  setStatus($("#routeStatus"), routeDestination() ? t("routeReady") : "", "");
  if (state.lines.length){ render(); renderBus(); }   // drop the badges that named the old destination
}

/* a pasted directions URL fills the two boxes, so it is obvious what was read */
function applyRouteUrl(){
  const raw = ($("#routeUrl").value || "").trim();
  const st = $("#urlStatus");
  if (!raw){ setStatus(st, "", ""); return; }
  const p = parseRouteInput(raw);
  if (p.error === "short"){   setStatus(st, t("routeShortUrl"), "err"); return; }
  if (p.error || (!p.origin && !p.destination)){ setStatus(st, t("routeNoParse"), "err"); return; }
  if (p.origin) $("#routeFrom").value = p.origin;
  if (p.destination) $("#routeTo").value = p.destination;
  updateFavBtn();
  setStatus(st, t("routeUrlRead",{ from:p.origin || "?", to:p.destination || "?" }), "");
}

    const q = $("#routeFrom").value.trim();
    if (!q) { routeFromHits = []; renderHitsList($("#routeFromHits"), [], ""); return; }

       ids ("Ginza · Hibiya") until something else happens to load them */

      renderHitsLoading($("#routeFromHits"));
      await Promise.all([ getStationIndex().catch(()=>{}), getRailways().catch(()=>{}) ]);

  }, 180);
});

/* Opened from a delay notification. Tapping it used to land on the blank
   start screen, which said nothing about the delay that had just been
   announced; take the user straight to the thing the notification was about.
   Called by MainActivity once the page has finished loading. */
window.openFromNotification = function(raw){
  let p;
  try { p = typeof raw === "string" ? JSON.parse(raw) : raw; }
  catch(e){ return; }
  if (!p) return;

  if (p.mode === "route" && p.destination){
    if (p.origin) $("#routeFrom").value = p.origin;
    $("#routeTo").value = p.destination;
    updateFavBtn();
    checkRoute({ scroll:true });
    return;
  }
  if (p.mode === "place" && isFinite(+p.lat) && isFinite(+p.lon)){
    runScan({ lat:+p.lat, lon:+p.lon, accuracy:null, manualName:p.name || "" }, { scroll:true });
  }
};

/* ?lat=&lon= runs a scan at a fixed point — handy for testing without GPS */
(function(){
  const lat = parseFloat(QS.get("lat")), lon = parseFloat(QS.get("lon") || QS.get("lng"));
  if (isFinite(lat) && isFinite(lon)) runScan({ lat, lon, accuracy:null, manualName:lat.toFixed(4) + ", " + lon.toFixed(4) });
})();
