<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tokyo Transit Delay Radar</title>
<style>
/* The hue is in the ground, not on the surfaces.

   1.9.33 moved this palette off a blue-grey (#0d1117 with a blue glow behind
   the header) because every coloured thing — the line bars, the status greens
   and reds, the operators' own colours — sat on a tinted ground and had to
   fight it. That finding still holds, and nothing here contradicts it: the
   cards keep a near-neutral surface, so a line colour never lands on a tint.

   What changed is that the page had no colour of its own anywhere. The accent
   was the operating system's default blue, used for links and little else, and
   the darkest value was a dead #0a0a0b. So the hue goes where no data sits:
   the ground behind the cards, and the radar mark in the header. Elevation
   walks it back to neutral — bg is indigo, surface is barely cool, the card
   interiors where the line colours live are as neutral as before. */
:root{
  --bg:#090c14; --bg2:#0d111a; --surface:#15171d; --surface2:#1c1f27;
  --line:#2a2e38; --text:#f0f1f4; --muted:#9aa1ad; --faint:#737a86;
  --accent:#79aaff; --accent-ink:#07101f;
  --ok:#3ecf7a; --ok-bg:rgba(62,207,122,.10); --ok-line:rgba(62,207,122,.32);
  --warn:#ffb020; --warn-bg:rgba(255,176,32,.10); --warn-line:rgba(255,176,32,.32);
  --bad:#ff6259; --bad-bg:rgba(255,98,89,.11); --bad-line:rgba(255,98,89,.36);
  /* filled versions, for blocks that carry white text instead of coloured text */
  --ok-solid:#18944e; --bad-solid:#d93b32; --warn-solid:#a97400;
  /* the primary button is the brightest thing on the page, so it is the page's
     opposite: near-white here, near-black on the light theme */
  --btn:#f0f1f4; --btn-ink:#0b0e15;
  --shadow:0 1px 2px rgba(2,5,12,.46),0 6px 18px rgba(2,5,12,.30);
  --radius:18px;
}

/* ------------------------------ 路線図 ---------------------------------
   平常時のラインカラーには赤系が多い（丸ノ内線・京急・京葉線）。**遅延を赤で
   塗ると、平常の赤と見分けがつかない。** 平常をいったん落として、異常だけを
   浮かせる。色だけに頼らず、太さと破線でも冗長に伝える（色覚多様性）。 */
#railMapSvg{ display:block; width:100%; height:auto; }
/* 線の太さは画面の実寸で決める。viewBox は 1240 幅で、電話では 0.27 倍まで
   縮む — そのままだと 4 の線が 1.1px になって、止まっている路線が見えない。
   non-scaling-stroke なら縮尺に関係なく指定した太さで出る。 */
#railMapSvg .line{ fill:none; stroke:var(--c); stroke-width:2; opacity:.22;
                   vector-effect:non-scaling-stroke;
                   stroke-linejoin:round; stroke-linecap:round;
                   transition:opacity .2s, stroke-width .2s }
#railMapSvg .line.delay    { stroke:var(--warn); stroke-width:3.5; opacity:1 }
#railMapSvg .line.suspended{ stroke:var(--bad);  stroke-width:3.5; opacity:1;
                             stroke-dasharray:6 4 }
/* 「運転見合わせ」だが、こちらのサーバで走っている列車を数えられた路線。

   運行情報は路線単位でしか出ない。中央本線は東京から塩尻まであるので、山の中で
   止まっていても全線が真っ赤になる。**東京にいる観光客には、そこが誤報になる。**
   赤は残しつつ細く薄くして、全線停止と同じ強さで出さない。 */
#railMapSvg .line.suspended.partial{ stroke-width:2.5; opacity:.6;
                                     stroke-dasharray:2 5 }
/* 直通先。情報が出ているわけではなく、こちらの推測。

   最初は路線の色のまま opacity .85 で出したが、**推測のほうが事実より目立った** —
   東上線・池袋線・東横線は長く伸びていて色も強く、都心で短い日比谷線の見合わせを
   食ってしまう。色を捨てて灰色の点線にする。目に入るが、主役ではない。 */
#railMapSvg .line.affected { stroke:var(--muted); stroke-width:2; opacity:.55;
                             stroke-dasharray:2 4 }
/* 乗換駅の印は219個ある。r は user 単位なので**拡大すると画面上で大きくなり**、
   寄せるほど○だらけになって線路も駅名も埋もれた。rmSetup の apply() が縮尺に
   合わせて r を書き換え、画面上の大きさを一定に保つ。あわせて塗りを半透明に
   して、下の線が透けるようにした。 */
#railMapSvg .xf{ fill:var(--surface); fill-opacity:.55;
                 stroke:var(--faint); stroke-opacity:.7; stroke-width:1.2;
                 vector-effect:non-scaling-stroke }
/* 出発地と目的地。○の群れに埋もれないよう、塗りつぶしで置く */
#railMapSvg .pin{ vector-effect:non-scaling-stroke; stroke-width:2 }
#railMapSvg .pin-from{ fill:var(--accent); stroke:var(--surface) }
#railMapSvg .pin-to{ fill:var(--ok); stroke:var(--surface) }
.railmaplegend .k-from{ color:var(--accent) }
.railmaplegend .k-to{ color:var(--ok) }
.railmaplegend .k-from i, .railmaplegend .k-to i{
  width:12px; height:12px; border:0; border-radius:50%;
  background:currentColor }
#railMapSvg .nm{ font:11px system-ui,sans-serif; fill:var(--muted);
                 paint-order:stroke; stroke:var(--surface); stroke-width:3 }
/* 駅名は電話では 2.9px にしかならず、読めない。そもそも ODPT の日本語名なので、
   日本語を読めない人には読めても意味がない。**形と色だけ残す。**
   どの路線が止まっているかは、すぐ下の一覧が利用者の言語で名指ししている。 */
@media (max-width:700px){
  #railMapSvg .nm{ display:none }
  #railMapSvg .xf{ display:none }
  /* ただし拡大したら出す。指で寄せた人は、そこがどこか を知りたい */
  #railMap.zoomed .nm{ display:block }
  #railMap.zoomed .xf{ display:block }
}
/* pan-y にしてあるのは、指1本の縦スクロールをページに渡すため。地図の上で
   ページが動かなくなると、下の凡例まで行けない。つまむ操作は2本指なので、
   これでも拾える。拡大したあとだけ、指1本の移動を地図の平行移動に使う。 */
#railMap{ touch-action:pan-y; overflow:hidden; border-radius:10px }
#railMap.zoomed{ touch-action:none; cursor:grab }
.railmapreset{
  margin-top:8px; font:inherit; font-size:12px; cursor:pointer;
  padding:5px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface2); color:var(--muted);
}
.railmapbox{ padding:2px 0 4px }
.railmaplegend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px;
                font-size:12px; color:var(--muted) }
.railmaplegend span{ display:inline-flex; align-items:center; gap:6px }
.railmaplegend i{ width:22px; height:0; border-top:4px solid currentColor;
                  border-radius:2px }
.railmaplegend .k-delay{ color:var(--warn) }
.railmaplegend .k-susp { color:var(--bad); border-top-style:dashed }
.railmaplegend .k-aff  { color:var(--muted); border-top-style:dotted }
.railmaplegend .k-ok   { color:var(--faint); opacity:.5 }
@media (prefers-color-scheme: light){
  :root{
    /* Paper and ink. The ground is a shade off white rather than grey, the
       text is ink rather than near-black, and the accent is a deep indigo
       instead of the system blue — the same colour the dark theme puts in its
       ground, so the two themes are one family rather than two moods. Colour
       is left to the lines and the verdict; nothing else here has any. */
    --bg:#f3f5f8; --bg2:#edeff3; --surface:#ffffff; --surface2:#f1f3f7;
    --line:#dfe3ea; --text:#12151c; --muted:#545a66; --faint:#848a96;
    --accent:#274a80; --accent-ink:#ffffff;
    --ok:#12874a; --ok-bg:rgba(18,135,74,.08); --ok-line:rgba(18,135,74,.26);
    --warn:#a4650a; --warn-bg:rgba(164,101,10,.09); --warn-line:rgba(164,101,10,.26);
    --bad:#c62828; --bad-bg:rgba(198,40,40,.08); --bad-line:rgba(198,40,40,.26);
    --ok-solid:#0f7a3f; --bad-solid:#c2312a; --warn-solid:#8c6000;
    --btn:#12151c; --btn-ink:#f7f8fa;
    --shadow:0 1px 2px rgba(18,21,28,.05),0 6px 18px rgba(18,21,28,.07);
  }
}
/* the airport panel */
#airPorts .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#airTime,#airBuffer{width:100%}
.airverdict{border-radius:var(--radius);padding:16px 16px;margin-bottom:12px;
  border:1px solid var(--line);background:var(--surface)}
.airverdict.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.airverdict.tight{background:var(--warn-bg);border-color:var(--warn-line)}
.airverdict.miss{background:var(--bad-bg);border-color:var(--bad-line)}
.airverdict h3{margin:0 0 6px;font-size:19px;font-weight:900;line-height:1.4}
.airverdict.ok h3{color:var(--ok)}
.airverdict.tight h3{color:var(--warn)}
.airverdict.miss h3{color:var(--bad)}
.airverdict p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
.airverdict .catch{display:flex;align-items:baseline;gap:9px;margin:10px 0 4px}
.airverdict .catch b{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;
  color:var(--text);font-variant-numeric:tabular-nums}
.airverdict .catch span{font-size:13px;color:var(--muted);font-weight:700}
.airverdict .assume{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--faint)}

/* page 2 before the answer arrives */
.scanwait{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;min-height:52vh;padding:20px 16px}
.sw-eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.sw-name{font-size:34px;font-weight:900;line-height:1.25;letter-spacing:-.01em;
  color:var(--text);text-wrap:balance}
.sw-note{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

/* the button that opens the card, and the card itself */
.staffwrap{margin-top:12px}
.staffbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px 14px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font:inherit;font-weight:800;
  font-size:14.5px;cursor:pointer}
.staffbtn:hover{border-color:var(--accent)}
.staffbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.staffstage{position:absolute;inset:56px 0 0;overflow:auto;padding:16px 14px 28px;
  background:var(--bg)}
.staffcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;max-width:560px;margin:0 auto}
.staff-gloss{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0 0 14px;
  padding-bottom:12px;border-bottom:1px dashed var(--line)}
.staff-ask{font-size:23px;font-weight:900;line-height:1.5;margin:0 0 4px;color:var(--text)}
.staff-trip{font-size:19px;font-weight:800;line-height:1.6;margin:0 0 10px;color:var(--text)}
.staff-where{font-size:14px;font-weight:700;line-height:1.5;margin:0 0 16px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.staff-line{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.staff-line h4{margin:0 0 4px;font-size:18px;font-weight:900}
.staff-line .st{font-size:15px;font-weight:800;color:var(--bad);margin:0 0 8px}
.staff-line .orig{font-size:14.5px;line-height:1.8;color:var(--text);margin:0;
  background:var(--surface2);border-radius:12px;padding:12px 13px}
.staff-when{margin:16px 0 0;font-size:12px;color:var(--faint);text-align:right}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
/* The last card on a page must clear the pinned bar, and the bar's height is
   not a number that can be written down: it depends on the phone's font size
   and on whether the gesture bar is counted here or by the app. So it is
   measured, and the page is given that much room plus a gap. */
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(var(--bar-h, 72px) + 26px)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--line);
}
/* Tight, because everything here has to fit one line at 360dp: the wordmark,
   four language buttons and the gear. "Transit Delay Radar" is the longest of
   the four names and was being ellipsized once the gear joined the row. */
.topbar .wrap{display:flex;align-items:center;gap:9px;padding-top:10px;padding-bottom:10px}
/* The wordmark is the way home. Every app puts one there; this one now does
   what people already try. */
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.2px;margin-right:auto;min-width:0;
  appearance:none;border:0;background:none;color:inherit;font-family:inherit;cursor:pointer;padding:4px 6px;
  border-radius:10px;margin-left:-6px}
.brand:hover{background:var(--surface2)}
.brand:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.brand svg{flex:none;color:var(--accent)}   /* the mark is the one piece of pure identity on the page */
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.langs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border-radius:50%;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);cursor:pointer}
.iconbtn:active{background:var(--line)}
.langs button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:11.5px;font-weight:600;padding:5px 6px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- hero ---------- */
/* The first thing on the screen says what the screen is for, so it is allowed
   to be the biggest thing on it. */
.hero{padding:30px 0 18px}
.hero h1{margin:0 0 10px;font-size:32px;line-height:1.24;letter-spacing:-.7px;font-weight:800;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14.5px}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin:14px 0;
}
.card h2{margin:0 0 4px;font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.step{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:800;margin-right:8px;vertical-align:2px;
}
/* The one thing to press is the brightest thing on the screen. Blue on
   near-black is a link's colour, and the page has real links - these are not
   them. */
.btn{
  appearance:none;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
  padding:15px 18px;width:100%;background:var(--btn);color:var(--btn-ink);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s,transform .06s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.btn[disabled].busy{cursor:progress;opacity:.55}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
input[type=text],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 14px;
}
input[type=text]:focus{border-color:var(--text)}
textarea{resize:vertical;min-height:76px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
label.fieldlabel{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.hint{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.hint code{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:11.5px;word-break:break-all}

/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:13.5px;min-height:20px}
.spinner{
  /* inline-block, not the default inline: a <span> ignores width and height,
     so every spinner sitting in a line of text — the picker, the bus wait, the
     bike load — was rendering as a 2px sliver. As a flex item this is
     blockified anyway, so the places that already worked are unchanged. */
  display:inline-block;vertical-align:-3px;
  width:16px;height:16px;border-radius:50%;flex:none;
  border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad)}

.banner{border-radius:var(--radius);padding:17px 18px;border:1px solid;display:flex;gap:13px;align-items:flex-start}
.banner .ico{font-size:22px;line-height:1.1;flex:none}
.banner h3{margin:0 0 4px;font-size:17.5px;font-weight:800;letter-spacing:-.3px;line-height:1.34}
.banner p{margin:0;font-size:13.5px;opacity:.92}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--text)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--text)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--text)}
.banner.neutral{background:var(--surface2);border-color:var(--line);color:var(--text)}
.banner h3{color:inherit}
.banner.ok h3{color:var(--ok)}
.banner.warn h3{color:var(--warn)}
.banner.bad h3{color:var(--bad)}
.banner p{color:var(--muted)}
/* One <li> per disrupted line, each with its own summary, its own live-train
   note and its own 「原文を見る」 fold. Stacked with nothing between them, two
   lines read as one long paragraph and the reader cannot see where the first
   railway's story ends. A rule between them is all it takes. */
.banner ul{color:var(--text)}
.banner ul li{margin:0}
/* Derived from the text, not from --line. Each banner has its own tint behind
   it (red, amber, green), and a fixed near-black rule disappeared into all
   three. A share of the ink that is already readable on that ground is
   readable as a line on it too, in either theme. */
.banner ul li + li{margin-top:13px;padding-top:13px;
  border-top:1.5px dashed color-mix(in srgb, var(--text) 38%, transparent)}

/* A heading, not a label. Small caps at 13px with letter-spacing reads as
   chrome; these introduce the content and should look like it. */
h2.section{font-size:15px;letter-spacing:-.2px;color:var(--text);margin:26px 0 10px;font-weight:800}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);
}
.item .bar{width:3px;align-self:stretch;border-radius:99px;background:var(--faint);flex:none;min-height:34px}
/* The row is a row. It already says which line it is (the bar, in the
   railway's colour) and what is wrong (the word, on the right); washing the
   whole card in red as well put a second block of colour under the one that
   the verdict above is already made of. The border carries it. */
.item.alert{border-color:var(--bad-line)}
.item.unknown{border-color:var(--warn-line)}
.item.nodata{opacity:.7}
.board:empty{display:none}
.board{margin-top:6px;padding:6px 9px;border-radius:9px;background:var(--ok-bg);
  border:1px solid var(--ok-line);color:var(--text);font-size:12.5px}
.board a{margin-left:4px}
.item.okrow{border-color:var(--ok-line);background:linear-gradient(var(--ok-bg),var(--ok-bg)),var(--surface)}
button.item{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s,transform .06s}
button.item:hover{border-color:var(--accent)}
button.item:active{transform:translateY(1px)}
.linkbtn{appearance:none;background:none;border:0;padding:6px 0 0;margin:0;font:inherit;font-size:13px;
  color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chipinfo:empty{display:none}
.chipinfo{margin-top:8px}
.chipinfo .msg{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.chipinfo .orig{margin-top:5px;line-height:1.55}
.rowacts{display:flex;gap:14px;align-items:center;margin-top:7px;flex-wrap:wrap}
.rowacts .linkbtn{padding:0}
.chip.fav{padding:0;overflow:hidden}
.chip.fav .favuse{appearance:none;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:3px 4px 3px 9px}
.chip.fav .favdel{appearance:none;background:none;border:0;font:inherit;color:var(--faint);cursor:pointer;padding:3px 8px 3px 4px;line-height:1}
.chip.fav .favdel:hover{color:var(--bad)}
.chip.fav:hover{border-color:var(--accent)}
.chip.quick{cursor:pointer}
.chip.quick:hover{border-color:var(--accent)}
/* places the user saved themselves, ahead of the built-in samples */
.chip.quick.saved{border-color:var(--accent);color:var(--accent);font-weight:800}
.item .body{min-width:0;flex:1}
.item .title{font-weight:800;font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.item .msg{font-size:13.5px;margin-top:7px;color:var(--text);word-break:break-word}
.item .msg .orig{display:block;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px;font-size:13.5px;line-height:1.55}
/* the status/cause/section line — the part every language gets, so it leads */
.summary{font-weight:700;line-height:1.5;margin:2px 0 4px}
.pill{
  font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap;
}
.pill.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.pill.bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.pill.code{font-weight:700;color:var(--text)}
.dist{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap;align-self:center}
.empty{color:var(--muted);font-size:13.5px;padding:12px 2px}

/* ---------- station picker ---------- */
/* A menu you pick from, not results you read. These rows reused .item, so
   eight suggestions arrived as eight rounded, shadowed cards 8px apart —
   the same weight as the verdict below them, and tall enough to push the
   judge button off screen. One surface, hairline rows, attached to the
   field it belongs to. */
.hits:empty{display:none}
/* floats over the form instead of pushing it: eight matches added 300px in
   the flow, which put the judge button below the fold on every keystroke */
.hitwrap{position:relative}
.hits{
  position:absolute;left:0;right:0;top:100%;z-index:15;
  max-height:min(46vh,300px);overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;
  box-shadow:var(--shadow);
}
input.hasHits{border-radius:12px 12px 0 0}
.routemap{display:block;margin:0 0 6px;border:1px solid var(--line);border-radius:10px}
.maplegend{display:flex;flex-wrap:wrap;gap:3px 14px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.maplegend i{width:9px;height:9px;border-radius:50%;flex:none}
.maplegend svg{flex:none;display:block}
.routefoot .dep{color:var(--accent);font-weight:700;white-space:normal}
/* the small drawing, and the handle that says it opens */
.mapwrap{position:relative}
.mapexpand{
  position:absolute;top:7px;right:7px;appearance:none;cursor:pointer;
  width:30px;height:30px;line-height:1;font-size:15px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);opacity:.92;
}
.mapexpand:hover{border-color:var(--accent);color:var(--accent)}
/* Two pictures of the same trip, one switch. Sits opposite the expander so the
   two controls on the drawing are not in each other's way. */
.mapmode{
  position:absolute;top:7px;left:7px;display:flex;gap:2px;padding:2px;
  border-radius:10px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.mapmode button{
  appearance:none;border:0;background:none;color:var(--muted);font:inherit;
  font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.mapmode button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.mapmode button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.maphead .mapmode{position:static;box-shadow:none;flex:none}
/* A diagram is read by running along it, so it scrolls rather than zooms. */
.mapschema{position:absolute;inset:0;overflow:auto;background:var(--bg);
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  /* one finger pans, two fingers are ours */
  touch-action:pan-x pan-y}
.mapschema.hidden{display:none}
/* The stage stretches its SVG to fill, which is right for the map and wrong
   here: this one is sized in pixels so it can be zoomed and scrolled, and a
   width:100% inherited from the stage quietly cancelled every zoom. */
.mapstage .mapschema svg{display:block;width:auto;height:auto;max-width:none}
/* no tiles in a diagram, so nothing to credit */
body[data-mapmode="schema"] .mapcredit{display:none}
/* Full screen, over everything, with its own background: the page behind must
   not show through or the map reads as a floating scrap. */
.mapmodal{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;
}
.mapmodal.hidden{display:none}
.mapstage{
  position:relative;flex:1 1 auto;min-height:0;
  /* the browser must not claim the gestures — every touch here is the map's */
  touch-action:none;overscroll-behavior:contain;
}
.mapstage svg{display:block;width:100%;height:100%;background:var(--surface2)}
/* the tiles are scenery: they never need to answer a tap, and telling the
   browser the group is about to move keeps the transform on the compositor */
#mapTiles{pointer-events:none;will-change:transform}
#mapInk{pointer-events:none;will-change:transform}
.maphead{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.maphead .t{font-weight:800;font-size:15px;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapbtn{
  appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  color:var(--text);border-radius:10px;width:38px;height:38px;font-size:17px;line-height:1;flex:none;
}
.mapbtn:hover{border-color:var(--accent);color:var(--accent)}
.maptools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.maptools .mapbtn{box-shadow:var(--shadow)}
.mapfoot{padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.mapfoot .maplegend{margin:0}
.maplegend .mapcredit{margin-left:auto;color:var(--faint)}
.maplegend .mapcredit a{color:inherit;text-decoration:underline}
/* The map is background and has to stay there. The standard sheet has red
   expressways in it, and red is the one colour this app reserves for a line
   that has stopped — so the tiles are turned down to 0.4 everywhere, until
   they read as texture under the route rather than as a picture of their own.
   The full-screen map keeps more of its colour (it was opened to be read), but
   not more of its weight. Both invert on the dark theme, where a bright map
   would glare. */
.routemap .tiles{opacity:.4;filter:saturate(.45) contrast(.95)}
#mapTiles{opacity:.4;filter:saturate(.8)}
@media (prefers-color-scheme: dark){
  .routemap .tiles{opacity:.4;filter:saturate(.3) invert(.92) hue-rotate(180deg) contrast(.85)}
  #mapTiles{opacity:.4;filter:saturate(.45) invert(.92) hue-rotate(180deg) contrast(.9)}
}
/* While a field has focus the page gets room below it, so its heading can be
   scrolled all the way to the top even on the opening screen where there is
   otherwise nothing underneath. Without this the second step cannot be lifted
   and its suggestions stay behind the keyboard. */
body.imefocus{padding-bottom:70vh}
button.hit{
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:none;border:0;border-top:1px solid var(--line);padding:9px 13px;
}
button.hit:first-child{border-top:0}
button.hit:hover,button.hit:focus-visible,button.hit:active{background:var(--surface2)}
.hit .name{font-size:14px;font-weight:700;line-height:1.35;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.hit .lines{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.hits .empty{padding:10px 13px}
.linechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  display:inline-flex;align-items:center;gap:6px;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.updated{font-size:12px;color:var(--faint);margin-top:10px}
/* Quiet, and clearly not part of the verdict above it. */
.nextline{margin:14px 0 0;padding-left:11px;border-left:2px solid var(--line);
  color:var(--muted);font-size:13.5px;line-height:1.7}
/* .trainroute was never styled, so the browser drew its default disclosure
   triangle — and because the summary wraps a block element it got a line of
   its own above the row. Same treatment as the bus rows. */
/* Which rows open and which do not was guesswork: a bus stop expands on tap,
   a station card does not, and both look identical. Give anything expandable a
   chevron that turns, so "no chevron" reliably means "nothing under here". */
/* The card header is .title, the inner rows are .stopname. The first attempt
   marked only .stopname, so the bus-stop cards — the very things that open —
   showed nothing and the change was invisible. Mark both. */
details.busroute>summary .stopname::after,
details.trainroute>summary .stopname::after,
details.busroute>summary .title::after,
details.trainroute>summary .title::after{content:" ›";color:var(--accent);font-weight:700;
  display:inline-block;transition:transform .15s}
details.busroute[open]>summary .stopname::after,
details.trainroute[open]>summary .stopname::after,
details.busroute[open]>summary .title::after,
details.trainroute[open]>summary .title::after{transform:rotate(90deg)}
details.busroute>summary:hover .stopname,details.trainroute>summary:hover .stopname{color:var(--accent)}
details.busroute>summary,details.trainroute>summary{cursor:pointer;list-style:none}
details.busroute.sub>summary .pill,details.trainroute.sub>summary .pill{margin-left:6px}
details.busroute.sub[open]>summary .stopname,details.trainroute.sub[open]>summary .stopname{font-weight:600}
details.busroute>summary::-webkit-details-marker,details.trainroute>summary::-webkit-details-marker{display:none}
details.busroute>summary::marker,details.trainroute>summary::marker{content:""}
.stoplist{border-left:2px solid var(--line);margin-left:6px;padding-left:0}
/* Each way of getting there is its own card. They used to sit in one .stoplist,
   whose left rule ran unbroken from the first route to the last and read as a
   single journey — 池袋→祖師ヶ谷大蔵 offers several lines, and at a glance they
   looked like one long trip. Inside a card the rule stays, because there it
   really does mean "and then". */
.routes{display:flex;flex-direction:column;gap:10px}
.route{position:relative;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);padding:13px 14px 9px 14px;overflow:hidden}
.route.numbered{padding-left:38px}
.routeno{position:absolute;left:12px;top:15px;width:19px;height:19px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* the card itself marks the start now, so the top row needs no dot of its own */
.route > .stoprow{padding-left:0}
/* A route reads as a strip map: the stations anchor it, the line sits between
   them in the operator's own colour, and the status pills line up on the right
   so one glance finds the one that is not green. The old single line —
   「山手線 (秋葉原 → 渋谷) 平常運転 ➔ 渋谷乗換 ➔ 半蔵門線 (…) 平常運転」 —
   put four kinds of information in one wrapping sentence. */
.legs{display:grid;grid-template-columns:16px 1fr auto;gap:0 10px;align-items:center}
.legs .stop{grid-column:2/4;font-weight:700;font-size:14.5px;padding:2px 0;min-width:0}
.legs .mark{grid-column:1;width:11px;height:11px;border-radius:50%;background:var(--surface);
  border:2.5px solid var(--faint);justify-self:center;flex:none}
.legs .bar{grid-column:1;justify-self:center;width:5px;border-radius:3px;height:100%;min-height:34px}
.legs .leg{grid-column:2;padding:8px 0;min-width:0}
.legs .legname{font-weight:800;font-size:14px;color:var(--text);display:flex;align-items:center;gap:7px}
.legs .legname .swatch{width:10px;height:10px;border-radius:3px;flex:none}
.legs .legmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.legs .legpill{grid-column:3;justify-self:end}
.legs .legpill .pill{margin:0}
.routefoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
  padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.routefoot b{color:var(--text)}
.routefoot details{width:100%}
/* the opener is a control, not another stop on the line */
.routefoot details > summary .stoprow{padding-left:0}
.routefoot details > summary .stopdot{display:none}
.routefoot details > summary .stopname{color:var(--accent);font-weight:700;text-decoration:underline;
  text-underline-offset:3px}

/* the bus rows put their first .stoprow inside a <details>, where the dot's
   left:-5.5px lands on the card's own border and reads as a stray mark */
.route > .stoprow > .stopdot,
.route > details > summary .stoprow > .stopdot{display:none}
.route > details > summary .stoprow{padding-left:0}
.stoprow{display:flex;align-items:center;gap:8px;padding:5px 0 5px 12px;position:relative;font-size:13.5px;flex-wrap:wrap}
.stopdot{width:9px;height:9px;border-radius:50%;background:var(--faint);position:absolute;left:-5.5px;flex:none}
.stoprow:first-child .stopdot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.stoprow.hit{background:var(--bad-bg);border-radius:8px}
.stoprow.ok{background:var(--ok-bg);border-radius:8px}
.stoprow.hit .stopdot{background:var(--bad)}
.stopname{min-width:0}
details.sect{border:0;background:none;padding:0;margin:26px 0 0}
details.sect>summary{cursor:pointer;list-style:none;font-size:14.5px;
  letter-spacing:-.1px;color:var(--text);font-weight:800;padding:8px 0}
details.sect>summary:hover{color:var(--accent)}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary::before{content:"▸ ";color:var(--accent)}
details.sect[open]>summary::before{content:"▾ "}
.foldcount{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);margin-left:8px;font-size:12px}
details.fold{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2)}
details.fold>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--accent)}
details.fold[open]>summary::before{content:"▾ "}
details.raw{margin-top:8px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--muted)}

footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;color:var(--faint);font-size:12.5px}
footer a{color:var(--muted)}
footer p{margin:0 0 7px}
/* Sticks BELOW the sticky header, not at 0 — at 0 it lands behind the header
   (z-index 19 against 20) and is never seen. The offset is the header's own
   height, measured at runtime because it depends on the phone's font size. */
.tripbar{position:sticky;top:var(--head-h, 57px);z-index:19;background:var(--surface);
  border-bottom:1px solid var(--line)}
.tripbar .wrap{display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px}
.navback{
  appearance:none;border:0;background:none;color:var(--text);cursor:pointer;flex:none;
  width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.navback:hover{background:var(--surface2)}
.navback:focus-visible{outline:2px solid var(--text);outline-offset:-3px}
.tripend{border-radius:9px;padding:3px 7px}
.tripend:hover{background:var(--surface2)}
.tripend:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.tripbar.noto .triparrow,.tripbar.noto #tripTo{display:none}
.tripend{flex:1 1 0;min-width:0;appearance:none;border:0;background:transparent;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.tripend:last-of-type{text-align:right}
.tripend.empty{color:var(--faint);font-weight:600}
.triparrow{flex:none;color:var(--faint);font-size:13px}
/* Offered where the value was just typed, not parked on a button elsewhere —
   and gone once taken, so there is no 「登録済み」 state to read. */
.favoffer{margin-top:8px}
.favoffer button{appearance:none;border:0;background:transparent;padding:2px 0;
  font:inherit;font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline}
.orig-fold > summary{font-size:12.5px;color:var(--muted);padding:3px 0}
.orig-fold .orig{display:block}
.hidden{display:none!important}
@media (max-width:420px){
  .hero h1{font-size:27px}
  .brand span{font-size:14px}
  .langs button{padding:5px 7px;font-size:12px}
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= the answer, said once, in one block =================

   The scan's verdict used to be a tinted card with coloured text, the same
   shape as every other card on the page. It is not the same as every other
   card: it is the whole reason the page was opened, and it is read at arm's
   length on a platform. So it is filled, and it carries the one line that
   matters at the size of a headline.

   Only this one block is filled. The route verdict below stays outlined,
   because by then the reader is comparing things and a wall of colour behind
   the comparison would be shouting over it. */
.banner.solid{border:0;padding:20px;color:#fff;align-items:flex-start}
.banner.solid.ok{background:var(--ok-solid)}
.banner.solid.bad{background:var(--bad-solid)}
.banner.solid.warn{background:var(--warn-solid)}
.banner.solid.neutral{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.banner.solid h3{font-size:25px;line-height:1.24;letter-spacing:-.8px;color:inherit;margin:0 0 7px}
.banner.solid.ok h3{font-size:21px;letter-spacing:-.5px}
.banner.solid p{color:rgba(255,255,255,.87);font-size:13.5px;opacity:1}
.banner.solid.neutral p{color:var(--muted)}
.banner.solid .btext{min-width:0;flex:1}
/* the eyebrow is the count - what the headline is one of */
.banner.solid .eyebrow{
  display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  margin:0 0 9px;color:inherit;opacity:.92;
}
.banner.solid .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
/* a circle badge, not a loose emoji: the tick has to read as a state, not as
   decoration sitting next to the words */
.banner.solid .bicon{
  width:32px;height:32px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.22);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
}
.banner.solid.neutral .bicon{background:var(--line);color:var(--text)}
/* where and when the scan was, above the verdict - the verdict itself should
   carry nothing but the verdict */
.scanmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--muted);margin:0 0 10px}
/* no ::before dot here - autoScanBadge already begins with one of its own,
   and two indicators for one state read as two states */
.scanmeta .live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}
.scanmeta .linkbtn{padding:0;margin-left:auto;font-size:12.5px}

/* ---------------- status as a word, not as a badge ----------------
   Twelve rows each carrying a filled pill made twelve small blocks of colour
   competing with the one line colour that identifies the railway. The state is
   a word; colour it and put it where the eye scans for it - the right edge,
   in a column. */
/* Top-aligned, in a column: the state belongs beside the name it describes,
   not halfway down whatever the operator happened to write underneath. */
.rowend{margin-left:auto;align-self:flex-start;flex:none;padding-left:10px;max-width:42%;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.statustext{font-size:12.5px;font-weight:800;white-space:nowrap;letter-spacing:-.1px}
.statustext.ok{color:var(--ok)}
.statustext.bad{color:var(--bad)}
.statustext.warn{color:var(--warn)}
.statustext.none{color:var(--faint)}
.rowend .pill{display:inline-block;margin:0}

/* the railway's own code, in the railway's own colour */
.lbadge{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;
  font-size:11px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--faint);
  white-space:nowrap;flex:none;
}
/* The number on the station's own sign. Same shape as the line badge above,
   smaller, because here it sits in front of a name rather than instead of one.

   Only inside 「途中の駅を見る」. That list is opened to answer one question —
   which stop do I get off at — and it is read against the sign on the platform,
   where the number is what matches. On the card itself the three stations are
   already named in full and the numbers were repetition. */
.scode{
  display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;
  font-size:10.5px;font-weight:800;color:#fff;background:var(--faint);
  white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;
}

/* ---------------- the departure leads the card ----------------
   A route card used to open with "7駅" and end with the departure times in
   grey. The times are the only thing on the card that is about now, and the
   only thing that differs between two cards on the same platform - so they go
   first, at the size the number deserves. */
.rhead{display:flex;align-items:baseline;gap:6px 11px;flex-wrap:wrap;margin:0 0 10px}
.rhead:empty{display:none}
.rhead .nextdep{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.deptime{font-size:27px;font-weight:800;letter-spacing:-1.2px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--text)}
.deprest{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rmeta b{color:var(--text);font-weight:800}

/* the one the app would take */
.route.best{border-color:var(--ok-solid);border-width:1.5px}
/* and the exception to the order: much shorter, but with a notice on it */
.route.short{border-color:var(--warn-line);border-width:1.5px}
.shortstrip{
  margin:-13px -14px 12px;padding:7px 14px;background:var(--warn-solid);color:#fff;
  font-size:12px;font-weight:800;letter-spacing:-.1px;display:flex;align-items:center;gap:6px;
}
.route.short.numbered .shortstrip{margin-left:-38px;padding-left:38px}
.route.short.numbered .routeno{top:44px}
.beststrip{
  margin:-13px -14px 12px;padding:7px 14px;background:var(--ok-solid);color:#fff;
  font-size:12px;font-weight:800;letter-spacing:-.1px;display:flex;align-items:center;gap:6px;
}
.route.best.numbered .beststrip{margin-left:-38px;padding-left:38px}
.route.best.numbered .routeno{top:44px}

/* ---------------- a section is a thing, with a face ---------------- */
.blockhead{display:flex;align-items:center;gap:11px;margin:0 0 12px}
.blocktile{
  width:36px;height:36px;border-radius:11px;flex:none;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--line);
}
.blockhead .bt{font-size:16px;font-weight:800;letter-spacing:-.3px;min-width:0}

/* ---------------- is this trip affected: one picture ----------------
   The sentence 「この区間は影響を受けます」 names a section without drawing it.
   Two ends and what sits between them is the whole question, and it fits in
   one strip. */
.tripstrip{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;
  gap:0 9px;margin:14px 0 6px}
.tripstrip.clear{grid-template-columns:auto 1fr auto}
.tsdot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.tsrail{height:0;border-top:2.5px dotted currentColor;opacity:.75;min-width:18px}
.tripstrip.clear .tsrail{border-top-style:solid;opacity:.5}
.tsx{width:22px;height:22px;border-radius:50%;flex:none;background:var(--bad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.tsnames{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;font-weight:700;color:var(--muted)}
.tsnames .end{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36%}
.tsnames .mid{color:var(--bad);text-align:center;flex:1 1 auto;min-width:0}
.banner.warn .tsx{background:var(--warn)}
.banner.warn .tsnames .mid{color:var(--warn)}

/* ================== one question per screen ==================

   The pages are shown and hidden in place - the same DOM, the same state, no
   re-fetching, and the window keeps doing the scrolling. That last part is why
   this is cheap: every measurement the page already makes (the lift that keeps
   a field clear of the keyboard, the scroll that puts a heading under the
   header, the anchor that stops the bus block from jumping) goes on working
   because nothing about scrolling changed. */
.page{display:none}
.page.show{display:block;animation:pageIn .22s cubic-bezier(.32,.72,0,1)}
/* Every page starts the same distance below the bar.

   It did not: pages 1, 3, 5 and 6 begin with something that happens to carry a
   margin or padding of its own (a hero, a card, a heading) and got 26-33px;
   pages 2 and 4 begin with a plain container and got nothing at all, so the
   answer sat flush against the bar. The gap belongs to the page, not to
   whatever it happens to begin with — so the page owns it, and the first thing
   inside gives up its own. */
.page.show{padding-top:22px}
.page.show > :first-child{margin-top:0}
.page.show > .hero{padding-top:0}
.page.show > :first-child > :first-child{margin-top:0}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}}
@media (prefers-reduced-motion: reduce){.page.show{animation:none}}

/* The one thing to do next, pinned where the thumb already is.

   Two things were making it too tall on a real phone. Its button carried the
   same 15px padding as a button in the middle of a card, where it has a whole
   page to sit in; and it added the gesture bar's height on top — which inside
   the Android app has already been added once, because MainActivity pads the
   root view by the system bars. Two allowances for one gesture bar. */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  border-top:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  padding-bottom:env(safe-area-inset-bottom);
}
/* inside the app the inset is already in the view's padding */
body.inapp .bottombar{padding-bottom:0}
.bottombar .wrap{padding-top:8px;padding-bottom:8px}
.bottombar .btn{padding:13px 18px}
.bottombar .bb{display:none}
.bottombar .bb.on{display:block}
.bottombar.hidden{display:none!important}
/* while a field has focus the keyboard is where this bar would be */
body.imefocus .bottombar{display:none}

/* A scan landed while the reader had moved on. Nothing is rewritten under
   them - the chip says the answer changed and waits to be asked. */
.updatechip{
  position:fixed;left:12px;right:12px;top:calc(var(--head-h, 57px) + 52px);z-index:30;
  max-width:736px;margin:0 auto;
  display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--warn-line);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.85);
  font-size:13px;font-weight:700;color:var(--text);cursor:pointer;
  animation:drop .22s ease-out;
}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion: reduce){.updatechip{animation:none}}
.updatechip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.updatechip em{margin-left:auto;font-style:normal;color:var(--warn);font-weight:800;font-size:12.5px}
.updatechip:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* A section that has a page to itself is not a fold any more - it is the page.
   The chevron stays, because it still opens and shuts. */
#page5 details.sect,#page6 details.sect,#page4 details.sect{margin-top:18px}
</style>
</head>

<div class="topbar">
  <div class="wrap">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">

<!-- The strip that named the trip is now the page bar as well. It carries the
     one step back, and the two ends of the trip are the way to jump straight to
     the page that owns each of them: the origin to the first page, the
     destination to where it is typed. That is what the page dots were for, and
     it says where it goes instead of saying a number. -->
<div id="tripBar" class="tripbar hidden">
  <div class="wrap">
    <button type="button" id="navBack" class="navback" aria-label="">&lsaquo;</button>
    <button type="button" id="tripFrom" class="tripend"></button>
    <span class="triparrow" aria-hidden="true">&rarr;</span>
    <button type="button" id="tripTo" class="tripend"></button>
  </div>
</div>

<!-- Shown when a scan lands while the reader has moved on. Nothing is changed
     under them; the answer is waiting on page 2 when they want it. -->

</div>

<div class="wrap">

  <!-- ============================ 1. where from ============================ -->
  <section class="page" id="page1">
    <div class="hero" style="margin-bottom:12px">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroLead"></p>
    </div>

    <section class="card" id="scanCard">
      <h2><span data-i18n="scanTitle"></span></h2>
      <p class="sub" data-i18n="scanSub"></p>
      <div class="status" id="scanStatus"></div>

        </details>

        <!-- Landing late is the moment this app is most needed and least able
             to help: the reader is not at a station yet, the clock that matters
             is in the future, and the trains stop soon. The flight data covers
             two airlines, so the arrival time is typed rather than looked up —
             the reader has it on their boarding pass, and typing it makes the
             feature work for every airline instead of two. -->
        <details class="fold" id="sectAirport" style="margin-top:12px">

         comes straight here, and the station it decided on is the first thing
         the reader sees — the confirmation that used to be the reason for
         making them press a second button, shown without making them wait for
         it. It is a state of this page rather than a screen of its own: a
         separate screen would flash and vanish on a fast reply, and the back

    <div id="scanWait" class="scanwait hidden" aria-live="polite">

           It sits under the verdict, not under the line list. With four lines
           disrupted the list runs for two screens, and an explanation of a
           button that is always visible must be visible too. It cannot push

   Two separate ODPT endpoints, each with its own key — a key is rejected (403)
   by the other host:

     pub  api.odpt.org            … public data (Tokyo Metro, Toei, …)
     chl  api-challenge.odpt.org  … challenge-only data (JR East, Tobu, Keikyu, …)

   Both send Access-Control-Allow-Origin: *, so the browser calls them directly
   and the page needs no server. Anyone who opens the page can read these keys.
   To hide them: blank out a key and that host's requests go to its proxy path
   instead, where httpd appends acl:consumerKey server-side (odpt-proxy.conf). */
const SOURCES = {
  pub: {
    key:  "b0mg7xyln1e8yd2d2uh2z4hea92r4zjphrkqsvmuzjqos1cdxi1ovwgoeoul7g78",
    live: "https://api.odpt.org/api/v4/",

  },

    live: "https://api-challenge.odpt.org/api/v4/",
    proxy:"/odpt-challenge/api/v4/"
  }
};
Object.keys(SOURCES).forEach(k => { SOURCES[k].base = SOURCES[k].key ? SOURCES[k].live : SOURCES[k].proxy; });

/* Operators that actually publish non-empty odpt:TrainInformation, per host.
   Station and Railway records use odpt.Operator:JR-East, while JR East's train
   information is published under odpt.Operator:jre-is — the railway id is the
   reliable join key between the two. */
const COVERAGE = {
  pub: ["TokyoMetro","Toei","TWR","YokohamaMunicipal","MIR","TamaMonorail"],
  chl: ["JR-East","Tobu","Keikyu","Keio","Tokyu","Seibu"]
};
/* Operators that publish no service information at all, but do publish complete
   route data — odpt:Railway with a full odpt:stationOrder — so the trip itself
   can still be answered: which line runs the whole way, which stations it calls
   at, how far it is. Whether it is running today, we cannot say, and the panel
   says so rather than implying all is well.

   These three are the only ones in that position. Every other operator without
   service information also has no stationOrder (measured across both hosts), so
   adding them would put unreachable stations in the index — including ones in
   Sendai and Kansai that collide by name with Tokyo stations. */
const COVERAGE_SILENT = {
  pub: ["Yurikamome"],
  chl: ["Odakyu","Sotetsu"]
};
const SILENT_OPERATORS = new Set(
  COVERAGE_SILENT.pub.concat(COVERAGE_SILENT.chl).map(op => "odpt.Operator:" + op)
);
const COVERED_OPERATORS = new Set(
  COVERAGE.pub.concat(COVERAGE.chl)
    .concat(COVERAGE_SILENT.pub).concat(COVERAGE_SILENT.chl)
    .map(op => "odpt.Operator:" + op)
);
/* The bus operators this API actually serves in the Kanto area. Measured, not
   assumed: of the twenty-odd Kanto bus feeds in the ODPT catalogue, most are
   static GTFS zips for community services, and 京王バス and 小田急バス are marked
   【提供終了】 — their stops come back empty from the API. These four answer.

     都営      渋谷 38 / 池袋 39 poles, 774 buses running
     東急バス   渋谷 93 poles, route patterns resolve (渋８２)
     西武バス   吉祥寺 22 / 池袋 10 poles, 502 buses running
     相鉄バス   横浜 51 poles (浜7 横浜駅〜横浜車庫)

   Every one of them answers on the same endpoints with the same fields, so
   this is a list where there used to be a name, and nothing else changes. */
const BUS_OPERATORS  = ["Toei", "TokyuBus", "SeibuBus", "SotetsuBus"];
const BUS_OPERATOR   = BUS_OPERATORS[0];   // the one the older wording names

/* one geo search per operator, merged. They do not overlap: each runs its own
   stops, and a stop belongs to exactly one of them. */
async function busPolesNear(lat, lon, radius){
  const chunks = await Promise.all(BUS_OPERATORS.map(op =>
    odpt("pub", "places/odpt:BusstopPole",
      { lat: lat, lon: lon, radius: radius, "odpt:operator": "odpt.Operator:" + op })
      .catch(() => [])));
  return [].concat.apply([], chunks);
}

   real delay in seconds, and it joins to VehiclePosition through trip_id — so
   no static GTFS is needed to say "this bus near you is N minutes late".
   bbox is the 2–98 percentile of live vehicle positions, used only to skip
   operators that clearly do not serve the area. [S,W,N,E] */

    v:"YokohamaMunicipalBus_vehicle", t:"YokohamaMunicipalBus_trip_update", a:"YokohamaMunicipalBus_alert" },
  { id:"KawasakiCityBus", ja:"川崎市バス",   en:"Kawasaki City Bus",     bbox:[35.500,139.531,35.618,139.757],
    v:"odpt_TransportationBureau_CityOfKawasaki_AllLines_vehicle",

  { id:"KawasakiTsurumiRinkoBus", ja:"川崎鶴見臨港バス", en:"Kawasaki Tsurumi Rinko Bus", bbox:[35.505,139.633,35.557,139.761],
    v:"odpt_KawasakiTsurumiRinkoBus_allrinko_vehicle",
    t:"odpt_KawasakiTsurumiRinkoBus_allrinko_trip_update", a:null },
  { id:"KeiseiTransitBus", ja:"京成バス千葉ウエスト", en:"Keisei Bus Chiba West", bbox:[35.650,139.893,35.729,139.932],
    v:"odpt_KeiseiTransitBus_AllLines_vehicle", t:"odpt_KeiseiTransitBus_AllLines_trip_update",
    a:"odpt_KeiseiTransitBus_AllLines_alert" }
];
const RT_BBOX_PAD  = 0.05;   // ~5 km — operators outside this are not fetched
const RT_NEAR_M    = 1500;   // a vehicle this close counts as "near you"
const RT_LATE_SEC  = 300;    // "significantly late" threshold
const SCAN_RADII     = [1500, 4000, 12000];
const BUS_RADIUS     = 800;   // one definition of "a stop you can walk to".
                              // The scan listed stops to 1000 m while the route
                              // search only considered 800 m, so a stop at 900 m
                              // appeared under 「最寄りのバス停」 and was then
                              // never checked for going anywhere.
const NEAR_STATION_M = 2500;             // stations further than this are not "around you"

/* odpt:Train — live train location, one record per train, with the delay in
   seconds. odpt:TrainInformation only ever gives a sentence 「遅れがでています」;

   Published by Toei and YokohamaMunicipal (public host) and JR-East, Tobu and
   Keikyu (challenge host) — Keikyu carries no odpt:delay field, only position.
   One bulk call per host covers every operator: ~8 KB and ~32 KB gzipped. */
const TRAIN_LATE_SEC = 300;  // a train this late is worth calling out
const TRAIN_SHOW_SEC = 60;   // below this it is ordinary running slack, not news

/* Service information and train positions go stale within minutes, so they may
   not be cached for the life of the page the way railway metadata is — the
   periodic rescan has to see new data. Static lists keep their plain cache. */
const LIVE_TTL_MS = 60000;
/* 収集サーバ。走行位置を貯めて「見合わせと言っているが列車は動いている」を出す。
   **落ちていてもアプリ本体は動くこと。** これは付加情報であって、前提ではない。 */
const PARTIAL_URL = "https://tyra.jp/rescue/pub/status.json";

/* GBFS bike share — the fallback when the train is not running. Both systems
   are reachable with the same public key. station_information is effectively
   static and only fetched once per session; station_status is the live part.

   Yokohama); HELLO CYCLING is far larger (859 KB) but is the only one present

   nothing nearby. */

const BIKE_MIN_PORTS = 3;    // fewer than this → also pull the heavier system
const BIKE_PAGE      = 5;    // ports per press of 「続きを表示」

function haversine(aLat,aLon,bLat,bLon){
  const R = 6371000, toRad = x => x*Math.PI/180;
  const dLat = toRad(bLat-aLat), dLon = toRad(bLon-aLon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

  if (!id) return "";
  const part = String(id).split(":").pop().split(".")[1] || "";
  return part.replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/_/g," ").trim();
}

async function odpt(src, path, params, opts){
  const s = SOURCES[src];
  const url = new URL(s.base + path, location.href);
  for (const k in (params||{})) if (params[k] != null) url.searchParams.set(k, params[k]);
  if (s.key) url.searchParams.set("acl:consumerKey", s.key);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), (opts && opts.timeout) || 20000);
  try{
    const res = await fetch(url.toString(), { signal: ctl.signal, cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* ------------------- minimal Protocol Buffers reader ------------------- */
/* GTFS Realtime feeds are protobuf. Only what this app reads is implemented:
   varints, length-delimited blocks and 32-bit floats — no schema, no library. */
function pbRead(buf){
  const out = [];
  let i = 0;
  while (i < buf.length){
    let key = 0, sh = 0, b;
    do { b = buf[i++]; key |= (b & 0x7f) << sh; sh += 7; } while (b & 0x80 && i < buf.length);
    const field = key >>> 3, wire = key & 7;
    if (wire === 0){
      /* int32 values are sign-extended to 10 bytes, so keep the low 32 bits
         and let |0 restore the sign — a plain accumulator would overflow */
      let lo = 0, s = 0;
      do { b = buf[i++]; if (s < 32) lo |= (b & 0x7f) << s; s += 7; } while (b & 0x80 && i < buf.length);
      out.push([field, lo]);
    } else if (wire === 2){
      let n = 0, s = 0;
      do { b = buf[i++]; n |= (b & 0x7f) << s; s += 7; } while (b & 0x80 && i < buf.length);
      out.push([field, buf.subarray(i, i + n)]); i += n;
    } else if (wire === 5){ out.push([field, buf.subarray(i, i + 4)]); i += 4; }
    else if (wire === 1){ out.push([field, buf.subarray(i, i + 8)]); i += 8; }
    else break;
  }
  return out;
}
const pbAll  = (fs, f) => fs.filter(x => x[0] === f).map(x => x[1]);
const pbOne  = (fs, f) => { const v = pbAll(fs, f); return v.length ? v[0] : null; };
const pbF32  = b => new DataView(b.buffer, b.byteOffset, 4).getFloat32(0, true);
const pbUtf8 = b => new TextDecoder("utf-8").decode(b);
/* TranslatedString -> plain text, preferring Japanese (the only language used) */
function pbText(b){
  if (!b) return "";
  const tr = pbAll(pbRead(b), 1).map(x => pbRead(x));
  const pick = tr.find(t => { const l = pbOne(t, 2); return l && pbUtf8(l).startsWith("ja"); }) || tr[0];
  const txt = pick && pbOne(pick, 1);
  return txt ? pbUtf8(txt) : "";
}
async function gtfsrt(feedId){
  const s = SOURCES.pub;
  const url = new URL(s.base + "gtfs/realtime/" + feedId, location.href);
  if (s.key) url.searchParams.set("acl:consumerKey", s.key);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try{
    const res = await fetch(url.toString(), { signal:ctl.signal, cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + feedId);
    return new Uint8Array(await res.arrayBuffer());
  } finally { clearTimeout(timer); }
}
const rtEntities = buf => pbAll(pbRead(buf), 2).map(e => pbRead(e));

/* ----------------------------- GBFS (bikes) ---------------------------- */
/* Plain JSON on the same host and the same key as everything else. GBFS has no
   query parameters — a feed is one whole file — so the filtering is all ours. */
async function gbfs(sysId, file){
  const s = SOURCES.pub;
  const url = new URL(s.base + "gbfs/" + sysId + "/" + file, location.href);
  if (s.key) url.searchParams.set("acl:consumerKey", s.key);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try{
    const res = await fetch(url.toString(), { signal:ctl.signal, cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for gbfs/" + sysId);
    return await res.json();
  } finally { clearTimeout(timer); }
}
/* Port locations barely change, so the big download happens once per session;
   only the live counts are re-fetched. Kept in memory rather than localStorage
   — HELLO CYCLING alone is 14,659 ports and would not fit the quota. */
async function bikePorts(sysId){
  if (cache.gbfs.has(sysId)) return cache.gbfs.get(sysId);
  const d = await gbfs(sysId, "station_information.json");
  const list = ((d && d.data && d.data.stations) || [])
    .filter(s => typeof s.lat === "number" && typeof s.lon === "number")
    .map(s => ({ id:s.station_id, lat:s.lat, lon:s.lon, name:s.name || "" }));
  cache.gbfs.set(sysId, list);
  return list;
}

const RE_NORMAL       = /平常|遅延はありません|遅れはありません|通常どおり|通常通り|正常/;
const RE_NORMAL_EN    = /normal|on schedule|no delay/i;

/* JR East marks informational posts with odpt:trainInformationStatus =「お知らせ」
   (Obon congestion forecasts, special trains for a festival next month …).
   Those must not raise the same alarm as a line that is actually stopped. */
const RE_NOTICE_STATUS = /お知らせ|案内/;
function classify(info){
  const txt = ((info && info.text) || "").replace(/\s+/g,"");
  const statusJa = info && info.statusJa ? String(info.statusJa) : "";
  if (RE_STRONG_ALERT.test(txt)) return "alert";          // happening now
  if (RE_NORMAL.test(txt) || RE_NORMAL_EN.test(txt)) return "normal";
  if (statusJa && RE_NOTICE_STATUS.test(statusJa)) return "unknown";
  if (statusJa && !RE_NORMAL.test(statusJa)) return "alert";
  return "unknown";
}

/* --- the operator's own words, in four languages ------------------------
   odpt:trainInformationText is Japanese prose, and prose is where the data
   runs out: of the 24 disrupted records on an ordinary afternoon exactly one
   carried an official English version, and no operator publishes Chinese or
   Korean at all. The structured fields tell a different story — status was on
   24/24 of them, cause on 22/24, range on 18/24 — and they are drawn from a
   closed vocabulary (six distinct statuses and six causes across all 142
   records that day). Translating that vocabulary by hand is exact, instant
   and needs no network, none of which a machine translation of the prose
   would be: 「人身事故のため運転を見合わせています」 came back from a free
   service as "is not allowed to operate … due to personal accidents", which
