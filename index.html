/* ------------------- bus route (which stops it serves) ----------------- */
/* the stop order comes from the route pattern (2 KB); the official multilingual
   names need a second, heavier call, so that one is only made when the list is
   actually shown */
async function busStops(patternId){
  const rec = cache.patterns.get(patternId);
  if (rec) return rec.stops;
  const pat = await odpt("pub", "odpt:BusroutePattern", { "owl:sameAs":patternId });
  const head = (pat || [])[0] || {};
  const order = (head["odpt:busstopPoleOrder"] || [])
    .slice().sort((a,b) => (a["odpt:index"] || 0) - (b["odpt:index"] || 0));
  const stops = order.map(o => ({ id:o["odpt:busstopPole"], ja:o["odpt:note"] || "", title:null }));
  cache.patterns.set(patternId, { stops, named:false, title:head["dc:title"] || humanizeId(patternId) });
  return stops;
}

/* Can I get to my destination from this stop?
   Walking every route of every nearby stop would be dozens of calls, so look it
   up from the other end: the stops around the destination list the same route
   pattern ids, and an intersection costs two geo calls plus a few patterns. */
async function loadBusReach(){
  const orig = routeOrigin();
  const dest = routeDestination();
  /* fromHere = the boarding side is where the user actually is. When an origin
     is typed, the stops must come from there — never from the scan point. */
  const settle = (byStop, opt) => {
    state.busReach = Object.assign(
      { dest: dest || "", byStop: byStop || new Map(), stops: new Map(), fromHere: true, reason: "" }, opt || {});
  };

  if (!dest){
    /* null, not an empty result: an empty result renders as
       「「」へ直通できる停留所は…」 — a sentence quoting nothing. The stop list
       has its own wording for "no destination given". */
    state.busReach = null;
    return;
  }

  try{
    const idx = await getStationIndex().catch(() => null);
    if (!idx){ settle(); return; }

    const destCoords = getPlaceCoords(dest, idx);
    if (!destCoords){ settle(); return; }

    const destPoles = await busPolesNear(destCoords.lat, destCoords.lon, BUS_RADIUS);
    const destPat = new Map();
    destPoles.forEach(p => (p["odpt:busroutePattern"] || []).forEach(id => {
      if (!destPat.has(id)) destPat.set(id, []);
      destPat.get(id).push(p["owl:sameAs"]);
    }));
    if (!destPat.size){ settle(); return; }

    let originStops = [], originResolved = false, fromHere = true;
    if (orig) {
      const origCoords = getPlaceCoords(orig, idx);
      if (origCoords) {
        originResolved = true;
        fromHere = !state.position ||
          haversine(state.position.lat, state.position.lon, origCoords.lat, origCoords.lon) < 1200;
        const origPoles = await busPolesNear(origCoords.lat, origCoords.lon, BUS_RADIUS);

        if (origPoles.length) {
          originStops = groupPoles(origPoles, { lat:origCoords.lat, lon:origCoords.lon });
        }
      }
    }

    /* only fall back to "where I am now" when no origin was given — otherwise
       朝霞→池袋 would offer stops in 池袋, i.e. board at the destination */
    if (!originStops.length && !originResolved && state.bus && state.bus.stops) {
      originStops = state.bus.stops;
    }

    if (!originStops.length) {
      settle(null, { fromHere, reason: originResolved ? "noOriginStops" : "" });
      return;
    }

    const byStop = new Map();
    await Promise.all(originStops.slice(0,5).map(async g => {
      const pairs = [];
      g.poles.forEach(p => (p["odpt:busroutePattern"] || []).forEach(id => {
        if (destPat.has(id)) pairs.push({ id, from:p["owl:sameAs"] });
      }));
      const routes = [];
      await Promise.all(pairs.slice(0,10).map(async pair => {
        try{
          const stops = await busStops(pair.id);
          const ids = stops.map(x => x.id);
          const here = ids.indexOf(pair.from);
          if (here < 0) return;
          const nd = normLoose(dest);
          let at = -1, named = -1;
          destPat.get(pair.id).forEach(dp => {
            const k = ids.indexOf(dp);
            if (k <= here) return;
            if (at < 0 || k < at) at = k;
            if (stopMatches(stops[k], nd) && (named < 0 || k < named)) named = k;
          });
          if (named >= 0) at = named;
          if (at < 0) return;
          const rec = cache.patterns.get(pair.id) || {};
          if (routes.some(r => r.title === rec.title)) return;
          routes.push({ id:pair.id, title:rec.title || humanizeId(pair.id),
                        label:patternLabel(pair.id, stops),
                        stopsAhead:at - here, destName:stops[at].ja,
                        destShown:(stops[at].title && stops[at].title.en) || humanizeId(stops[at].id),
                        from:here, to:at });
        }catch(e){}
      }));
      if (routes.length){
        const nd = normLoose(dest);
        routes.forEach(r => { r.exact = stopMatches({ ja:r.destName, id:"" }, nd) ? 0 : 1; });
        routes.sort((a,b) => a.exact - b.exact || a.stopsAhead - b.stopsAhead);
        byStop.set(g.name, routes.slice(0,4));
      }
    }));
    settle(byStop, { fromHere, stops: new Map(originStops.map(g => [g.name, g])) });
  }catch(e){
    settle();
  }
}
/* 系統名 is the one bus string ODPT publishes in Japanese only: 「上６０ 上野公園行」.
   The stop names themselves are fine — every 都営 pole carries an official
   English title — but the route line on the pole sign is not. Both halves are
   recoverable from ids we already hold: the pattern id romanises the route
   number (odpt.BusroutePattern:Toei.Ue60.32401.1 → Ue60) and the last stop of
   the pattern is the destination, so no extra request and no romanisation
   table are needed. The Japanese is kept alongside — that is what is printed
   on the pole. */
function patternLabel(patternId, stops){
  const rec = cache.patterns.get(patternId) || {};
  const ja = rec.title || humanizeId(patternId);
  if (LANG === "ja") return { main:ja, sub:"" };
  const code = humanizeId(patternId);
  const last = stops && stops.length ? stops[stops.length - 1] : null;
  const dest = last ? ((last.title && last.title.en) || humanizeId(last.id)) : "";
  return { main: dest ? t("busRouteFor", { code:code, dest:dest }) : code,
           sub:  ja && ja !== code ? ja : "" };
}
function patternLabelHtml(label){
  return "<strong>" + esc(label.main) + "</strong>" +
    (label.sub ? ' <span lang="ja" style="color:var(--muted)">' + esc(label.sub) + "</span>" : "");
}
async function busStopsNamed(patternId){
  const stops = await busStops(patternId);
  const rec = cache.patterns.get(patternId);
  if (!rec.named){
    const poles = await odpt("pub", "odpt:BusstopPole", { "odpt:busroutePattern":patternId }).catch(() => []);
    const byId = new Map();
    poles.forEach(p => byId.set(p["owl:sameAs"], p));
    stops.forEach(st => {
      const p = byId.get(st.id);
      if (p){ st.title = p.title || null; if (!st.ja) st.ja = p["dc:title"] || ""; }
    });
    rec.named = true;
  }
  return stops;
}
/* romaji long vowels are spelled both ways (Kouenji / Kōenji / Koenji) */
function normLoose(v){ return normName(v).replace(/ou/g,"o").replace(/uu/g,"u").replace(/oo/g,"o"); }
/* Bus stops carry the place name plus an access suffix (駅前 / 東口 / 入口 …).
   Strip those and compare the cores exactly — substring matching claimed that
   「東京駅」was served by 「東京女子医大前」. */
const RE_STOP_SUFFIX = /(駅前広場|駅前|駅入口|駅東口|駅西口|駅南口|駅北口|駅中央口|駅高輪口|バスターミナル|ターミナル|東口|西口|南口|北口|中央口|高輪口|入口|停留所|前|口|駅|station|sta|mae|guchi)$/;
function stopCore(v){
  let n = normLoose(v);
  for (let i = 0; i < 3; i++){
    const cut = n.replace(RE_STOP_SUFFIX, "");
    if (cut === n || cut.length < 2) break;
    n = cut;
  }
  return n;
}
function stopMatches(st, dest){
  if (!dest || dest.length < 2) return false;
  const core = stopCore(dest);
  if (core.length < 2) return false;
  return [st.ja, st.title && st.title.en, humanizeId(st.id)].filter(Boolean).some(raw => {
    if (stopCore(raw) === core) return true;
    /* 「東京駅丸の内北口」 is a stop for 東京駅, but 「東京女子医大前」 is not:
       the station name has to be followed by 駅 / station */
    const n = normLoose(raw);
    return n.indexOf(core + "駅") === 0 || n.indexOf(core + "station") === 0 || n.indexOf(core + "sta") === 0;
  });
}
function upcomingStops(stops, nextId){
  const at = stops.findIndex(st => st.id === nextId);
  return at >= 0 ? stops.slice(at) : stops;
}
/* the destination typed in step 2, so matching stops can be flagged */
function routeDestination(){
  const p = routeFields();
  return (p && !p.error && p.destination) ? p.destination : "";
}
function routeOrigin(){
  const p = routeFields();
  return (p && !p.error && p.origin) ? p.origin : "";
}
function getPlaceCoords(query, idx){
  if (!query) return null;
  const m = idx && matchStations(query, idx);
  if (m){
    const s = m.stations.find(st => (st["geo:lat"] || st.lat) && (st["geo:long"] || st.lon || st.lng));
    if (s) return { lat: s["geo:lat"] || s.lat, lon: s["geo:long"] || s.lon || s.lng };
  }
  const places = searchPlaces(query);
  if (places && places.length && places[0].lat && places[0].lon){
    return { lat: places[0].lat, lon: places[0].lon };
  }
  return null;
}
function renderStops(stops, nextId){
  if (!stops.length) return '<div class="empty">' + esc(t("busRouteNone")) + "</div>";
  const upcoming = upcomingStops(stops, nextId);
  const dest = normLoose(routeDestination());
  const rows = upcoming.map((s,i) => {
    const name = LANG === "ja" ? (s.ja || humanizeId(s.id))
                               : ((s.title && s.title.en) || humanizeId(s.id));
    const hit = stopMatches(s, dest);
    const tag = i === 0 ? '<span class="pill ok">' + esc(t("busNextStop")) + "</span>"
              : i === upcoming.length - 1 ? '<span class="pill">' + esc(t("busTerminal")) + "</span>" : "";
    return '<div class="stoprow' + (hit ? " hit" : "") + '">' +
      '<span class="stopdot"></span><span class="stopname">' + esc(name) +
      (LANG !== "ja" && s.ja && s.ja !== name ? ' <span lang="ja" style="color:var(--muted)">' + esc(s.ja) + "</span>" : "") +
      "</span>" + tag +
      (hit ? ' <span class="pill bad">' + esc(t("busDestHit")) + "</span>" : "") +
    "</div>";
  }).join("");
  return '<div class="meta" style="margin-bottom:6px">' + esc(t("busRouteTitle",{ n:upcoming.length })) + "</div>" +
         '<div class="stoplist">' + rows + "</div>";
}

/* which of the buses on screen actually stops where you are going */
async function markBusDestinations(){
  const raw = routeDestination();
  const dest = normLoose(raw);
  const rows = $$("#busVehicles details.busroute");
  if (!rows.length) return;
  await Promise.all(rows.map(async det => {
    const tag = det.querySelector("summary .pill");
    if (!tag) return;
    if (!dest || dest.length < 2){ tag.className = "pill"; tag.textContent = t("busRouteOpen"); return; }
    try{
      const upcoming = upcomingStops(await busStops(det.dataset.pattern), det.dataset.next);
      const hits = upcoming.filter(st => stopMatches(st, dest)).length;
      tag.className = hits ? "pill bad" : "pill";
      tag.textContent = hits ? t("busGoesTo",{ q:raw }) : t("busRouteOpen");
      /* knowing the bus goes there is useless without knowing where to catch it */
      const board = det.querySelector(".board");
      if (board){
        board.innerHTML = "";
        if (hits){
          const groups = (state.bus && state.bus.stops) || [];
          for (const st of upcoming){
            const g = groups.find(x => x.poles.some(p => p["owl:sameAs"] === st.id));
            if (!g) continue;
            board.innerHTML = "🚶 " + esc(t("boardAt",{ stop:titleOf(g.title, g.name), dist:fmtDist(g.d) })) +
              " " + walkLink(g.poles[0]["geo:lat"], g.poles[0]["geo:long"]);
            break;
          }
        }
      }
    }catch(e){ /* leave the default label */ }
  }));
}

/* ---------------------- GTFS Realtime bus (delays) --------------------- */
function rtCandidates(pos){
  return GTFSRT_BUS.filter(o =>
    pos.lat >= o.bbox[0] - RT_BBOX_PAD && pos.lat <= o.bbox[2] + RT_BBOX_PAD &&
    pos.lon >= o.bbox[1] - RT_BBOX_PAD && pos.lon <= o.bbox[3] + RT_BBOX_PAD);
}
/* VehiclePosition: 1=trip{1=trip_id} 2=position{1=lat,2=lon} 7=stop_id 8=vehicle{1=id,2=label} */
function rtVehicles(buf, pos){
  const out = [];
  rtEntities(buf).forEach(e => {
    const v = pbOne(e, 4);
    if (!v) return;
    const vf = pbRead(v), p = pbOne(vf, 2);
    if (!p) return;
    const pf = pbRead(p), la = pbOne(pf, 1), lo = pbOne(pf, 2);
    if (!la || !lo) return;
    const lat = pbF32(la), lon = pbF32(lo);
    const trip = pbOne(vf, 1), veh = pbOne(vf, 8);
    const tid = trip ? pbOne(pbRead(trip), 1) : null;
    const vid = veh ? (pbOne(pbRead(veh), 2) || pbOne(pbRead(veh), 1)) : null;
    out.push({
      tripId: tid ? pbUtf8(tid) : "",
      label:  vid ? pbUtf8(vid) : "",
      lat, lon, distance: haversine(pos.lat, pos.lon, lat, lon)
    });
  });
  return out;
}
/* TripUpdate: 1=trip{1=trip_id} 2=stop_time_update{2=arrival,3=departure{1=delay}} 5=delay */
function rtDelays(buf){
  const map = new Map();
  rtEntities(buf).forEach(e => {
    const tu = pbOne(e, 3);
    if (!tu) return;
    const tf = pbRead(tu), trip = pbOne(tf, 1);
    const tid = trip ? pbOne(pbRead(trip), 1) : null;
    if (!tid) return;
    const top = pbAll(tf, 5);
    let val = top.length ? (top[0] | 0) : null;
    if (val == null){
      /* Seibu, Nishi-Tokyo, Yokohama and others leave the trip-level delay
         empty and only fill in per-stop values — take the next stop's */
      const stops = pbAll(tf, 2);
      for (let i = 0; i < stops.length && val == null; i++){
        const sf = pbRead(stops[i]), ev = pbOne(sf, 2) || pbOne(sf, 3);
        if (!ev) continue;
        const dv = pbAll(pbRead(ev), 1);
        if (dv.length) val = dv[0] | 0;
      }
    }
    if (val != null) map.set(pbUtf8(tid), val);
  });
  return map;
}
/* Alert: 10=header_text 11=description_text 8=url */
function rtAlerts(buf){
  const out = [];
  rtEntities(buf).forEach(e => {
    const al = pbOne(e, 5);
    if (!al) return;
    const af = pbRead(al);
    const head = pbText(pbOne(af, 10)), desc = pbText(pbOne(af, 11));
    if (!head && !desc) return;
    if (/^タイトル$/.test(head) && !desc) return;    // placeholder rows some feeds emit
    const url = pbText(pbOne(af, 8));
    if (!out.some(x => x.head === head && x.desc === desc)) out.push({ head, desc, url });
  });
  return out;
}

async function loadBusRt(pos){
  state.busRt = null;
  const cands = rtCandidates(pos);
  if (!cands.length) return;

  /* the vehicle feed is the small one (10–70 KB) and tells us who is actually
     nearby; the heavier trip_update is fetched only for those operators */
  const seen = await Promise.all(cands.map(async o => {
    try{
      const near = rtVehicles(await gtfsrt(o.v), pos).filter(v => v.distance <= RT_NEAR_M);
      return near.length ? { op:o, vehicles:near.sort((a,b) => a.distance - b.distance) } : null;
    }catch(e){ return null; }
  }));
  const active = seen.filter(Boolean);
  if (!active.length){ state.busRt = []; return; }

  await Promise.all(active.map(async a => {
    const [delays, alerts] = await Promise.all([
      a.op.t ? gtfsrt(a.op.t).then(rtDelays).catch(() => new Map()) : Promise.resolve(new Map()),
      a.op.a ? gtfsrt(a.op.a).then(rtAlerts).catch(() => [])        : Promise.resolve([])
    ]);
    a.alerts = alerts;
    a.vehicles.forEach(v => { v.delay = delays.has(v.tripId) ? delays.get(v.tripId) : null; });
    const known = a.vehicles.filter(v => v.delay != null).map(v => v.delay).sort((x,y) => x - y);
    a.stats = known.length
      ? { n:known.length, late:known.filter(d => d >= RT_LATE_SEC).length, median:known[Math.floor(known.length/2)] }
      : null;
  }));
  state.busRt = active;
}

function fmtDur(sec){
  const a = Math.abs(sec);
  if (a <= 30) return t("rtOnTime");
  const m = Math.floor(a/60), r = a % 60;
  const v = m ? t("rtDurMin",{ m, s:String(r).padStart(2,"0") }) : t("rtDurSec",{ s:a });
  return sec < 0 ? t("rtEarly",{ m:Math.max(1,Math.round(a/60)) }) : v;
}
function fmtDelay(sec){
  if (sec == null) return "";
  if (sec <= 30 && sec >= -30) return t("rtOnTime");
  if (sec < 0) return t("rtEarly",{ m:Math.round(-sec/60) });
  const m = Math.floor(sec/60), s = sec % 60;
  return m ? t("rtLateMin",{ m, s:String(s).padStart(2,"0") }) : t("rtLateSec",{ s:sec });
}
function renderBusRt(){
  const box = $("#busRt");
  const data = state.busRt;
  if (!data || !data.length){ box.innerHTML = ""; return; }

  box.innerHTML = '<div class="hint" style="margin:0 0 6px">' + esc(t("rtTitle")) + "</div>" +
    data.map(a => {
      const name = LANG === "ja" ? a.op.ja : a.op.en;
      const head = a.stats
        ? t("rtSummary",{ n:a.vehicles.length, late:a.stats.late, median:fmtDur(a.stats.median) })
        : t("rtSummaryNoDelay",{ n:a.vehicles.length });
      const rows = a.vehicles.slice(0,4).map(v => {
        const d = v.delay == null ? "" : fmtDelay(v.delay);
        const cls = v.delay != null && v.delay >= RT_LATE_SEC ? "bad" : v.delay != null && v.delay > 30 ? "warn" : "ok";
        return '<div class="meta" style="margin-top:4px">🚌 ' + esc(fmtDist(v.distance)) +
               (v.label ? " · " + esc(t("busNo")) + " " + esc(v.label) : "") +
               (d ? ' <span class="pill ' + cls + '" style="padding:1px 7px">' + esc(d) + "</span>" : "") + "</div>";
      }).join("");
      const alerts = (a.alerts || []).slice(0,3).map(al =>
        '<div class="msg"><span style="color:var(--muted);font-size:12.5px">' + esc(t("rtAlert")) + "</span>" +
        '<span class="orig" lang="ja">' + esc(al.head) + (al.desc ? " — " + esc(al.desc) : "") + "</span></div>").join("");
      return '<div class="item ' + (a.alerts && a.alerts.length ? "alert" : "") + '">' +
        '<div class="bar" style="background:var(--accent)"></div><div class="body">' +
        '<div class="title" style="font-size:14px">' + esc(name) +
          (a.stats && a.stats.late ? ' <span class="pill bad">' + esc(t("rtLateBadge",{n:a.stats.late})) + "</span>" : "") +
        "</div>" +
        '<div class="meta">' + esc(head) + "</div>" + rows + alerts +
      "</div></div>";
    }).join("") +
    '<p class="hint">' + esc(t("rtSource")) + "</p>";
  applyFolds();
}

/* ------------------------- bike share (GBFS) --------------------------- */
/* When the line you need is stopped, the useful answer is not another train.
   Docomo covers the 23 wards, Kawasaki and Yokohama and is the cheaper file,
   so it is asked first; HELLO CYCLING is only pulled in when Docomo turns up
   nothing, which is what happens in Saitama, Chiba and out west. */
async function loadBike(pos){
  const found = [];
  for (const sys of BIKE_SYSTEMS){
    try{
      const ports = await bikePorts(sys.id);
      /* a cheap box test first — these lists run to thousands of ports and
         haversine on every one of them is wasted work */
      const near = ports
        .filter(p => Math.abs(p.lat - pos.lat) < 0.012 && Math.abs(p.lon - pos.lon) < 0.015)
        .map(p => ({ port:p, distance:haversine(pos.lat, pos.lon, p.lat, p.lon) }))
        .filter(x => x.distance <= BIKE_RADIUS);
      if (near.length){
        const status = await gbfs(sys.id, "station_status.json").then(d => {
          const m = new Map();
          ((d && d.data && d.data.stations) || []).forEach(s => m.set(s.station_id, s));
          return m;
        }).catch(() => new Map());
        near.forEach(x => {
          const s = status.get(x.port.id);
          x.bikes   = s && typeof s.num_bikes_available === "number" ? s.num_bikes_available : null;
          x.docks   = s && typeof s.num_docks_available === "number" ? s.num_docks_available : null;
          x.renting = !s || s.is_renting !== false;
        });
        near.sort((a,b) => a.distance - b.distance);
        found.push({ sys, ports:near });
      }
    }catch(e){ /* one system failing must not take the whole section down */ }
    if (found.reduce((n,f) => n + f.ports.length, 0) >= BIKE_MIN_PORTS) break;
  }
  state.bike = found;
}

function renderBike(){
  const box = $("#bikeShare");
  if (!box) return;
  const data = state.bike;
  if (!data){ box.innerHTML = ""; applyFolds(); return; }
  if (!data.length){
    box.innerHTML = '<div class="empty">' + esc(t("bikeNone",{ m:BIKE_RADIUS })) + "</div>";
    applyFolds(); return;
  }
  box.innerHTML = '<div class="hint" style="margin:0 0 6px">' + esc(t("bikeHint")) + "</div>" +
    data.map(f => {
      const name  = LANG === "ja" ? f.sys.ja : f.sys.en;
      /* a port with no bike is a port you cannot use — count what is rentable */
      const avail = f.ports.reduce((n,p) => n + (p.renting && p.bikes ? p.bikes : 0), 0);
      /* The heading counts every port in range; the list shows the nearest few.
         Two readers in a row read the pair as a contradiction —「9台可能なのに
         全部0台」, then「17台のはずが11台」— because the number and the list
         describe different sets and nothing said so. The rows below now account
         for the rest explicitly, and the nearest port that actually has a bike
         is always among them. */
      /* Every port in range is already in hand — nothing more is fetched by
         looking further down the list. So rather than stopping at a fixed few
         and describing the rest in a sentence, show five and let the reader ask
         for the next five until there are none left. */
      const shown = f.ports.slice(0, f.shown || BIKE_PAGE);
      const usable = f.ports.find(p => p.renting && p.bikes > 0);
      if (usable && shown.indexOf(usable) < 0) shown.push(usable);
      const rest = f.ports.filter(p => shown.indexOf(p) < 0);
      const restAvail = rest.reduce((n,p) => n + (p.renting && p.bikes ? p.bikes : 0), 0);
      const rows = shown.map(p => {
        const n   = p.renting ? p.bikes : 0;
        const cls = n == null ? "" : n === 0 ? "bad" : n <= 2 ? "warn" : "ok";
        return '<div class="meta" style="margin-top:4px">🚲 ' +
          '<span class="pill ' + cls + '" style="padding:1px 7px">' +
            esc(n == null ? t("bikeUnknown") : t("bikeCount",{ n })) + "</span> " +
          esc(p.port.name) + " · " + esc(fmtDist(p.distance)) + " " +
          walkLink(p.port.lat, p.port.lon) + "</div>";
      }).join("");
      return '<div class="item"><div class="bar" style="background:var(--accent)"></div><div class="body">' +
        '<div class="title" style="font-size:14px">' + esc(name) +
          ' <span class="pill ' + (avail ? "ok" : "bad") + '">' + esc(t("bikeAvail",{ n:avail })) + "</span>" +
        "</div>" +
        '<div class="meta">' + esc(t("bikePorts",{ n:f.ports.length, m:BIKE_RADIUS })) + "</div>" +
        rows +
        (rest.length
          ? '<div style="margin-top:8px"><button type="button" class="linkbtn bikeMore" data-sys="' +
              esc(f.sys.id) + '">' + esc(t("bikeMore", { p:rest.length, n:restAvail })) + "</button></div>"
          : f.ports.length > BIKE_PAGE
            ? '<div class="meta" style="margin-top:6px">' + esc(t("bikeAllShown", { n:f.ports.length })) + "</div>"
            : "") +
      "</div></div>";
    }).join("") +
    '<p class="hint">' + esc(t("bikeSource")) + "</p>";
  /* the list only grows downwards, so nothing the reader is looking at moves */
  $$("#bikeShare .bikeMore").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = (state.bike || []).find(x => x.sys.id === btn.dataset.sys);
      if (!f) return;
      f.shown = (f.shown || BIKE_PAGE) + BIKE_PAGE;
      renderBike();
    });
  });
  applyFolds();
}

/* Only fetched when the section is actually open — the port lists are the
   heaviest thing this page touches, and most scans never need them. */
function refreshBike(){
  const sec = $("#sectBike");
  if (!sec || !sec.open || !state.position || state.bikeBusy) return;
  state.bikeBusy = true;
  $("#bikeShare").innerHTML = '<div class="empty"><span class="spinner"></span>' +
                              esc(t("bikeLoading")) + "</div>";
  loadBike(state.position)
    .catch(() => { state.bike = []; })
    .then(() => { state.bikeBusy = false; renderBike(); });
}

/* --------------------------- route parsing ----------------------------- */
function cleanPlace(s){
  if (!s) return "";
  let v = String(s).replace(/\+/g," ");
  try{ v = decodeURIComponent(v); }catch(e){}
  return v
    .replace(/^〒?\s*\d{3}-?\d{4}\s*/,"")
    .replace(/[,、]?\s*(日本|Japan)\s*$/i,"")
    .replace(/\s+/g," ")
    .trim();
}

function parseRouteInput(raw){
  const s = (raw || "").trim();
  if (!s) return { error:"empty" };

  if (/^https?:\/\//i.test(s)){
    let u;
    try{ u = new URL(s); }catch(e){ return { error:"noparse" }; }
    if (/(^|\.)(goo\.gl|maps\.app\.goo\.gl)$/i.test(u.hostname)) return { error:"short" };

    const o = u.searchParams.get("origin"), d = u.searchParams.get("destination");
    if (o || d) return { origin:cleanPlace(o), destination:cleanPlace(d) };
    const sa = u.searchParams.get("saddr"), da = u.searchParams.get("daddr");
    if (sa || da) return { origin:cleanPlace(sa), destination:cleanPlace(da) };

    const m = u.pathname.match(/\/dir\/(.+)/);
    if (m){
      const segs = m[1].split("/")
        .filter(x => x && !/^@/.test(x) && !/^data=/.test(x) && !/^am=/.test(x) && !/^\d[\d.,+-]*z?$/.test(x))
        .map(cleanPlace)
        .filter(Boolean);
      if (segs.length >= 2) return { origin:segs[0], destination:segs[segs.length-1] };
      if (segs.length === 1) return { origin:"", destination:segs[0] };
    }
    return { error:"noparse" };
  }

  /* free text: "A → B", "A -> B", "A から B", "A to B", "A, B" ... */
  const openEnded = /(?:→|⇒|->|=>|~|〜|＞|>|,|、|;|から)\s*$/.test(s);
  const parts = s.split(/\s*(?:→|⇒|->|=>|~|〜|＞|>|,|、|;|｜|\|)\s*|\s+to\s+|\s*から\s*|\s*까지\s*|\s*到\s*/i)
    .map(x => cleanPlace(x.replace(/(まで|行き)$/,"")))
    .filter(Boolean);
  if (openEnded && parts.length === 1) return { origin:parts[0], destination:"" };
  if (parts.length >= 2) return { origin:parts[0], destination:parts[parts.length-1] };
  if (parts.length === 1) return { origin:"", destination:parts[0] };
  return { error:"noparse" };
}

/* ------------------------- station name matching ----------------------- */
/* Only 470 of the 1904 stations carry odpt:stationTitle["ja-Hrkt"]: Tokyo
   Metro, Tobu and Keio publish it, JR East (887 stations), Toei, Tokyu, Seibu
   and Keikyu publish none. So 「ぎんざ」 found 銀座 through the Metro record
   while 「すがも」 found nothing — 巣鴨 is only on the Mita and Yamanote lines.
   Every station does have an English title, so romanise the query instead and
   compare with that. */
const KANA_ROMAJI = {
  "きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho",
  "ちゃ":"cha","ちゅ":"chu","ちょ":"cho","にゃ":"nya","にゅ":"nyu","にょ":"nyo",

  "じゃ":"ja","じゅ":"ju","じょ":"jo","ぢゃ":"ja","ぢゅ":"ju","ぢょ":"jo",
  "びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",
  "ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","てぃ":"ti","でぃ":"di",
  "しぇ":"she","ちぇ":"che","じぇ":"je","うぃ":"wi","うぇ":"we",
  "あ":"a","い":"i","う":"u","え":"e","お":"o",
  "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",
  "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
  "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",
  "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
  "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
  "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
  "や":"ya","ゆ":"yu","よ":"yo",
  "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",
  "わ":"wa","ゐ":"i","ゑ":"e","を":"o","ん":"n","ゔ":"vu",
  "ゃ":"ya","ゅ":"yu","ょ":"yo","ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o",
  "ー":""
};
const RE_ALL_KANA = /^[ぁ-ゟァ-ヿー\s　]+$/;
function isKana(s){ const v = String(s || "").trim(); return !!v && RE_ALL_KANA.test(v); }

function kanaToRomaji(s){
  const kana = String(s || "").normalize("NFKC")
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));  // カナ -> かな
  let out = "", i = 0;
  while (i < kana.length){
    if (kana[i] === "っ"){                       // 促音: 六本木 ろっぽんぎ -> roppongi
      const rest = kanaToRomaji(kana.slice(i + 1));
      if (!rest) return out + "t";
      return out + (rest[0] === "c" ? "t" : rest[0]) + rest;   // いっちょうめ -> itchome
    }
    const two = kana.slice(i, i + 2);
    if (KANA_ROMAJI[two] !== undefined){ out += KANA_ROMAJI[two]; i += 2; continue; }
    const one = kana[i];
    out += KANA_ROMAJI[one] !== undefined ? KANA_ROMAJI[one] : one;
    i += 1;
  }
  return out;
}

/* Both sides go through this, so the spellings ODPT actually uses line up:
   新橋 Shimbashi / しんばし, 大手町 Ōtemachi / おおてまち, 東京 Tokyo / とうきょう */
const romajiCache = new Map();
function romajiKey(s){
  const raw = String(s || "");
  let v = romajiCache.get(raw);
  if (v !== undefined) return v;
  v = raw.normalize("NFKC").normalize("NFD").replace(/[̀-ͯ]/g, "")   // ō -> o
    .toLowerCase()
    .replace(/[^a-z]/g, "")
    .replace(/m(?=[bmp])/g, "n")            // Shimbashi / Nihombashi
    .replace(/ou|oo/g, "o").replace(/uu/g, "u");
  romajiCache.set(raw, v);
  return v;
}

function normName(s){
  return String(s || "")
    .normalize("NFKC")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")     // ō -> o
    /* "押上（スカイツリー前）" / "押上〈スカイツリー前〉" / "Oshiage<SKYTREE>" -> 押上 */
    .replace(/\([^)]*\)|（[^）]*）|<[^>]*>|〈[^〉]*〉|《[^》]*》|\[[^\]]*\]|【[^】]*】|「[^」]*」/g,"")
    /* operators disagree on the small kana: 霞ケ関/霞ヶ関, 市ケ谷/市ヶ谷 */
    .replace(/ヶ/g,"ケ").replace(/ヵ/g,"カ")
    .toLowerCase()
    .replace(/[\s　]/g,"")
    .replace(/[-‐‑–—・･'’.]/g,"")
    .replace(/(station|sta|eki)$/,"")
    .replace(/(駅|站|역)$/,"");
}

/* The station number on the sign — M08, JY01, I-09 — folded to one form.

   This is the one string a visitor can copy without reading Japanese: it is
   printed on the platform sign, on the door of the train and on every map in
   the station, and it is unambiguous where a romanised name is not (Shinjuku /
   Shinjyuku, Ōtemachi / Otemachi). Underground — which is most of the Metro and
   all of Toei — the phone cannot see the sky and 「現在地」 has nothing to
   offer, so the number is the fallback that works exactly where GPS does not.

   Two things have to be folded away. normName already drops the hyphen that
   Toei and Tobu write (I-09, TS-01) and lowercases. The leading zero is the
   other one: ODPT gives Tokyu as TY1 and DT1 while the signs read TY01 and
   DT01, so the digits are compared as numbers. M08, M-08 and M8 all arrive
   here as m8. */
function codeKey(c){
  const s = normName(c);
  return s ? s.replace(/\d+/g, d => String(Number(d))) : "";
}
/* A query is only tried against the numbers when it looks like one: letters
   then digits. Without the digits a bare 「M」 would offer the whole Marunouchi
   line as candidates for someone halfway through typing a name. */
const looksLikeCode = q => /^[a-z]{1,3}\d{1,3}$/.test(codeKey(q));

/* The key that decides "these records are the same station under one name".
   It cannot be the English title. ODPT publishes 大山 (東武東上線・板橋区) and
   小山 (JR・栃木県) both as "Oyama", and 江北 (日暮里舎人ライナー) and 湖北
   (JR成田線) both as "Kohoku" — keying on English pulled a station 60 km away
   into 大山 and offered it as a transfer. All 1904 stations carry a Japanese
   title, and normName above folds the ケ/ヶ and 〈…〉 variants that used to be
   the reason for preferring English. */
function stationKey(s){
  const tt = s["odpt:stationTitle"] || {};
  return normName(tt.ja || s["dc:title"] || tt.en || "");
}
function stationNames(s){
  const tt = s["odpt:stationTitle"] || {};
  const out = [s["dc:title"], tt.ja, tt.en, tt.ko, tt["zh-Hans"], tt["zh-Hant"], tt["ja-Hrkt"]]
    .filter(Boolean).map(normName).filter(x => x.length > 0);
  /* 「羽田空港第1・第2ターミナル」 is one station serving two terminals, and the
     traveller reads only their own terminal number — on the boarding pass, on
     the signs, in the taxi. Register both halves as names of this station so
     each matches exactly rather than being guessed at. */
  out.slice().forEach(n => {
    /* normName has already dropped the 「・」, so the pair reads 第1第2 by then */
    const m = /^(.*?)第(\d+)第(\d+)(.*)$/.exec(n);
    if (!m) return;
    [m[1] + "第" + m[2] + m[4], m[1] + "第" + m[3] + m[4]].forEach(v => {
      if (v && out.indexOf(v) < 0) out.push(v);
    });
  });
  return out;
}
/* returns {name, stations:[...], railways:Set} or null */
function matchStations(query, index){
  const q = normName(query);
  if (!q) return null;
  /* Two characters was the floor because one character of a half-typed name
     matches half of Tokyo. But 柏・蕨・泉・旭 are whole station names, and
     typing one of them returned nothing at all. Let a single character through
     only when it is exactly some station's name — a partial 「新」 still does
     not qualify, and the exact hit scores 100 so it wins its own group. */
  if (q.length < 2 && !index.some(s => stationNames(s).indexOf(q) >= 0)) return null;
  /* kana typed against a line that publishes no reading — score it against the
     romanised English title instead, but only where the name itself missed */
  const rq = isKana(query) ? romajiKey(kanaToRomaji(query)) : "";
  /* how many characters two names agree on from the start */
  const shared = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
  const score = (n, needle) => {
    if (n === needle) return 100;
    if (n.startsWith(needle) || needle.startsWith(n)) return 70 + Math.min(n.length, needle.length) / Math.max(n.length, needle.length) * 20;
    if (n.includes(needle) && needle.length >= 3) return 55;
    if (needle.includes(n) && n.length >= 3) return 50;
    /* Names that agree for a long way and then diverge. 羽田空港第1ターミナル is
       what the traveller reads on their boarding pass and on every sign in the
       airport; ODPT calls the station 羽田空港第１・第２ターミナル, and none of
       the tests above match the two at all — a visitor typing the name of the
       terminal they are standing in got 「駅を特定できませんでした」.
       The shared run also ranks: it is 6 characters against 第１・第２ and 5
       against 第３, so the right terminal wins.
       Kept below the exact and prefix scores, and needing both a long run and
       most of the shorter name, so it only speaks when nothing else does. */
    const c = shared(n, needle);
    if (c >= 4 && c * 2 >= Math.min(n.length, needle.length)) return 50 + Math.min(c, 14);
    return 0;
  };
  /* the number off the sign, when that is what was typed */
  const cq = looksLikeCode(query) ? codeKey(query) : "";
  let best = 0, bestKey = null;
  const scored = index.map(s => {
    let sc = 0, via = "name";
    const names = stationNames(s);
    for (const n of names){
      const cur = score(n, q);
      if (cur > sc) sc = cur;
    }
    if (!sc && rq){
      via = "romaji";
      for (const n of names){
        const rn = romajiKey(n);
        if (!rn) continue;
        const cur = score(rn, rq);
        if (cur > sc) sc = cur;
      }
    }
    /* Exact only. A number is read off a sign, not guessed at, and a partial
       one names a stretch of line rather than a station — 「間違った駅の運行
       情報」 is worse than 「駅が見つかりません」. Kept out of stationNames so
       that endpointNames and the walking search go on comparing names alone:
       ten numbers are shared by two stations each (銀座線 G01–G10 against the
       横浜市営グリーンライン), and a station excluded from its own transfers
       because a number matched would be a silent wrong answer. */
    if (!sc && cq && codeKey(s["odpt:stationCode"]) === cq){
      sc = 100;
      via = "code";
    }
    return { s, sc, via };
  });
  scored.forEach(x => { if (x.sc > best) best = x.sc; });
  if (best < 50) return null;
  let top = scored.filter(x => x.sc >= best - 0.001);
  /* The romaji fold is deliberately lossy — it collapses おお and お so that
     「おおてまち」 reaches ODPT's "Ōtemachi". That also makes 「おおやま」(大山)
     and 「おやま」(小山) the same string, and 小山 publishes no reading to tell
     them apart, so the two tie on 100. Break that tie towards the station
     matched on a name it actually publishes: 大山 has the reading 「おおやま」,
     小山 is only reachable through the fold. Only a tie — a weak substring hit
     on a name must not outrank an exact match through romaji, or 「おやま」
     lands on 青山一丁目 instead of 小山. */
  if (top.some(x => x.via === "name")) top = top.filter(x => x.via === "name");
  bestKey = stationKey(top[0].s);
  const hits = top.map(x => x.s);
  /* also pull in same-named stations of other lines (e.g. Shinjuku on 4 lines) */
  const keys = new Set(hits.map(stationKey));
  const all = index.filter(s => keys.has(stationKey(s)));
  return {
    name: titleOf(hits[0]["odpt:stationTitle"], hits[0]["dc:title"]),
    stations: all,
    railways: new Set(all.map(s => s["odpt:railway"]).filter(Boolean)),
    key: bestKey
  };
}
/* How far the train actually goes.

   Counting stations was the only measure until now, and it is blind to the one
   thing that matters most on a long trip: which way the line points. 和光市→立川
   is 20.6 km apart, and the only one-change route this app could find —
   副都心線 into 新宿, then 中央線 back out west — is 42.1 km of track. It has the
   fewest changes and twice the distance, and nothing in the ranking could see
   the difference. Every station's position is already in the index, and the
   line's own stationOrder gives the sequence, so the real length is a sum.

   Great-circle between consecutive stations, so curves read slightly short —
   fine for comparing routes with each other, which is all it is for. */
let stationGeo = null, stationGeoFor = null;
function stationGeoMap(){
  if (stationGeo && stationGeoFor === cache.stationIndex) return stationGeo;
  stationGeo = new Map();
  stationGeoFor = cache.stationIndex;
  (cache.stationIndex || []).forEach(st => {
    if (st["geo:lat"] && st["geo:long"])
      stationGeo.set(st["owl:sameAs"], { lat:st["geo:lat"], lon:st["geo:long"] });
  });
  return stationGeo;
}
function legMetres(dir){
  const g = stationGeoMap();
  let m = 0;
  const list = (dir && dir.stations) || [];
  for (let i = 1; i < list.length; i++){
    const a = g.get(list[i-1].id), b = g.get(list[i].id);
    if (a && b) m += haversine(a.lat, a.lon, b.lat, b.lon);
  }
  return m;
}
function routeMetres(dirs){
  return (dirs || []).reduce((n, d) => n + legMetres(d), 0);
}
/* the crow's distance between the two ends — what a route is long compared to */
function endGeo(match){
  const st = (match && match.stations || []).find(x => x["geo:lat"]);
  return st ? { lat:st["geo:lat"], lon:st["geo:long"] } : null;
}
function endpointMetres(from, to){
  const a = (from.stations || []).find(x => x["geo:lat"]);
  const b = (to.stations   || []).find(x => x["geo:lat"]);
  if (!a || !b) return 0;
  return haversine(a["geo:lat"], a["geo:long"], b["geo:lat"], b["geo:long"]);
}
/* A route bends this far out of its way before it is worth looking for one
   with an extra change. 和光市→立川 comes to 2.0. */
const DETOUR_FACTOR = 1.6;
function railwayServes(railwayId, stationIds){
  const rw = cache.railwayById.get(railwayId);
  if (!rw || !rw["odpt:stationOrder"]) return false;
  return rw["odpt:stationOrder"].some(o => stationIds.has(o["odpt:station"]));
}

function isRealTransfer(s1, s2, r1, r2){
  if (s1 === s2) return true;
  const conn1 = s1["odpt:connectingRailway"] || [];
  const conn2 = s2["odpt:connectingRailway"] || [];
  if (conn1.includes(r2) || conn2.includes(r1)) return true;

  const lat1 = s1["geo:lat"] || s1["lat"];
  const lon1 = s1["geo:long"] || s1["long"] || s1["lon"];
  const lat2 = s2["geo:lat"] || s2["lat"];
  const lon2 = s2["geo:long"] || s2["long"] || s2["lon"];

  if (lat1 != null && lon1 != null && lat2 != null && lon2 != null){
    const d = haversine(lat1, lon1, lat2, lon2);
    if (d <= 600) return true;
  }
  return false;
}

/* 新宿 as a JR record and 新宿 as a Metro record are different stations in the
   data; a change of trains is exactly the step between two of them. Grouping by
   name is therefore the whole transfer graph, and the two-change search walks it
   twice more — so build it once and keep it with the index it came from. */
function stationsByNameIndex(idx){
  const index = idx || cache.stationIndex;
  if (!index) return new Map();
  if (cache.byName && cache.byNameSrc === index) return cache.byName;

  const stationsByName = new Map();
  for (const s of index) {
    const titles = new Set();
    if (s["dc:title"]) titles.add(normName(s["dc:title"]));
    if (s["odpt:stationTitle"]) {
      Object.values(s["odpt:stationTitle"]).forEach(v => {
        if (typeof v === "string" && v) titles.add(normName(v));
      });
    }
    for (const norm of titles) {
      if (!norm) continue;
      if (!stationsByName.has(norm)) {
        stationsByName.set(norm, []);
      }
      const list = stationsByName.get(norm);
      if (!list.includes(s)) list.push(s);
    }
  }

  /* Interchanges whose two halves have different names — 朝霞台(東武)⇄北朝霞(JR),
     大手町⇄東京, 新宿西口⇄新宿, 日比谷⇄有楽町 — never formed a transfer,
     because the groups are keyed by name. ODPT says they connect:
     朝霞台 carries connectingRailway [JR-East.Musashino] and 北朝霞 carries
     [Tobu.Tojo], 126 m apart. 132 such pairs exist, and all of them were lost.

     The connectingRailway route was already read in findTransferRoutes, but it
     checked whether that railway serves THIS record's id — and the Musashino
     line's stationOrder holds 北朝霞's id, never 朝霞台's, so it always failed.

     Merging the two name groups instead lets each record be matched on its own
     railway and its own id, which is what railwayServes can actually answer.
     Only pairs the operators themselves declare are merged, and only within
     400 m: proximity alone would invent interchanges that do not exist. */
  const near = (a, b) => {
    const la = a["geo:lat"], oa = a["geo:long"], lb = b["geo:lat"], ob = b["geo:long"];
    return la && oa && lb && ob && haversine(la, oa, lb, ob) <= 400;
  };
  const byRailway = new Map();
  for (const s of index){
    const r = s["odpt:railway"];
    if (!r) continue;
    if (!byRailway.has(r)) byRailway.set(r, []);
    byRailway.get(r).push(s);
  }
  const keyOf = s => normName(s["dc:title"] || (s["odpt:stationTitle"] || {}).ja || "");
  const merged = new Map();          // name key -> name key it was folded into
  for (const s of index){
    const conn = s["odpt:connectingRailway"] || [];
    if (!conn.length || !s["geo:lat"]) continue;
    const ka = keyOf(s);
    if (!ka) continue;
    for (const r of conn){
      for (const other of (byRailway.get(r) || [])){
        const kb = keyOf(other);
        if (!kb || kb === ka || !near(s, other)) continue;
        if (merged.get(kb) === ka || merged.get(ka) === kb) continue;
        const listA = stationsByName.get(ka), listB = stationsByName.get(kb);
        if (!listA || !listB) continue;
        listB.forEach(x => { if (!listA.includes(x)) listA.push(x); });
        listA.forEach(x => { if (!listB.includes(x)) listB.push(x); });
        merged.set(kb, ka);
      }
    }
  }

  cache.byNameSrc = index;
  cache.byName = stationsByName;
  return stationsByName;
}

/* Every name an endpoint answers to, normalised.

   Skipping the group whose key equals normName(match.name) is not enough: the
   index registers each station under all of its language titles, so 池袋 is
   four keys — 池袋, ikebukuro, 이케부쿠로, いけぶくろ — and only the first was
   excluded. The rest let 池袋 be proposed as an interchange for a trip that
   starts at 池袋, which is how 池袋→稲荷山公園 (直通、西武池袋線) came back as
   「（1回乗換）」 with seven routes all changing at 池袋. */
function endpointNames(match){
  const out = new Set();
  if (!match) return out;
  const add = n => { if (n) out.add(n); };
  add(normName(match.name));
  (match.stations || []).forEach(s => stationNames(s).forEach(add));
  return out;
}

function findTransferRoutes(from, to, idx){
  const index = idx || cache.stationIndex;
  if (!from || !to || !index) return [];

  const stationsByName = stationsByNameIndex(index);

  const routes = [];
  const seen = new Set();
  const endNames = endpointNames(from);
  endpointNames(to).forEach(n => endNames.add(n));

  for (const [norm, stationList] of stationsByName.entries()) {
    if (endNames.has(norm)) continue;

    const r1Matches = [];
    const r2Matches = [];

    for (const s of stationList) {
      const rws = [s["odpt:railway"]].concat(s["odpt:connectingRailway"] || []).filter(Boolean);
      for (const r of rws) {
        if (from.railways.has(r) && railwayServes(r, new Set([s["owl:sameAs"]]))) r1Matches.push({ s, railway: r });
        if (to.railways.has(r) && railwayServes(r, new Set([s["owl:sameAs"]]))) r2Matches.push({ s, railway: r });
      }
    }

    if (!r1Matches.length || !r2Matches.length) continue;

    for (const m1 of r1Matches) {
      for (const m2 of r2Matches) {
        if (m1.railway === m2.railway) continue;
        if (isRealTransfer(m1.s, m2.s, m1.railway, m2.railway)) {
          const t1 = titleOf(m1.s["odpt:stationTitle"], m1.s["dc:title"]);
          const t2 = titleOf(m2.s["odpt:stationTitle"], m2.s["dc:title"]);
          const canonicalTitle = t1 === t2 ? t1 : t1 + "・" + t2;
          const canonicalNorm = normName(t1) + "-" + normName(t2);
          const routeKey = m1.railway + "->" + canonicalNorm + "->" + m2.railway;

          if (!seen.has(routeKey)) {
            seen.add(routeKey);
            routes.push({
              transferStationName: canonicalTitle,
              rid1: m1.railway,
              rid2: m2.railway,
              viaId1: m1.s["owl:sameAs"],
              viaId2: m2.s["owl:sameAs"]
            });
          }
        }
      }
    }
  }
  return routes;
}

/* --- two changes, but only where one is not enough -----------------------
   Widening the search to two changes everywhere would drown the panel: 新宿→東京
   has 3 direct lines, 151 one-change routes and 5,692 two-change ones, and with
   no timetable there is nothing to rank 5,692 of them by. But 朝霞→御成門 has
   none at all until the second change is allowed, and that is the trip that
   needs an answer. So this runs only after the one-change search comes back
   empty, and hands back a handful.

   Every line reachable from one endpoint with a single change, keyed by that
   line. Groups where the endpoint's own lines do not call are skipped outright,
   which is what keeps the walk cheap. */
/* skipNames covers BOTH ends of the trip, not just this one: a change at the
   far endpoint is no more of a route than a change at this one. Without it
   池袋→稲荷山公園 came back as 湘南新宿ライン(池袋→新宿) → 埼京線(新宿→池袋) →
   池袋線 — out to 新宿 and straight back to where it started. */
function transferHops(endpoint, byName, skipNames){
  const hops = new Map();
  const endNames = skipNames || endpointNames(endpoint);
  const railwaysAt = s => {
    const ids = new Set([s["owl:sameAs"]]);
    return [s["odpt:railway"]].concat(s["odpt:connectingRailway"] || [])
      .filter(Boolean).filter(r => railwayServes(r, ids));
  };
  for (const [norm, list] of byName){
    if (endNames.has(norm)) continue;

    const near = [];
    for (const s of list)
      for (const r of railwaysAt(s))
        if (endpoint.railways.has(r)) near.push({ s, railway:r });
    if (!near.length) continue;

    const far = [];
    for (const s of list)
      for (const r of railwaysAt(s)) far.push({ s, railway:r });

    for (const a of near) for (const b of far){
      if (a.railway === b.railway) continue;
      if (!isRealTransfer(a.s, b.s, a.railway, b.railway)) continue;
      const t1 = titleOf(a.s["odpt:stationTitle"], a.s["dc:title"]);
      const t2 = titleOf(b.s["odpt:stationTitle"], b.s["dc:title"]);
      if (!hops.has(b.railway)) hops.set(b.railway, []);
      const found = hops.get(b.railway);
      const hop = { legRailway:a.railway,
                    legId:a.s["owl:sameAs"],           // where you leave your line
                    midId:b.s["owl:sameAs"],           // where you join the other one
                    title:t1 === t2 ? t1 : t1 + "・" + t2 };
      if (!found.some(h => h.legRailway === hop.legRailway && h.legId === hop.legId && h.midId === hop.midId))
        found.push(hop);
    }
  }
  return hops;
}

/* Running beats short — but not at any price.

   Every ranking here puts the clear routes ahead of the disrupted ones, which
   is right when the difference is small and wrong when it is not. 和光市→立川
   offered 28 stations and 43 km through 池袋 and hid 9 stations and 27 km
   through 朝霞台, because 武蔵野線 had a notice out. 「運行情報あり」 is not
   「運転見合わせ」: the card says which it is, in red, with the number of trains
   still running beside it.

   So one slot is kept for a route that is much shorter than the best clear one,
   and the reader decides. It goes last, and it is labelled, because it is an
   exception to the order everything else is in. */
/* Distance alone is not the trip. 東京→新宿 is 7.3 km and nine stops on the
   丸ノ内線 against 8.5 km and four on the 中央線快速, and the longer one is the
   quicker. With no timetable, the closest honest thing is to price the other
   two costs in metres and add them up — a stop is worth roughly the distance a
   train covers while slowing, waiting and getting going again, and a change
   costs a few minutes on a platform. Rough weights standing in for times we do
   not have; they only ever compare routes with each other.

   It lives up here because three different places now need the same answer to
   "how much trip is this": the ranking of the cards, and the two places that
   decide whether a shorter route with a notice on it deserves a slot. */
const STOP_COST_M = 600, CHANGE_COST_M = 3000;
function effortOf(metres, hops, changes){
  return (metres || 0) + (hops || 0) * STOP_COST_M + (changes || 0) * CHANGE_COST_M;
}
const SHORTCUT_RATIO = 0.7;
function withShortcut(picked, pool, cap, costOf, badOf){
  const out = picked.slice(0, cap);
  if (!out.length) return out;
  const clear = out.filter(x => !badOf(x)).map(costOf).filter(c => c && isFinite(c));
  if (!clear.length) return out;                       // nothing clear to compare against
  const best = Math.min.apply(null, clear);
  let short = null;
  (pool || []).forEach(x => {
    if (!badOf(x)) return;
    const c = costOf(x);
    if (!c || !isFinite(c) || c >= best * SHORTCUT_RATIO) return;
    if (!short || c < costOf(short)) short = x;
  });
  /* Already there is not the same as "some disrupted route is already there":
     和光市→立川 was showing a 26-stop disrupted route while still hiding the
     9-stop one, and the early return could not tell them apart. */
  if (!short || out.indexOf(short) >= 0) return out;
  if (out.length < cap){ out.push(short); return out; }
  /* make room by dropping the dearest clear one, not whatever came last */
  let worst = -1, worstC = -Infinity;
  out.forEach((x, i) => {
    if (badOf(x)) return;
    const c = costOf(x);
    if (c > worstC){ worstC = c; worst = i; }
  });
  if (worst < 0) return out;
  out.splice(worst, 1);
  out.push(short);
  return out;
}
function findDoubleTransferRoutes(from, to, idx, limit){
  const index = idx || cache.stationIndex;
  if (!from || !to || !index) return [];
  const cap = limit || 3;
  const byName = stationsByNameIndex(index);

  const endNames = endpointNames(from);
  endpointNames(to).forEach(n => endNames.add(n));
  const fromHops = transferHops(from, byName, endNames);   // middle line -> how to reach it from the origin
  const toHops   = transferHops(to,   byName, endNames);   // middle line -> how to leave it for the destination

  const routes = [], seen = new Set();
  for (const [mid, aList] of fromHops){
    const bList = toHops.get(mid);
    if (!bList) continue;
    for (const a of aList) for (const b of bList){
      if (a.legRailway === b.legRailway) continue;   // one change wearing a disguise
      if (a.midId === b.midId) continue;             // both changes at the same station
      const key = a.legRailway + ">" + a.legId + ">" + mid + ">" + b.midId + ">" + b.legRailway;
      if (seen.has(key)) continue;
      seen.add(key);
      routes.push({
        rid1:a.legRailway, rid2:mid, rid3:b.legRailway,
        via1Name:a.title,  via2Name:b.title,
        exit1:a.legId, enter1:a.midId,               // first change: rid1 -> rid2
        exit2:b.midId, enter2:b.legId                // second change: rid2 -> rid3
      });
    }
  }

  const badLeg = rid => { const l = lineInfo(rid); return l && (l.status === "alert" || l.status === "unknown") ? 1 : 0; };
  const bads = r => badLeg(r.rid1) + badLeg(r.rid2) + badLeg(r.rid3);
  /* Sorting only by "is it running" left everything else in the order the
     station-name map happened to iterate, and the build loop below stops after
     twelve. For 和光市→立川 that meant twelve ways through 新宿 and never the
     one through 朝霞台 and 西国分寺 — which exists in this list, and is the
     route Google gives.

     Ranking properly needs the length, and the length needs a stationOrder walk
     per leg, which is what the loop is trying not to do 5,692 times. So rank on
     something free first: the corners. Origin → first change → second change →
     destination as three straight lines is enough to tell a route that heads
     towards the destination from one that goes into town and comes back. */
  const g = stationGeoMap();
  const at = id => g.get(id);
  const corners = r => {
    const pts = [endGeo(from), at(r.enter1), at(r.enter2), endGeo(to)].filter(Boolean);
    let m = 0;
    for (let i = 1; i < pts.length; i++) m += haversine(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);
    return pts.length < 4 ? Infinity : m;
  };
  routes.forEach(r => { r._rough = corners(r); });
  routes.sort((a, b) => (bads(a) - bads(b)) || (a._rough - b._rough));

  /* Which of them are worth measuring. The sort above puts every clear route
     ahead of every disrupted one and the loop below stops after twelve, so on
     a day when the shortest way has a notice out it is dropped right here —
     before withShortcut at the bottom, whose whole job is to keep such a route
     a slot, ever sees it. 和光市→立川 is that trip: 東上線 → 武蔵野線 →
     中央線快速 is 27 km against 42 km through 新宿, and it disappeared from the
     app on exactly the days the 武蔵野線 was disrupted — the days a reader most
     needs to know it is there, even if only to be told it is the short way and
     has a notice on it.

     So the six shortest by the rough measure are measured first whatever their
     state, and the ranked list follows behind them. */
  /* Which twenty get the real measurement, and in what order.

     Two things were wrong with taking the first twelve of the (bads, rough)
     sort. Measurements were spent on duplicates — 和光市→海浜幕張 filled every
     slot with 副都心線 → 有楽町線 → 京葉線, six of them, differing only in
     whether you change at 氷川台, 平和台, 小竹向原, 千川, 地下鉄成増 or
     地下鉄赤塚, all measuring the same 53.9 km and 31 stops. And putting every
     clear route ahead of every disrupted one meant a distinctly-shaped route
     with a notice on it could never be reached at all.

     So: one candidate per set of lines, shortest first, status ignored. Twenty
     of those are twenty genuinely different journeys, which is what a reader
     scanning the list is looking for. 東上線 → 武蔵野線 → 京葉線 is eighteenth
     — 49.4 km of straight lines against 43.2 km for the leaders — and now gets
     measured; before, it was not in the running whatever the day's service
     information said. Ranking on the real distance, and preferring the ones
     that are running, both still happen below, on measured numbers. */
  const trio = r => r.rid1 + ">" + r.rid2 + ">" + r.rid3;
  const firsts = new Set();
  const order = routes.slice()
    .sort((a, b) => a._rough - b._rough)
    .filter(r => {
      const k = trio(r);
      if (firsts.has(k)) return false;
      firsts.add(k);
      return true;
    });

  /* How many get the real measurement. Twelve was too few once the duplicates
     were squeezed out: 和光市→海浜幕張 has 95 combinations covering far more
     than twelve distinct sets of lines, and 東上線 → 武蔵野線 → 京葉線 sits
     eighteenth on the rough measure — 49.4 km of straight lines against 43.2 km
     for the leaders — so it was never reached. Twenty covers it. Each one costs
     three stationOrder walks and the whole search still runs in well under a
     quarter of a second. */
  const MEASURE = 20;
  const out = [];
  const done = new Set();
  let tried = 0;
  for (const r of order){
    if (out.length >= MEASURE || tried >= 300) break;   // enough to rank; not the whole 5,692
    if (done.has(r)) continue;
    done.add(r);
    tried++;
    const d1 = railwayDirections(r.rid1, new Set(from.stations.map(s => s["owl:sameAs"])), new Set([r.exit1]));
    const d2 = railwayDirections(r.rid2, new Set([r.enter1]), new Set([r.exit2]));
    const d3 = railwayDirections(r.rid3, new Set([r.enter2]), new Set(to.stations.map(s => s["owl:sameAs"])));
    if (!d1.length || !d2.length || !d3.length) continue;   // the legs do not actually join up
    const legs = [d1[0], d2[0], d3[0]];
    out.push(Object.assign({}, r, { legs:legs,
                                    hops:d1[0].hops + d2[0].hops + d3[0].hops,
                                    metres:routeMetres(legs) }));
  }
  /* now the real length, measured along the rails */
  out.sort((a, b) => (bads(a) - bads(b)) || (a.metres - b.metres));
  return withShortcut(out, out, cap, x => effortOf(x.metres, x.hops, 2), x => bads(x) > 0);
}

/* ------------------------------ route check ---------------------------- */
/* Two checks can be in flight at once — the language switch re-runs the last
   one while the user is already asking for another. Only the newest may write
   to the page, or the stale result silently replaces the fresh one. */
let routeCheckSeq = 0;
/* opts.scroll: put the verdict at the top of the screen. Only for checks the
   user asked for. The old rule — scroll only if the result happened to be off
   screen, with block:"nearest" — landed anywhere between the middle and the
   top depending on where the page was when the layout changed, and then the
   asynchronous bus render moved it again. */
/* Two ends and what stands between them. The verdict says 「この区間は影響を
   受けます」 in words; this is the same sentence as a picture, and it is the
   part a visitor can read without reading Japanese. */
function tripStrip(from, to, hit){
  if (!from || !to || !from.name || !to.name) return "";
  const a = '<span class="end">' + esc(from.name) + "</span>";
  const b = '<span class="end">' + esc(to.name) + "</span>";
  if (hit){
    const word = infoStatusWord(hit.info) || t("statusAlert");
    const mid = titleOf(hit.title, humanizeId(hit.railwayId)) + " " + word;
    return '<div class="tripstrip">' +
        '<span class="tsdot"></span><span class="tsrail"></span>' +
        '<span class="tsx">\u00d7</span>' +
        '<span class="tsrail"></span><span class="tsdot"></span>' +
      "</div>" +
      '<div class="tsnames">' + a + '<span class="mid">' + esc(mid) + "</span>" + b + "</div>";
  }
  return '<div class="tripstrip clear">' +
      '<span class="tsdot"></span><span class="tsrail"></span><span class="tsdot"></span>' +
    "</div>" +
    '<div class="tsnames">' + a + b + "</div>";
}
async function checkRoute(opts){
  const myTurn = ++routeCheckSeq;
  const out = $("#routeResult"), st = $("#routeStatus");
  out.innerHTML = "";
  updateFavBtn();

  /* the suggestion lists belong to the form, not to the result: left open,
     they pushed the whole form down behind the verdict */
  routeFromHits = [];
  routeToHits = [];
  renderHitsList($("#routeFromHits"), [], "");
  renderHitsList($("#routeToHits"), [], "");

  const parsed = routeFields();
  /* pasting a URL fills the boxes so the user can see what was understood */
  if (!parsed.error && (parsed.origin || parsed.destination)){
    if (parsed.origin) $("#routeFrom").value = parsed.origin;
    if (parsed.destination) $("#routeTo").value = parsed.destination;
  }
  /* Emptying the destination has to take its answers with it. The nearest-stop
     list kept flagging 「池袋へ行けます」 long after 池袋 had been deleted from
     the box, because only the verdict was cleared here. */
  const forgetDestination = () => {
    state.busReach = null;
    state.destMatch = null;
    state.originMatch = null;
    state.originCoords = null;
    if (state.lines.length){ render(); renderBus(); }
  };
  if (parsed.error === "empty")   { setStatus(st, t("routeNeedInput"), "err"); forgetDestination(); return; }
  if (parsed.error === "short")   { setStatus(st, t("routeShortUrl"), "err");  return; }
  if (parsed.error === "noparse") { setStatus(st, t("routeNoParse"), "err");   return; }
  if (!parsed.destination)        { setStatus(st, t("routeNeedDest"), "err");  forgetDestination(); $("#routeTo").focus(); return; }

  setStatus(st, t("routeMatching"), "busy");
  let index;
  try{
    /* station names, line metadata and the service information — all cached,
       so this only costs anything on the first check */
    /* train locations too: on a disrupted line, "still running, worst 13 min"
       is the difference between detouring and simply riding through */
    const got = await Promise.all([ getStationIndex(), getRailways(), getTrainInfo(),
                                    getTrainLocations().catch(() => null) ]);
    index = got[0];
    /* No index means the fetch failed, not that the station does not exist.
       Saying 「駅を特定できませんでした」 here sends the user off to re-check the
       spelling of a name that was right all along. */
    if (!index || !index.length){
      if (myTurn !== routeCheckSeq) return;
      setStatus(st, t("errNet"), "err"); return;
    }
    /* that fetch may well have replaced the service information the scan was
       built on — judge on what was just downloaded, not on what was cached
       fifteen minutes ago */
    refreshScannedStatuses();
  }
  catch(e){
    if (myTurn !== routeCheckSeq) return;
    setStatus(st, t("errNet"), "err"); return;
  }
  if (myTurn !== routeCheckSeq) return;
  setStatus(st, "", "");

  const from = parsed.origin ? matchStations(parsed.origin, index) : null;
  const to   = parsed.destination ? matchStations(parsed.destination, index) : null;

  /* "池袋 → 池袋" used to be answered with eight lines running "池袋 → 池袋
     を直通" and a delay verdict. There is no journey to judge. */
  if (from && to && normName(from.name) === normName(to.name)){
    setStatus(st, t("routeSameStation"), "err");
    return;
  }

  state.destMatch = to ? { name:to.name, text:parsed.destination, railways:to.railways } : null;
  /* walkLink needs to know where the trip starts, and whether that is where the
     user is. Kept as the matched record so nearScanPoint can measure it. */
  state.originMatch = from || null;
  const originGeo = from && (from.stations || []).find(st => st["geo:lat"] && st["geo:long"]);
  state.originCoords = originGeo
    ? { lat: originGeo["geo:lat"], lon: originGeo["geo:long"] } : null;

  const routeRailways = new Set();
  if (from) from.railways.forEach(r => routeRailways.add(r));
  if (to)   to.railways.forEach(r => routeRailways.add(r));

  const stationIdsFrom = new Set(from ? from.stations.map(s => s["owl:sameAs"]) : []);
  const stationIdsTo   = new Set(to   ? to.stations.map(s => s["owl:sameAs"])   : []);

     have flagged the Keio line, which no one would ride to 成増. The verdict is

  const bad = l => l.status === "alert" || l.status === "unknown";
  /* kept separate from directIds, which grows to include the transfer legs —

      ? Array.from(from.railways).filter(r => to.railways.has(r))
      : [];
  let directIds = throughIds.slice();
  let isTransfer = false;
  let clearTransferRoutes = 0;
  let clearTransferLive = 0;
  /* 「running late」 is the live train records, not the operator's prose. Same

     every direct line disrupted the trip is not necessarily off — 朝霞→池袋 on a

         trip the user asked about, and dropping them would hide the disruption */

         Without it 東京→東京ビッグサイト said 「遅れています」 because the 山手線

         which anyone has to take. Exactly the mistake clearTransferRoutes was

        !runningLate(tr.rid1) && !runningLate(tr.rid2) && (!tr.rid3 || !runningLate(tr.rid3))).length;

  const clearThrough = throughIds.map(lineInfo).filter(l => !bad(l)).length;
  const canRouteAround = hits.length > 0 && (clearTransferRoutes > 0 || clearThrough > 0);
  /* a way there that is neither disrupted nor running late */

  /* renderHowTo widens its search only when nothing from the origin works —
     that fact is decided here, so it is recorded here */
  state.routeVerdict = {
    affected: !!(from && to && hits.some(l => l.status === "alert") && !canRouteAround),
    directIds: new Set(directIds)

  /* Which question this answer belongs to. Edit either box and the answer on
     screen is about a trip nobody is asking about any more. */
  state.judgedFor = { from: parsed.origin || "", to: parsed.destination || "" };

  /* --- endpoint summary --- */
  let html = "";
  const endpoint = (labelKey, parsedText, match) => {
    if (!parsedText) return "";
    if (!match){
      return '<div class="item"><div class="bar" style="background:var(--warn)"></div><div class="body">' +
        '<div class="title" style="font-size:14px">' + esc(t(labelKey)) + ": " + esc(parsedText) + "</div>" +
        '<div class="meta">' + esc(t("routeUnmatched",{q:parsedText})) + "</div></div></div>";
    }

    /* a hub like Tokyo has 17 lines — show the ones that matter first */

    const scanRank = rid => {
      const st = lineInfo(rid);
      return st ? RANK[st.status] : 4;
    };

    const rids = Array.from(match.railways).sort((a,b) => scanRank(a) - scanRank(b));
    const chips = rids.map(rid => {
      const rw = cache.railwayById.get(rid) || {};
      const scanned = lineInfo(rid);
      const p = scanned ? PILL[scanned.status] : null;
      const body =
        '<span class="dot" style="background:' + esc(rw["odpt:color"] || "var(--faint)") + '"></span>' +
        esc(titleOf(rw["odpt:railwayTitle"], humanizeId(rid))) +
        (p ? ' <span class="pill ' + p[0] + '" style="padding:1px 6px">' + esc(t(p[1])) + "</span>" : "");

        : '<span class="chip">' + body + "</span>";

      '<div class="title" style="font-size:14px">' + esc(t(labelKey)) + ": " + esc(match.name) + "</div>" +
      (normName(parsedText) === normName(match.name) ? "" : '<div class="meta">' + esc(parsedText) + "</div>") +
      '<div class="linechips">' + chips + "</div>" +
      '<div class="chipinfo"></div>' + "</div></div>";

  /* Every verdict names the trip it is about. 「関係ありません」 alone left
     readers asking 「何が？」, and the same is true of 「関係あります」 — the
     subject of the judgement is the journey, not the lines. Falls back to the
     bare wording when one end is missing. */
  const tripHeadline = (tripKey, plainKey) =>
    (parsed.origin && parsed.destination)
      ? t(tripKey, { from: from ? from.name : parsed.origin,
                     to:   to   ? to.name   : parsed.destination })
      : t(plainKey);

  /* --- verdict banner --- */
  const routeTimeStr = fmtTime(new Date().toISOString());
  const checkedTag = '<p style="margin-top:6px;opacity:.85">🕒 ' + esc(t("checkedAt", { time: routeTimeStr })) + "</p>";
  /* the tag is part of the headline, so it has to speak the user's language */
  /* A disrupted line that is still moving is often the fastest option anyway.
     Where the operator publishes train positions, put the number next to the
     warning so the rider can weigh 13 minutes late against 9 extra stations. */
  const liveLineHtml = l => {

    const lv = liveFor(l.railwayId) || l.live;
    if (!lv || !lv.total) return "";
    const msg = lv.known && lv.max >= 60
      ? t("stillRunningDelay", { n: lv.total, m: Math.round(lv.max / 60) })
      : t("stillRunning", { n: lv.total });

    return "<li><strong>" + esc(titleOf(l.title, humanizeId(l.railwayId))) + "</strong>" +
      (both ? ' — <span style="opacity:.85">' + esc(t("routeBoth")) + "</span>" : "") +
      infoSummaryHtml(l.railwayId, l.info, "margin-top:5px") +
      liveLineHtml(l) +
      origTextHtml(l.info, "margin-top:5px") +
