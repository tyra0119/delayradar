          return '<details class="trainroute sub"><summary><div class="stoprow' + (hit === false ? " ok" : "") +
              '"><span class="stopdot"></span><span class="stopname">' + label + tag +
              ' <span class="pill">' + esc(t("stationSpanOpen")) + "</span></span></div></summary>" +
            '<div style="margin:4px 0 10px 14px">' +
              routeMapFigure([{ rid: rid, dir: d }]) +
              renderStopSpan(d.stations, 0, d.stations.length - 1, "stationSpanTitle", null, colour) +
            "</div></details>";
        }).join("");
        return routeDiagram([from.name, to.name],
            [{ name: titleOf(rw["odpt:railwayTitle"], humanizeId(rid)), color: colour, pill: pill,
               meta: t("legOff", { n: dirs[0].hops, stop: to.name }) }],
            (dirs.length > 1 ? '<span class="pill">' + esc(t("loopBoth")) + "</span>" : "") +
            ways +
            (dirs.length > 1 && scanned && scanned.status === "alert" && !span
              ? '<div class="hint" style="margin:4px 0 0">' + esc(t("loopUnknown")) + "</div>" : ""),
            routeHead(rid, dirs[0], [dirs[0]],
              "<b>" + esc(t("legTotal", { n: dirs[0].hops })) + "</b>" + kmTag(routeMetres([dirs[0]])) +
              " ・ " + esc(t("legDirect"))));
      });
      direct.forEach((rid, i) => {
        if (!rows[i]) return;
        const dirs = railwayDirections(rid, idsFrom, idsTo);
        trainCards.push({ bad: badLine(lineInfo(rid)) ? 1 : 0,
                          metres: dirs.length ? routeMetres([dirs[0]]) : Infinity,
                          hops: dirs.length ? dirs[0].hops : 0, changes: 0,
                          rids: [rid], html: rows[i] });
      });
    }
    /* A direct line existing is not the same as a direct line running. 朝霞→池袋
       is served end to end by the 東上線, so the transfer search never ran — and
       when the 東上線 was the very line that had stopped, the panel offered it
       and nothing else. Whenever every direct line is disrupted, look for the
       way round as well: 朝霞→和光市 で有楽町線 に乗り換えれば池袋 に着く。 */
    directAllBad = direct.length > 0 && direct.every(rid => badLine(lineInfo(rid)));
    if (!direct.length || directAllBad){
      /* Rank before cutting, and count each pair of lines once.
         東京→和光市 came back with 26 candidates, of which only four were shown
         — and the four were whichever the station-name map happened to reach
         first. 山手線→池袋→東上線 was found every time and never displayed.
         Two things were wrong with the four:
           ・ the same trip appeared several times under different names for the
             interchange (有楽町 and 有楽町・銀座一丁目, 新宿 and 新宿三丁目), so
             duplicates ate the slots — 26 candidates are 9 distinct routes;
           ・ nothing ranked them, so a 26-stop route could push out a 16-stop one.
         Both legs' directions are worked out here anyway, so the stop count is
         free; the whole pass costs 2 ms on 新宿→東京 with 233 candidates. */
      const byPair = new Map();
      findTransferRoutes(from, to, index).forEach(tr => {
        const d1 = railwayDirections(tr.rid1, idsFrom, new Set([tr.viaId1]));
        const d2 = railwayDirections(tr.rid2, new Set([tr.viaId2]), idsTo);
        if (!d1.length || !d2.length) return;      // stationOrder does not join these up
        const hops = d1[0].hops + d2[0].hops;
        /* What makes two of these the same ride is not the pair of lines — it
           is where you get on the second one. 和光市→海浜幕張 offers 有楽町線 →
           京葉線 three times over: at 有楽町, at 銀座一丁目, and at 新木場. The
           first two are one journey written twice, because both walk you to the
           京葉線 platform at 東京. 新木場 is a different journey — you ride the
           有楽町線 to the end and step across, and never see 東京 at all. Keyed
           on the line pair alone all three collapsed into one and 新木場 was the
           one thrown away. Keyed on the boarding station, the duplicates still
           collapse and the real alternative survives. */
        const key = tr.rid1 + ">" + tr.rid2 + ">" + tr.viaId2;
        const cur = byPair.get(key);
        if (cur && cur.hops <= hops) return;
        byPair.set(key, { tr, d1, d2, hops, metres: routeMetres([d1[0], d2[0]]),
          bad: (badLine(lineInfo(tr.rid1)) ? 1 : 0) + (badLine(lineInfo(tr.rid2)) ? 1 : 0) });
      });
      /* a route that stays on the broken line the whole way is not a way round,
         so disruption outranks distance */
      /* Distance, not stops. A route with fewer stops can be twice as long:
         和光市→立川 through 新宿 is 26 stops and 42 km against a 20 km trip. */
      /* Two boarding points for one pair of lines is a choice; five is a list.
         Cap it so that widening the key above cannot flood the ranking with one
         line pair and crowd out the others. */
      const perPair = new Map();
      const ranked = Array.from(byPair.values())
        .sort((a, b) => a.bad - b.bad || a.metres - b.metres)
        .filter(c => {
          const k = c.tr.rid1 + ">" + c.tr.rid2;
          const n = perPair.get(k) || 0;
          if (n >= 2) return false;
          perPair.set(k, n + 1);
          return true;
        });
      /* Then one route per arriving line before any line gets a second.
         和光市 is served by the 副都心線, 有楽町線 and 東上線; ranking alone gave
         three ways onto the 副都心線 and nothing else, which is one choice
         dressed as three. The line you step off is the choice that matters. */
      const transferRoutes = [];
      const arrivals = new Set();
      ranked.forEach(c => {
        if (transferRoutes.length >= 4 || arrivals.has(c.tr.rid2)) return;
        arrivals.add(c.tr.rid2); transferRoutes.push(c);
      });
      ranked.forEach(c => {
        if (transferRoutes.length >= 4 || transferRoutes.indexOf(c) >= 0) return;
        transferRoutes.push(c);
      });
      transferRoutes.sort((a, b) => a.bad - b.bad || a.metres - b.metres);
      /* the same exception one change down: a much shorter route with a notice
         on it is worth a slot */
      const oneChange = withShortcut(transferRoutes, ranked, 4,
                                     c => effortOf(c.metres, c.hops, 1), c => c.bad > 0);
      transferRoutes.length = 0;
      oneChange.forEach(c => transferRoutes.push(c));
      let rows = [];
      if (transferRoutes.length){
        rows = transferRoutes.map(cand => {
          const tr = cand.tr;
          const rw1 = cache.railwayById.get(tr.rid1) || {};
          const scanned1 = lineInfo(tr.rid1);
          const pill1 = scanned1
            ? ' <span class="pill ' + (scanned1.status === "normal" ? "ok" : scanned1.status === "alert" ? "bad" : "") + '">' +
              esc(scanned1.status === "normal" ? t("statusNormal") : scanned1.status === "alert" ? t("statusAlert") : t("statusNoData")) + "</span>"
            : "";
          const name1 = esc(titleOf(rw1["odpt:railwayTitle"], humanizeId(tr.rid1)));

          const rw2 = cache.railwayById.get(tr.rid2) || {};
          const scanned2 = lineInfo(tr.rid2);
          const pill2 = scanned2
            ? ' <span class="pill ' + (scanned2.status === "normal" ? "ok" : scanned2.status === "alert" ? "bad" : "") + '">' +
              esc(scanned2.status === "normal" ? t("statusNormal") : scanned2.status === "alert" ? t("statusAlert") : t("statusNoData")) + "</span>"
            : "";
          const name2 = esc(titleOf(rw2["odpt:railwayTitle"], humanizeId(tr.rid2)));

          const viaName = esc(tr.transferStationName);

          const dirs1 = cand.d1, dirs2 = cand.d2;   // worked out during ranking
          const hops1 = dirs1[0].hops;
          const hops2 = dirs2[0].hops;
          const totalHops = cand.hops;

          const label = esc(t("howtoTrainStops", { n: totalHops })) + " (" + esc(t("transferAt", { station: viaName })) + ")";

          const col1 = rw1["odpt:color"] || "", col2 = rw2["odpt:color"] || "";
          const leg1Html = renderStopSpan(dirs1[0].stations, 0, dirs1[0].stations.length - 1, "stationSpanTitle", null, col1);
          const leg2Html = renderStopSpan(dirs2[0].stations, 0, dirs2[0].stations.length - 1, "stationSpanTitle", null, col2);

          const ways = '<details class="trainroute sub"><summary><div class="stoprow">' +
              '<span class="stopdot"></span><span class="stopname">' +
              esc(t("stationSpanOpen")) + '</span></div></summary>' +
            '<div style="margin:4px 0 10px 14px">' +
              routeMapFigure([{ rid: tr.rid1, dir: dirs1[0] }, { rid: tr.rid2, dir: dirs2[0] }]) +
              leg1Html +
              '<div class="stoprow" style="margin:8px 0; font-weight:bold;"><span class="stopdot" style="background:var(--warn)"></span><span class="stopname">⏬ ' +
              esc(t("transferAt", { station: viaName })) + '</span></div>' +
              leg2Html +
            '</div></details>';

          return { clear: cand.bad === 0, html: routeDiagram(
            [from.name, tr.transferStationName, to.name],
            [{ name: titleOf(rw1["odpt:railwayTitle"], humanizeId(tr.rid1)), color: rw1["odpt:color"] || "",
               pill: pill1, meta: t("legOff", { n: hops1, stop: tr.transferStationName }) },
             { name: titleOf(rw2["odpt:railwayTitle"], humanizeId(tr.rid2)), color: rw2["odpt:color"] || "",
               pill: pill2, meta: t("legOff", { n: hops2, stop: to.name }) }],
            ways,
            routeHead(tr.rid1, dirs1[0], [dirs1[0], dirs2[0]],
              "<b>" + esc(t("legTotal", { n: totalHops })) + "</b>" + kmTag(cand.metres) + " ・ " +
              esc(t("legChanges", { k: 1 })))) };
        }).filter(x => x && x.html);
        clearOneChange = rows.filter(r => r.clear).length;
      }
      /* a heading with nothing under it is worse than no heading — every row can
         still drop out when a leg's stationOrder does not join the two ends up */
      rows.forEach((r, i) => {
        const c = transferRoutes[i];
        trainCards.push({ bad: c ? c.bad : 1, metres: c ? c.metres : Infinity,
                          hops: c ? c.hops : 0, changes: 1,
                          rids: c ? [c.tr.rid1, c.tr.rid2] : [], html: r.html });
      });
      /* Counting the one-change routes is not the same as finding one that
         works. A single candidate whose two legs are both suspended used to
         end the search, leaving one red card and nothing else. Look further
         whenever none of them is clear end to end — the one-change block
         above still stands, so nothing is hidden by looking.

         And look further when the best one-change route is a long way round.
         和光市→立川 is 20.6 km apart; the only one-change route runs 42 km
         through 新宿, while 東上線 → 朝霞台 → 武蔵野線 → 西国分寺 → 中央線 is
         nine stops. Fewest changes is not the same as best, and a route that
         doubles the distance is the signal that the extra change is worth
         looking for. */
      const straight = endpointMetres(from, to);
      const bestClear = ranked.filter(c => !c.bad)[0];
      const longWay = !!(straight && bestClear && bestClear.metres > straight * DETOUR_FACTOR);
      if (!rows.length || !clearOneChange || longWay){
        /* nothing with one change — 朝霞→御成門 is a real trip with a real
           answer, it just needs two. Kept to three so the panel stays readable. */
        let twice = findDoubleTransferRoutes(from, to, index, 3);
        /* When the only reason for looking was the detour, an extra change has
           to earn itself: it is offered only if it is meaningfully shorter than
           the route the reader already has. */
        if (longWay && rows.length && clearOneChange)
          twice = twice.filter(x => x.metres && x.metres < bestClear.metres * 0.85);
        if (twice.length){
          const linePill = rid => {
            const st = lineInfo(rid);
            return st
              ? ' <span class="pill ' + (st.status === "normal" ? "ok" : st.status === "alert" ? "bad" : "") + '">' +
                esc(st.status === "normal" ? t("statusNormal") : st.status === "alert" ? t("statusAlert") : t("statusNoData")) + "</span>"
              : "";
          };
          const lineName = rid =>
            esc(titleOf((cache.railwayById.get(rid) || {})["odpt:railwayTitle"], humanizeId(rid)));
          const arrow = ' <span style="opacity:0.7; margin:0 4px">➔</span> ';

          const rows2 = twice.map(tr => {
            const via1 = esc(tr.via1Name), via2 = esc(tr.via2Name);
            const change = v => '<span class="pill" style="font-weight:bold">' + esc(t("transferAt", { station: v })) + "</span>";
            const label = esc(t("howtoTrainStops", { n: tr.hops })) +
              " (" + esc(t("transferAt", { station: tr.via1Name })) +
              " / " + esc(t("transferAt", { station: tr.via2Name })) + ")";
            const changeRow = v =>
              '<div class="stoprow" style="margin:8px 0; font-weight:bold;"><span class="stopdot" style="background:var(--warn)"></span><span class="stopname">⏬ ' +
              esc(t("transferAt", { station: v })) + "</span></div>";
            const lineCol = rid => (cache.railwayById.get(rid) || {})["odpt:color"] || "";
            const span = (leg, rid) => renderStopSpan(leg.stations, 0, leg.stations.length - 1,
                                                      "stationSpanTitle", null, lineCol(rid));

            const ways = '<details class="trainroute sub"><summary><div class="stoprow">' +
                '<span class="stopdot"></span><span class="stopname">' +
                esc(t("stationSpanOpen")) + '</span></div></summary>' +
              '<div style="margin:4px 0 10px 14px">' +
                routeMapFigure([{ rid: tr.rid1, dir: tr.legs[0] },
                             { rid: tr.rid2, dir: tr.legs[1] },
                             { rid: tr.rid3, dir: tr.legs[2] }]) +
                span(tr.legs[0], tr.rid1) + changeRow(tr.via1Name) +
                span(tr.legs[1], tr.rid2) + changeRow(tr.via2Name) +
                span(tr.legs[2], tr.rid3) +
              "</div></details>";

            const seg = (rid, hops, next) => {
              const rw = cache.railwayById.get(rid) || {};
              return { name: titleOf(rw["odpt:railwayTitle"], humanizeId(rid)),
                       color: rw["odpt:color"] || "", pill: linePill(rid),
                       meta: t("legOff", { n: hops, stop: next }) };
            };
            return routeDiagram(
              [from.name, tr.via1Name, tr.via2Name, to.name],
              [seg(tr.rid1, tr.legs[0].hops, tr.via1Name),
               seg(tr.rid2, tr.legs[1].hops, tr.via2Name),
               seg(tr.rid3, tr.legs[2].hops, to.name)],
              ways,
              routeHead(tr.rid1, tr.legs[0], tr.legs,
                "<b>" + esc(t("legTotal", { n: tr.hops })) + "</b>" + kmTag(tr.metres) + " ・ " +
                esc(t("legChanges", { k: 2 }))));
          });

          rows2.forEach((html, i) => {
            const tr = twice[i];
            trainCards.push({ bad: tr ? (badLine(lineInfo(tr.rid1)) ? 1 : 0) +
                                        (badLine(lineInfo(tr.rid2)) ? 1 : 0) +
                                        (badLine(lineInfo(tr.rid3)) ? 1 : 0) : 1,
                              metres: tr && tr.metres ? tr.metres : Infinity,
                              hops: tr ? tr.hops : 0, changes: 2,
                              rids: tr ? [tr.rid1, tr.rid2, tr.rid3] : [], html: html });
          });
        }
      }
    }
    /* running first, then least effort */
    trainCards.sort((a, b) => a.bad - b.bad || effort(a) - effort(b));
    if (trainCards.length){
      /* The list is already in the order the app would take them; say so on
         the first one, but only when it is actually clear end to end and only
         when there is something to prefer it over. */
      /* Nothing is served by offering a way round that is four times the trip.
         和光市→立川 — 20.6 km apart — was listing a 92 km ride through 川越 and
         西武新宿, and a 96 km one through 小川町 and 八高線, for no better reason
         than that they happened to be clear end to end while the short ones had
         notices out. They are not alternatives; they are different journeys.

         The yardstick is the shortest route actually found, not the straight
         line: there is always one, so this can never empty the list, and it
         needs no assumption about how far a railway ought to wander. */
      const REACH_FACTOR = 2.5;
      const lengths = trainCards.map(c => c.metres).filter(m => m && isFinite(m));
      const shortestM = lengths.length ? Math.min.apply(null, lengths) : 0;
      const usable = shortestM
        ? trainCards.filter(c => !c.metres || !isFinite(c.metres) || c.metres <= shortestM * REACH_FACTOR)
        : trainCards;
      const shown = withShortcut(usable, usable, 6, effort, c => c.bad > 0);
      /* Which of them is here in spite of the ordering, and therefore needs a
         word to say why — otherwise the reader sees a shorter route sitting
         below a longer one and no reason given.

         Normally that is a route much shorter than the best one running clear.
         But the ordering puts every route with fewer disrupted lines ahead of
         every route with more, before distance is looked at at all, and when
         nothing is running clear that comparison had nothing to measure
         against: bestM was 0, the condition was false, and no card was ever
         marked. 和光市→立川 on a day with both the 武蔵野線 and the 中央線快速
         out showed 9 stops and 27 km in fourth place, under a 15-stop 33 km
         route, in silence.

         So when nothing is clear the yardstick becomes the card offered first.
         A route cheaper than that one, sitting below it only because more of
         its lines carry notices, is exactly the case the label exists for. */
      const clearM = shown.filter(c => !c.bad).map(effort).filter(m => m && isFinite(m));
      const bestM = clearM.length ? Math.min.apply(null, clearM) : 0;
      const top = shown[0];
      const isShortcut = c => {
        if (!c.bad) return false;
        if (bestM) return effort(c) < bestM * SHORTCUT_RATIO;
        return !!top && c !== top && c.bad > top.bad && effort(c) < effort(top);
      };
      /* A line in the middle of a route belongs to neither end, so neither the
         verdict (which is built from the lines that serve the two stations) nor
         「参考：出発地・目的地の他の路線」 ever mentions it. 和光市→立川 runs
         through the 武蔵野線, and when that had a notice out the cards said so
         and the summary at the top did not. Now it does. */
      const endRids = new Set();
      if (from) from.railways.forEach(r => endRids.add(r));
      if (to)   to.railways.forEach(r => endRids.add(r));
      const midBad = [];
      shown.forEach(c => (c.rids || []).forEach(rid => {
        if (endRids.has(rid) || midBad.indexOf(rid) >= 0) return;
        if (badLine(lineInfo(rid))) midBad.push(rid);
      }));
      const noticeBox = $("#routeNotice");
      if (noticeBox)
        noticeBox.innerHTML = midBad.length
          ? '<div class="banner warn" style="margin-top:10px"><div class="ico">🔀</div><div>' +
            "<h3>" + esc(t("midTitle")) + "</h3><p>" + esc(t("midBody")) + "</p>" +
            '<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">' +
            midBad.map(rid => {
              const l = lineInfo(rid);
              return "<li><strong>" +
                esc(titleOf((cache.railwayById.get(rid) || {})["odpt:railwayTitle"], humanizeId(rid))) +
                "</strong>" + infoSummaryHtml(rid, l.info, "margin-top:5px") +
                origTextHtml(l.info, "margin-top:5px") + "</li>";
            }).join("") + "</ul></div></div>"
          : "";
      blocks.push({ ico: directAllBad ? "🔁" : "🚃", title:t("howtoTrain"),
                    body:routeCards(shown.map((c, i) =>
                      ({ html:c.html,
                         best: i === 0 && !c.bad && shown.length > 1,
                         shortcut: isShortcut(c) }))) });
    } else {
      blocks.push({ ico:"🚃", title:t("howtoTrain"),
                    body:'<div class="empty">' + esc(t("howtoTrainNone")) + "</div>" });
    }
  }

  /* --- another station: your line is down, but a nearby one may not be --- */
  /* Walking distance is measured from where the trip starts. With an origin
     typed that is the origin, not wherever the last scan happened to be; with
     no origin the scan point IS the user's location and still applies. */
  let walkFrom = stationGroups;
  if (from){
    const withGeo = (from.stations || []).find(st => st["geo:lat"] && st["geo:long"]);
    walkFrom = withGeo
      ? stationsNear(withGeo["geo:lat"], withGeo["geo:long"], 3000, 6)
      : [];
  }
  if (to && walkFrom && walkFrom.length){
    /* The station records behind a group from stationsNear. Both halves of this
       section need them — one to draw the stops on the way, the other to build
       a pseudo-match — and the same name far away is a different station
       (霞ヶ関), so this goes by position as well as by name. */
    const groupStations = g => (index || []).filter(st => {
      if (!st["geo:lat"] || !st["geo:long"]) return false;
      if (haversine(g.lat, g.lon, st["geo:lat"], st["geo:long"]) > 900) return false;
      const names = stationNames(st);
      return names.indexOf(normName(g.ja || g.name)) >= 0 || names.indexOf(normName(g.name)) >= 0;
    });
    /* 「2.4 km」 alone does not say whether this is worth doing. At 80 m a
       minute that is half an hour on foot, and the reader should be told
       before setting off, not after. */
    const walkMins = d => Math.max(1, Math.round(d / 80));
    const stopSpan = legs =>
      '<details class="trainroute sub"><summary><div class="stoprow">' +
        '<span class="stopdot"></span><span class="stopname">' + esc(t("stationSpanOpen")) +
      '</span></div></summary><div style="margin:4px 0 10px 14px">' +
      routeMapFigure(legs) +
      legs.map((leg, i) =>
        (i ? '<div class="stoprow" style="margin:8px 0;font-weight:bold"><span class="stopdot" style="background:var(--warn)"></span><span class="stopname">⏬ ' +
             esc(t("transferAt", { station: leg.via })) + "</span></div>" : "") +
        renderStopSpan(leg.dir.stations, 0, leg.dir.stations.length - 1, "stationSpanTitle", null,
                       (cache.railwayById.get(leg.rid) || {})["odpt:color"] || "")
      ).join("") + "</div></details>";
    /* lineInfo, not state.lines. The scan only covers a few hundred metres
       around the origin, so a line at a station 2.4 km away is simply absent
       from it — and an absent line was being read as "status unknown" and
       dropped. 葛西 with the 東西線 stopped offered two one-change routes from
       船堀 and 一之江 while silently discarding 葛西臨海公園, from where the
       京葉線 runs to 東京 with no change at all. The transfer search below
       always used lineInfo; both halves of this section now agree. */
    const running = rid => lineInfo(rid).status;
    /* directAllBad, not "any direct line is bad". The transfer search above
       already used the stricter test, and the two disagreeing produced this:
       和光市→池袋 with only the 東上線 stopped judged 「迂回できます」 — the
       有楽町線 and 副都心線 leave the same platform normally — and then told
       the user to walk 2.1 km to 地下鉄成増 to catch those very lines. Walking
       is only worth suggesting when nothing from this station works. */
    const alt = [];
    if (directAllBad || !direct.length){
      walkFrom.forEach(g => {
        if (from && normLoose(g.name) === normLoose(from.name)) return;   // that is where we already are
        (g.own || []).forEach(rid => {
          if (!to.railways.has(rid)) return;                              // must reach the destination
          const st = running(rid);
          /* nodata is not "not running". 小田急・相鉄・ゆりかもめ publish no
             service information at all, so they were nodata for ever and could
             never be offered — while the verdict banner, faced with the same
             lines, says plainly that it cannot judge them. Silently deleting a
             line the user could actually ride is the worse of the two. Offer
             it, and let the pill say what is known. */
          if (st !== "normal" && st !== "nodata") return;
          const rw = cache.railwayById.get(rid) || {};
          if (alt.some(a => a.rid === rid)) return;
          /* the stations between that platform and the destination — the same
             list the main route cards open, so the two read alike */
          const dirs = railwayDirections(rid, new Set(groupStations(g).map(x => x["owl:sameAs"])), idsTo);
          alt.push({ rid, g, status:st, dir: dirs[0] || null,
                     name:titleOf(rw["odpt:railwayTitle"], humanizeId(rid)) });
        });
      });
      /* a line confirmed running beats one we simply cannot see */
      alt.sort((a, b) => (a.status === "normal" ? 0 : 1) - (b.status === "normal" ? 0 : 1));
    }
    /* Nothing from the origin works at all — widen the same search to one
       change of trains from each nearby station. Both legs must be running,
       and a route whose lines were already offered from the origin is not
       worth a walk. Capped hard: one route per station, three in all. */
    const xferRows = [];
    /* "nothing from the origin works" — asked directly, rather than through
       the verdict's `affected`. affected requires an alert, so a trip blocked
       entirely by 「状態を読み取れない」 notices (unknown) reached this point
       with the flag false and the search never ran, even though the user had
       no route at all. What matters here is whether an answer exists, not
       which kind of notice denied it. */
    const noWayFromOrigin = (!direct.length || directAllBad) && !clearOneChange;
    if (noWayFromOrigin && index){
      const originIds = (state.routeVerdict && state.routeVerdict.directIds) || new Set();
      const seenPair = new Set();
      for (const g of walkFrom){
        if (xferRows.length >= 3) break;
        if (from && normLoose(g.name) === normLoose(from.name)) continue;
        if (normLoose(g.name) === normLoose(to.name)) continue;
        if (alt.some(x => x.g === g)) continue;       // a clear direct line beats a transfer
        if (!g.lat || !g.lon || !(g.own || []).length) continue;
        const near = groupStations(g);
        if (!near.length) continue;
        const gm = { name: g.name, stations: near, railways: new Set(g.own) };
        let best = null, checked = 0;
        const usable = rid => {
          const st = lineInfo(rid).status;
          return st === "normal" || st === "nodata";
        };
        for (const tr of findTransferRoutes(gm, to, index)){
          if (!usable(tr.rid1) || !usable(tr.rid2)) continue;
          if (originIds.has(tr.rid1) && originIds.has(tr.rid2)) continue;
          const key = tr.rid1 + ">" + tr.rid2;
          if (seenPair.has(key)) continue;
          if (++checked > 12) break;                  // ranking, not an exhaustive search
          const d1 = railwayDirections(tr.rid1, new Set(near.map(st => st["owl:sameAs"])), new Set([tr.viaId1]));
          const d2 = railwayDirections(tr.rid2, new Set([tr.viaId2]), idsTo);
          if (!d1.length || !d2.length) continue;
          const hops = d1[0].hops + d2[0].hops;
          const known = lineInfo(tr.rid1).status === "normal" && lineInfo(tr.rid2).status === "normal";
          /* confirmed running first, shortest within that */
          if (!best || (known !== best.known ? known : hops < best.hops))
            best = { tr, hops, key, known, d1:d1[0], d2:d2[0] };
        }
        if (best){
          seenPair.add(best.key);
          const nm = rid => titleOf((cache.railwayById.get(rid) || {})["odpt:railwayTitle"], humanizeId(rid));
          xferRows.push('<div class="stoprow"><span class="stopdot"></span><span class="stopname">' +
            "<strong>" + esc(g.name) + "</strong> " + esc(fmtDist(g.d)) + " " +
            esc(t("walkMin", { m: walkMins(g.d) })) + " " + walkLink(g.lat, g.lon) + "<br>" +
            esc(t("howtoAltXferRow", { line1: nm(best.tr.rid1), via: best.tr.transferStationName,
                                       line2: nm(best.tr.rid2), to: to.name, n: best.hops })) +
            altStatusPill(best.known ? "normal" : "nodata") +
            mapsRouteLink(g.name, to.name) +
          "</span></div>" +
          stopSpan([{ rid: best.tr.rid1, dir: best.d1 },
                    { rid: best.tr.rid2, dir: best.d2, via: best.tr.transferStationName }]));
        }
      }
    }
    if (alt.length || xferRows.length){
      const rows = alt.slice(0, 4).map(a =>
        '<div class="stoprow"><span class="stopdot"></span><span class="stopname">' +
          "<strong>" + esc(a.g.name) + "</strong> " + esc(fmtDist(a.g.d)) + " " +
          esc(t("walkMin", { m: walkMins(a.g.d) })) + " " + walkLink(a.g.lat, a.g.lon) + "<br>" +
          esc(t("howtoAltRow",{ line:a.name, to:to.name })) +
          (a.dir ? " " + esc(t("howtoAltStops", { n: a.dir.hops })) : "") +
          altStatusPill(a.status) + mapsRouteLink(a.g.name, to.name) +
        "</span></div>" +
        (a.dir ? stopSpan([{ rid: a.rid, dir: a.dir }]) : "")).concat(xferRows);
      /* The heading names the thing; it does not say why anyone would do it.
         「別の駅から」 on its own reads as a list of stations, and the walk it
         is asking for goes unmentioned until the reader has already worked out
         what the section is. Say the whole proposition in one sentence. */
      blocks.push({ ico:"🚶", title:t("howtoAlt"),
                    body:'<div class="hint" style="margin:0 0 8px">' + esc(t("howtoAltHint")) + "</div>" +
                         routeCards(rows) });
    }
  }

  /* --- buses: which stop to walk to, which route, where to get off --- */
  const reach = state.busReach;
  const currentDest = routeDestination();
  if (reach && normLoose(reach.dest) === normLoose(currentDest)){
    const rows = [];
    if (reach.byStop && reach.byStop.size) {
      for (const [stopName, routes] of reach.byStop.entries()) {
        const g = (reach.stops && reach.stops.get(stopName)) ||
          (state.bus && state.bus.stops ? state.bus.stops.find(x => x.name === stopName) : null);
        const distStr = g && g.d ? esc(fmtDist(g.d)) + " " : "";
        const pole = g && g.poles && g.poles[0];
        const walk = pole ? walkLink(pole["geo:lat"], pole["geo:long"]) : "";

        routes.forEach(r => {
          const getoff = LANG === "ja" ? r.destName : (r.destShown || r.destName);
          /* the walk to the boarding stop is part of the trip, so it hangs off
             the first station row rather than being buried in a sentence */
          const board = esc(stopName) + (distStr || walk
            ? ' <span class="legmeta" style="display:inline;margin:0">' + distStr + walk + "</span>" : "");
          rows.push({ d: g && g.d != null ? g.d : Infinity, n: r.stopsAhead,
            html: routeDiagram([stopName, getoff],
                    [{ name: (r.label ? r.label.main : r.title), color: "",
                       meta: t("legOffBus", { n: r.stopsAhead, stop: getoff }) }],
                    "<b>" + esc(t("legTotalBus", { n: r.stopsAhead })) + "</b>" +
                    (distStr || walk ? ' <span class="legmeta" style="display:inline">' + distStr + walk + "</span>" : "") +
                    '<details class="busroute sub" data-pattern="' + esc(r.id) +
                      '" data-from="' + r.from + '" data-to="' + r.to + '">' +
                      '<summary><div class="stoprow"><span class="stopdot"></span><span class="stopname">' +
                        esc(t("stopSpanOpen")) + "</span></div></summary>" +
                      '<div class="routebody" style="margin:4px 0 10px 14px"></div>' +
                    "</details>") });
        });
      }
    }
    /* walk to the nearest stop first. The map comes out in fetch order, which
       put 池袋駅東口 (148 m) below 東池袋一丁目 (481 m) for 池袋→巣鴨. */
    rows.sort((a,b) => a.d - b.d || a.n - b.n);
    if (rows.length) blocks.push({ where:"alt", ico:"🚌", title:t("howtoBus"), body:routeCards(rows.map(x => x.html)) });
    else blocks.push({ where:"alt", ico:"🚌", title:t("howtoBus"), body:'<div class="empty">' +
      esc(reach.reason === "noOriginStops" ? t("howtoBusNoOrigin",{ q:routeOrigin() }) : t("howtoBusNone")) + "</div>" });
  } else if (!state.bus && (!reach || !reach.byStop.size)){
    blocks.push({ where:"alt", ico:"🚌", title:t("howtoBus"), body:'<div class="empty">' + esc(t("howtoBusNeedScan")) + "</div>" });
  } else if (!currentDest){
    blocks.push({ where:"alt", ico:"🚌", title:t("howtoBus"), body:'<div class="empty">' + esc(t("howtoBusNone")) + "</div>" });
  } else {
    blocks.push({ where:"alt", ico:"🚌", title:t("howtoBus"), body:'<div class="empty"><span class="spinner"></span> ' + esc(t("howtoBusWait")) + "</div>" });
  }

  /* the cards first, these after: neither is worth making the answer wait */
  setTimeout(() => { fillNextDepartures(); fillFares(); }, 0);
  /* Trains and the alternatives to trains are two different questions asked at
     two different moments, so they are two pages. Same blocks, same builder —
     only where they land changed. */
  const paint = (el, list, note) => {
    if (!el) return;
    el.innerHTML = list.map(b =>
      '<div class="item" style="display:block">' +
        '<div class="blockhead"><span class="blocktile">' + b.ico + "</span>" +
          '<span class="bt">' + esc(b.title) + "</span></div>" +
        b.body +
      "</div>").join("") +
      (note ? '<p class="hint">' + esc(t("howtoNote")) + "</p>" : "");
  };
  paint(box,             blocks.filter(b => b.where !== "alt"), true);
  paint($("#howtoBus"),  blocks.filter(b => b.where === "alt"), false);
  /* whatever it said last time was about a different trip */
  const airEl = $("#airVerdict");
  if (airEl){ airEl.innerHTML = ""; airEl.classList.add("hidden"); }

  /* The last-train answer goes above the routes, because for someone who has
     just landed it is the whole question and the routes are the detail. It is
     built after the cards so that it can read the first leg off the card the
     app actually chose, rather than working the choice out a second time. */
  if (boardClock() != null){
    setTimeout(async () => {
      const html = await airVerdictHtml();
      const el = $("#airVerdict");
      if (el){ el.innerHTML = html; el.classList.toggle("hidden", !html); }
    }, 0);
  }
}

/* Walking directions.

   Leaving the origin out makes Google Maps start from the device's own
   position: more precise than any station centroid, and the user's coordinates
   never go into a URL — which is what the privacy policy promises.

   That only holds while the trip starts where the user is. Type an origin a
   town away and "walk here" was routing from wherever the phone happened to
   be, which is no use at all. So the origin is added exactly when it is not
   the user's current position — and what goes into the URL then is the station
   they typed, not where they are standing. Same 1.2 km rule as the share-cycle
   link and the bus stops' fromHere, so the three cannot drift apart. */
/* Where should the walk start? Deferring to the device is only right when the
   device is actually there — a GPS scan says it is; a station typed by name
   says nothing about where the user stands. Typing 和光市 from a hotel in 兵庫
   made the scan point and the origin agree with each other, both being 和光市,
   and the old test read that agreement as "the user is here" — so Maps opened
   a 500 km walk from the hotel. Agreement between two typed values is not
   presence. */
function walkOrigin(){
  const gpsScan = state.position && !state.position.manualName;
  if (gpsScan && nearScanPoint(state.originMatch)) return null;   // genuinely standing there
  if (state.originCoords) return state.originCoords;              // the typed origin
  if (state.position && state.position.manualName)                // manual scan, no route yet
    return { lat: state.position.lat, lon: state.position.lon };
  return null;
}
/* The trip handed to Google Maps, for the times and the fare. This app knows
   which lines are running; Google knows when the next one leaves.

   The two ends only, never the interchange. The Maps URL API accepts
   `waypoints` and the documentation says only that some clients ignore it —
   but measuring what actually happens shows worse than ignoring: with a stop
   in the middle, Google Maps offers driving, walking and cycling and produces
   NO transit itinerary at all. 東京→和光市 with no waypoint gives 「34分」 and a
   departure time; add 池袋 and the transit tab comes back blank. A link that
   lands on an empty result is worse than one that plans the same trip its own
   way, so the interchange is left out and Google routes between the two ends.

   Station names, not coordinates, so Maps shows a route between two named
   stations instead of two dropped pins. Names like 押上〈スカイツリー前〉 carry a
   second name in brackets, which is dropped. */
function mapsPlace(name){
  var v = String(name || "").replace(/[（(〈<［\[][^）)〉>］\]]*[）)〉>］\]]/g, "").trim();
  if (!v) return "";
  return /[぀-ヿ㐀-鿿]/.test(v) ? v + "駅" : v + " Station";
}
function mapsRouteLink(from, to){
  var a = mapsPlace(from), b = mapsPlace(to);
  if (!a || !b) return "";
  var url = "https://www.google.com/maps/dir/?api=1&travelmode=transit" +
    "&origin=" + encodeURIComponent(a) +
    "&destination=" + encodeURIComponent(b);
  var target = location.protocol === "file:" ? "" : ' target="_blank" rel="noopener noreferrer"';
  return ' <a class="linkbtn" href="' + url + '"' + target + '>' + esc(t("mapsOpen")) + "</a>";
}
function walkLink(lat, lon){
  if (!lat || !lon) return "";
  let url = "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" +
            encodeURIComponent(lat + "," + lon);
  const from = walkOrigin();
  if (from){
    url += "&origin=" + encodeURIComponent(from.lat + "," + from.lon);
  }
  const target = location.protocol === 'file:' ? '' : ' target="_blank" rel="noopener noreferrer"';
  return '<a class="linkbtn" href="' + url + '"' + target + '>' + esc(t("walkHere")) + "</a>";
}

/* scrollIntoView({block:"start"}) lands the element's top edge at y=0, which is
   exactly where the sticky header sits: the heading you scrolled to is the part
   that ends up hidden, and it reads as having scrolled too far. Stop the header's
   height short of that. Measured each time — the bar is one line in every
   language, but the font size is the phone's. */
function scrollToTop(el){
  if (!el) return;
  const bar = $(".topbar");
  /* The trip strip sticks under the header, covering the same band. Once it
     became permanent every scroll landed 41px too high and the target sat
     behind it — the same mistake as the header itself, one layer down. */
  const trip = $("#tripBar");
  const tripH = trip && !trip.classList.contains("hidden")
    ? trip.getBoundingClientRect().height : 0;
  const gap = (bar ? bar.getBoundingClientRect().height : 0) + tripH + 10;
  const y = window.pageYOffset + el.getBoundingClientRect().top - gap;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

/* On a phone the IME covers the lower half of the screen, and the suggestion
   list is drawn directly under the field it belongs to — so a field sitting low
   on the page has its own suggestions hidden behind the keyboard, which is
   exactly when they are needed. Focusing a field brings its step heading to the
   top; the field then sits in the upper third and the list has the free area
   above the keyboard to itself.

   Twice, and again on visualViewport resize: the first scroll happens before
   the keyboard is on screen, and the keyboard's arrival changes how much of the
   page is visible. */
function liftOnFocus(inputSel, cardSel, hitsSel){
  const input = $(inputSel), card = $(cardSel);
  if (!input || !card) return;
  const headBottom = () => {
    const bar = $(".topbar"), trip = $("#tripBar");
    return (bar ? bar.getBoundingClientRect().height : 0) +
           (trip && !trip.classList.contains("hidden") ? trip.getBoundingClientRect().height : 0);
  };
  /* The suggestion list's own max-height is in vh, which is the layout
     viewport — the keyboard does not change it. So on a phone the list still
     ran 300px down from the field and simply continued behind the keyboard.
     visualViewport is the part actually on screen; size the list to that. */
  const sizeHits = () => {
    const list = $(hitsSel);
    if (!list) return;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const room = vh - input.getBoundingClientRect().bottom - 12;
    list.style.maxHeight = Math.max(96, Math.round(room)) + "px";
  };
  /* How far the page has to move, in two numbers.

     `want` is the heading at the top — the reason this lift exists at all.
     `need` is the field and its list clear of the keyboard, which is the task.

     Aiming only at `want` was right while the card was short. The card is not
     short: a heading, two or three lines of explanation, the scan button, and
     after a scan a status line that runs to three lines of its own. Put its top
     against the header on a phone whose WebView has shrunk to ~400px for the
     keyboard, and the field lands *below the fold* — heading neatly at the top,
     and nothing to type into. Typing then makes it worse, because the trip
     strip appears at that moment and takes another 41px.

     So the heading is what we aim for and the list is what we guarantee: take
     whichever of the two asks for more, and the field is never under the
     keyboard again. On a short viewport that means the heading scrolls away —
     which is the right way round. The heading is context; the list is the job. */
  const MIN_LIST = 170;                       // about three suggestions
  const offsets = () => {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    return {
      want: card.getBoundingClientRect().top - (headBottom() + 10),
      need: input.getBoundingClientRect().bottom + 12 + MIN_LIST - vh
    };
  };
  const lift = force => {
    if (document.activeElement !== input) return;
    const o = offsets();
    /* While typing, step in only when it matters: the field is going under the
       keyboard, the heading has gone behind the header, or the card has drifted
       far below it. Otherwise a deliberate scroll of the user's would be undone
       on the next keystroke. */
    if (force || o.need > 6 || o.want < -6 || o.want > 130){
      const dy = Math.max(o.want, o.need);
      window.scrollTo({ top: Math.max(0, window.pageYOffset + dy), behavior:"smooth" });
    }
    sizeHits();
  };
  input.addEventListener("focus", () => {
    document.body.classList.add("imefocus");
    lift(true);
    /* and again once the keyboard is actually there: the first move is measured
       against a viewport that has not shrunk yet */
    setTimeout(() => lift(true), 260);
    setTimeout(() => lift(true), 600);
  });
  input.addEventListener("input", () => lift(false));
  input.addEventListener("blur", () => {
    /* tapping a suggestion blurs the field for an instant — do not take the
       room away underneath the list the user is reaching for */
    setTimeout(() => {
      const a = document.activeElement;
      if (a !== $("#routeFrom") && a !== $("#routeTo")) document.body.classList.remove("imefocus");
    }, 150);
  });
  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", () => lift(true));
  }
}
liftOnFocus("#routeFrom", "#scanCard", "#routeFromHits");
liftOnFocus("#routeTo", "#routeCard", "#routeToHits");

/* Re-rendering the bus block moves everything below it. Keep whatever the user
   is looking at visually still instead of letting the page jump. */
function withScrollAnchor(el, fn){
  const before = el ? el.getBoundingClientRect().top : 0;
  fn();
  if (!el) return;
  const after = el.getBoundingClientRect().top;
  if (Math.abs(after - before) > 1) window.scrollBy(0, after - before);
}

/* stops: N+1 station names, legs: N segments {name, color, pill, meta} */
function routeDiagram(stops, legs, footHtml, headHtml){
  let h = (headHtml || "") + '<div class="legs">';
  stops.forEach((stop, i) => {
    h += '<div class="mark"></div><div class="stop">' + esc(stop) + "</div>";
    const leg = legs[i];
    if (!leg) return;
    const col = leg.color || "var(--faint)";
    h += '<div class="bar" style="background:' + esc(col) + '"></div>' +
      '<div class="leg"><div class="legname">' +
        '<span class="swatch" style="background:' + esc(col) + '"></span>' + esc(leg.name) + "</div>" +
        (leg.meta ? '<div class="legmeta">' + esc(leg.meta) + "</div>" : "") +
      "</div>" +
      '<div class="legpill">' + (leg.pill || "") + "</div>";
  });
  h += "</div>";
  return h + (footHtml ? '<div class="routefoot">' + footHtml + "</div>" : "");
}

/* One card per candidate, numbered once there is more than one to tell apart.
   Takes either an HTML string or {html, best}; the marked one wears a strip,
   because a list sorted best-first only says so to whoever knows it is sorted. */
function routeCards(items){
  const list = items.filter(Boolean).map(x => typeof x === "string" ? { html:x } : x);
  if (!list.length) return "";
  const many = list.length > 1;
  return '<div class="routes">' + list.map((it, i) =>
    '<div class="route' + (many ? " numbered" : "") + (it.best ? " best" : "") +
      (it.shortcut ? " short" : "") + '">' +
      (it.best ? '<div class="beststrip">\u2605 ' + esc(t("bestPick")) + "</div>" : "") +
      (it.shortcut ? '<div class="shortstrip">\u26a0 ' + esc(t("shortcutTag")) + "</div>" : "") +
      (many ? '<span class="routeno">' + (i + 1) + "</span>" : "") + it.html +
    "</div>").join("") + "</div>";
}

/* 「行けます」だけでは途中が見えない — 乗車から下車までの停留所を出す */
function renderStopSpan(stops, from, to, titleKey, endKey, colour){
  const seg = stops.slice(from, to + 1);
  if (seg.length < 2) return '<div class="empty">' + esc(t("busRouteNone")) + "</div>";
  /* Bus stops have no numbers; the map simply comes back empty for them and no
     chip is drawn. An empty chip would be worse than none — it would look like
     a number that failed to load. */
  const codes = stationCodeMap();
  const rows = seg.map((st, i) => {
    const name = LANG === "ja" ? (st.ja || humanizeId(st.id))
                               : ((st.title && st.title.en) || humanizeId(st.id));
    const last = i === seg.length - 1;
    const tag = i === 0    ? '<span class="pill ok">'  + esc(t("stopBoard"))  + "</span>"
              : last       ? '<span class="pill ' + (endKey ? "" : "bad") + '">' + esc(t(endKey || "stopAlight")) + "</span>" : "";
    const code = codes.get(st.id) || "";
    return '<div class="stoprow' + (last && !endKey ? " hit" : "") + '">' +
      '<span class="stopdot"></span><span class="stopname">' +
      (code ? '<span class="scode" style="background:' + esc(colour || "var(--faint)") + '">' +
              esc(code) + "</span> " : "") + esc(name) +
      (LANG !== "ja" && st.ja && st.ja !== name ? ' <span lang="ja" style="color:var(--muted)">' + esc(st.ja) + "</span>" : "") +
      "</span>" + tag + "</div>";
  }).join("");
  return '<div class="meta" style="margin-bottom:4px">' + esc(t(titleKey || "stopSpanTitle",{ n:seg.length - 1 })) + "</div>" +
         '<div class="stoplist">' + rows + "</div>";
}

/* ------------------- station picker (no geolocation) ------------------- */
/* One entry per physical station: the same name at (roughly) the same place is
   published once per line, and stations without coordinates cannot be scanned. */
/* Rounding the coordinates to a 0.01° grid split a station whose platforms
   straddled a cell boundary: 銀座線の銀座 (lon 139.7654 → "139.77") landed in a
   different bucket from 日比谷・丸ノ内線の銀座 (139.7640 → "139.76") 125 m away,
   so 銀座 appeared twice with half its lines each — 34 stations were affected,
   including 大手町, 東京 and 新宿三丁目. Group by name, then merge on the real
   distance, which has no boundaries to fall off. */
const PLACE_MERGE_M = 800;
function buildPlaceIndex(index){
  /* Never remember a list built from an index that had not arrived yet. One
     search before the fetch finished — a language switch was enough to cause
     one — used to freeze an empty result in `cache.places`, and from then on
     every keystroke returned nothing until the page was reloaded. Keyed on the
     index itself, so it is rebuilt once the real one lands. */
  if (!index || !index.length) return [];
  if (cache.places && cache.placesFrom === index) return cache.places;
  const byName = new Map();
  index.forEach(s => {
    const lat = s["geo:lat"], lon = s["geo:long"];
    if (!lat || !lon) return;
    const tt = s["odpt:stationTitle"] || {};
    const nameKey = stationKey(s);
    let group = byName.get(nameKey);
    if (!group){ group = []; byName.set(nameKey, group); }
    /* same name far away is a different station (中野, 大久保 …) — keep those apart */
    let e = null;
    for (const cand of group){
      if (haversine(cand.lat, cand.lon, lat, lon) <= PLACE_MERGE_M){ e = cand; break; }
    }
    if (!e){
      e = { title:tt, ja:s["dc:title"] || tt.ja || "", lat, lon, railways:[], names:[], rnames:[], codes:[] };
      group.push(e);
    }
    if (s["odpt:railway"] && e.railways.indexOf(s["odpt:railway"]) < 0) e.railways.push(s["odpt:railway"]);
    /* One place carries every number its platforms are signed with — 新宿 is
       M08 and S-01 and JY17 and eight more, and the visitor reads whichever
       sign they are standing under.

       Both spellings are kept: 「m08」 as printed, and 「m8」 with the zero
       folded away. The list answers while the reader is still typing, and a
       prefix has to be compared against the printed form — 「m0」 is the start
       of 「m08」 but not of 「m8」. */
    [normName(s["odpt:stationCode"]), codeKey(s["odpt:stationCode"])]
      .forEach(c => { if (c && e.codes.indexOf(c) < 0) e.codes.push(c); });
    [s["dc:title"], tt.ja, tt.en, tt.ko, tt["zh-Hans"], tt["zh-Hant"], tt["ja-Hrkt"]]
      .filter(Boolean).forEach(n => {
        const v = normName(n);
        if (v && e.names.indexOf(v) < 0) e.names.push(v);
        /* only the latin titles survive romajiKey — that is the point */
        const r = romajiKey(v);
        if (r && e.rnames.indexOf(r) < 0) e.rnames.push(r);
      });
  });
  const places = [];
  byName.forEach(group => group.forEach(p => places.push(p)));
  cache.places = places;
  cache.placesFrom = index;
  return cache.places;
}
function searchPlaces(q){
  const nq = normName(q);
  if (!nq) return [];
  const rq = isKana(q) ? romajiKey(kanaToRomaji(q)) : "";
  const cq = looksLikeCode(q) ? codeKey(q) : "";
  const hits = [];
  const score = (n, needle) => {
    if (n === needle) return 100;
    if (n.indexOf(needle) === 0) return 80 - Math.min(20, n.length - needle.length);
    if (n.indexOf(needle) >= 0) return 55;
    return 0;
  };
  buildPlaceIndex(cache.stationIndex || []).forEach(p => {
    let sc = 0;
    p.names.forEach(n => { const cur = score(n, nq); if (cur > sc) sc = cur; });
    /* 「すがも」 has no reading to match against on the Mita or Yamanote line,
       so fall back to the romanised English title */
    if (!sc && rq) p.rnames.forEach(n => { const cur = score(n, rq); if (cur > sc) sc = cur; });
    /* The number off the sign. Unlike the verdict, the list may answer a
       partial one — the reader is still typing, and 「M0」 offering nine
       Marunouchi stations is a menu, not a wrong answer. Below an exact name
       so that a station whose name someone half-typed still comes first. */
    if (!sc && cq){
      p.codes.forEach(n => {
        const cur = (n === nq || n === cq) ? 100 : n.indexOf(nq) === 0 ? 75 : 0;
        if (cur > sc) sc = cur;
      });
    }
    if (sc) hits.push({ p, sc });
  });
  /* hubs first when the score ties — more lines means the better known station */
  hits.sort((a,b) => b.sc - a.sc || b.p.railways.length - a.p.railways.length);
  return hits.slice(0, 8).map(x => x.p);
}
let routeFromHits = [];
let routeToHits = [];
/* The station list is 2,000 records from fifteen operators, and the first
   keystroke is what fetches it. Until it lands there is nothing to show, so
   the panel stayed shut and the app looked as though it had stopped
   responding — the reader typed a station name and nothing happened for
   several seconds. Say what is going on, in the place they are looking. */
function renderHitsLoading(box){
  if (!box) return;
  const input = box.dataset.for ? $("#" + box.dataset.for) : null;
  if (input) input.classList.add("hasHits");
  box.innerHTML = '<div class="empty"><span class="spinner"></span> ' + esc(t("hitsLoading")) + "</div>";
}
function renderHitsList(box, list, query){
  /* the panel is drawn as one piece with its field, so the field has to know
     whether anything is hanging off it */
  const input = box.dataset.for ? $("#" + box.dataset.for) : null;
  const open = list.length > 0 || !!query;
  if (input) input.classList.toggle("hasHits", open);

  if (!list.length){
    box.innerHTML = query ? '<div class="empty">' + esc(t("manualNoHit",{ q:query })) + "</div>" : "";
    return;
  }
  box.innerHTML = list.map((p,i) => {
    const name = titleOf(p.title, p.ja);
    const seen = [];
    p.railways.forEach(r => {
      const nm = titleOf((cache.railwayById.get(r) || {})["odpt:railwayTitle"], humanizeId(r));
      if (nm && seen.indexOf(nm) < 0) seen.push(nm);
    });
    const extra = Math.max(0, seen.length - 3);
    return '<button type="button" class="hit" data-i="' + i + '">' +
      '<div class="name">' + esc(name) +
        (LANG !== "ja" && p.ja && p.ja !== name ? '<span class="lines" lang="ja">' + esc(p.ja) + "</span>" : "") +
      "</div>" +
      '<div class="lines">' + esc(seen.slice(0,3).join(" · ")) + (extra ? " +" + extra : "") + "</div>" +
      "</button>";
  }).join("");
  box.scrollTop = 0;
}
/* One origin for the whole page. Picking a station is not just "search here":
   it says where the trip starts, so the surroundings are fetched for it and the
   verdict is re-run if a destination is already set. Two boxes asking where you
   are — one in step 1, one in step 2 — is what let them drift apart. */
function scanPlace(p){
  const name = titleOf(p.title, p.ja);
  pickOrigin({ lat:p.lat, lon:p.lon, name });
}
/* Fills the box and stops there. Choosing a place is not the same as asking
   about it — the asking is one button, at the bottom, on every page. */
let pickOriginSeq = 0;
function pickOrigin(place){
  $("#routeFrom").value = place.name;
  /* The chip shows a place; the box is a station field. Everything downstream
     re-derives the station from the text — scanFromField with searchPlaces,
     checkRoute with matchStations — and on a label that is not a station name
     the two disagree without saying so. 「나리타 공항」 found nothing to scan and
     judged the trip from 成増, 68 km from the airport; 「Odaiba (Tokyo
     Teleport)」 judged from 小台. So the station is written down next to the
     label, and the box is filled from that instead of from the wording.

     The label goes in first so the tap lands immediately, and the station name
     replaces it when the index arrives — unless the reader has since typed
     something, in which case theirs wins. */
  resolveQuickStation(place, ++pickOriginSeq);
  routeFromHits = [];
  renderHitsList($("#routeFromHits"), [], "");
  /* a place chosen by name is not where the device says we are, so the fix
     stops applying */
  state.hereFix = null;
  /* Let the keyboard go. The action lives at the bottom of the screen, which
     is exactly where the keyboard is, so a field that keeps focus after the
     choice has been made hides the only way on. */
  $("#routeFrom").blur();
  clearStaleVerdict();
  updateFavBtn();
  updateTripBar();
  syncActions();
  setStatus($("#scanStatus"), "", "");
}

/* Japanese always resolves: it is the one title every record in the index
   carries, and the only one that never depends on an operator having filled in
   a translation. The name that lands in the box is still the reader's own —
   titleOf picks their language off the record we found. */
async function resolveQuickStation(place, turn){
  if (!place.st) return;                       // a saved place is already a station
  const idx = await getStationIndex().catch(() => null);
  if (!idx || turn !== pickOriginSeq) return;
  const hit = searchPlaces(place.st)[0];
  if (!hit) return;
  const box = $("#routeFrom");
  if (box.value !== place.name) return;        // typed over in the meantime
  box.value = titleOf(hit.title, hit.ja);
  updateFavBtn();
  updateTripBar();
  syncActions();
}

/* --------------------------- arriving by air --------------------------- */
/* Only the airports the app can actually answer for. Haneda's monorail and the
   limousine buses publish nothing here, so from Haneda this means Keikyu and
   from Narita it means the JR branch — said plainly on screen rather than
   discovered by a reader at midnight. */
const AIRPORTS = [
  { id:"HND3", station:"羽田空港第3ターミナル", intl:true,
    name:{ja:"羽田 第3（国際）", en:"Haneda T3 (intl)", zh:"羽田 第3（国际）", ko:"하네다 T3(국제)"} },
  { id:"HND12", station:"羽田空港第1・第2ターミナル", intl:false,
    name:{ja:"羽田 第1・第2（国内）", en:"Haneda T1/T2 (domestic)", zh:"羽田 第1・第2（国内）", ko:"하네다 T1·T2(국내)"} },
  { id:"NRT", station:"成田空港", intl:true,
    name:{ja:"成田 第1", en:"Narita T1", zh:"成田 第1", ko:"나리타 T1"} },
  { id:"NRT2", station:"空港第2ビル", intl:true,
    name:{ja:"成田 第2・第3", en:"Narita T2/T3", zh:"成田 第2・第3", ko:"나리타 T2·T3"} }
];
/* How long the airport takes. International needs immigration, so it starts
   longer. These are deliberately generous: being wrong in the optimistic
   direction leaves someone on a platform at midnight with no train. */
const BUFFERS = [20, 30, 40, 50, 60, 75, 90];
let airPick = null;

function renderAirport(){
  const box = $("#airPorts");
  if (!box) return;
  box.innerHTML = AIRPORTS.map(a =>
    '<button type="button" class="chip' + (airPick === a.id ? " on" : "") +
    '" data-air="' + a.id + '">' + esc(a.name[LANG] || a.name.en) + "</button>").join("");
  const sel = $("#airBuffer");
  const cur = sel.value ? Number(sel.value) : null;
  const port = AIRPORTS.find(a => a.id === airPick);
  const dflt = cur != null ? cur : (port && !port.intl ? 30 : 50);
  sel.innerHTML = BUFFERS.map(n =>
    '<option value="' + n + '"' + (n === dflt ? " selected" : "") + ">" +
    esc(t("airBufferOpt", { n: n })) + "</option>").join("");
  $("#airGo").textContent = t("airGo");
  $("#airWhy").textContent = port ? t("airWhy", { station: port.station }) : "";
}
$("#airPorts").addEventListener("click", e => {
  const b = e.target.closest("button[data-air]");
  if (!b) return;
  airPick = b.getAttribute("data-air");
  const port = AIRPORTS.find(a => a.id === airPick);
  /* international and domestic are different waits, so the default moves with
     the choice — until the reader overrides it, after which it is theirs */
  if (port) $("#airBuffer").value = String(port.intl ? 50 : 30);
  renderAirport();
});
$("#airGo").addEventListener("click", async () => {
  const port = AIRPORTS.find(a => a.id === airPick);
  const st = $("#scanStatus");
  if (!port){ setStatus(st, t("airWhere"), "err"); return; }
  const v = ($("#airTime").value || "").trim();
  const m = /^(\d{1,2}):(\d{2})$/.exec(v);
  if (!m){ setStatus(st, t("airNeedTime"), "err"); return; }
  const buffer = Number($("#airBuffer").value) || 50;
  const landed = Number(m[1]) * 60 + Number(m[2]);
  /* Minutes past midnight, and allowed to run past it: a 23:40 landing with a
     fifty minute airport is 00:30, which the timetable also counts as 24:30. */
  state.boardAt = landed + buffer;
  state.airport = { station: port.station, landed: v, buffer: buffer };
  depCache.clear();                       // the cached lists were sliced at "now"
  $("#routeFrom").value = port.station;
  state.hereFix = null;
  clearStaleVerdict();
  updateFavBtn(); updateTripBar(); syncActions();
  setStatus(st, "", "");
  await scanFromField();
});

/* Can you still get out of the airport? Asked of the first leg of the best
   route, because that is the leg with a last train and the one the reader is
   standing next to. Later connections are not timed — said on the card rather
   than quietly assumed away. */
async function airVerdictHtml(){
  if (boardClock() == null || !state.airport) return "";
  const slot = document.querySelector("#howto .nextdep");
  if (!slot) return "";
  const a = state.airport;
  const fmt = mm => String(Math.floor((mm % 1440) / 60)).padStart(2, "0") + ":" +
                    String(mm % 60).padStart(2, "0");
  let rows = null;
  try{ rows = await departuresFrom(slot.dataset.rw, slot.dataset.from, slot.dataset.next, state.boardAt); }
  catch(e){}
  const head = (cls, title, body, extra) =>
    '<div class="airverdict ' + cls + '"><h3>' + esc(title) + "</h3>" +
    '<p>' + esc(t("airBoard", { time: fmt(state.boardAt), landed: a.landed, buffer: a.buffer })) + "</p>" +
    (extra || "") +
    '<p>' + esc(body) + "</p>" +
    '<div class="assume">' + esc(t("airAssume", { buffer: a.buffer })) + "</div></div>";

  if (!rows || !rows.all || !rows.all.length) return head("miss", t("airMissTitle"), t("airNoData"));
  const left = rows.rows.length;
  const lastText = rows.lastOfDay ? rows.lastOfDay.text : "";
  if (!left)
    return head("miss", t("airMissTitle"),
                lastText ? t("airGone", { last: lastText }) : t("airNoData"));
  const dep = rows.rows[0];
  /* A train three hours away is not a train you are catching tonight; it is
     tomorrow's first one, and calling it 「間に合います」 would send someone to a
     platform to sit until dawn. Anything past an hour and a half is reported as
     "not tonight", with the time it does start. */
  const WAIT_MAX = 90;
  if (dep.at - serviceMin(state.boardAt) > WAIT_MAX)
    return head("miss", t("airMissTitle"),
                t("airNextIs", { time: dep.text, last: lastText || dep.text }));
  const destName = dep.dest ? stationLabel(dep.dest) : "";
  const caught =
    '<div class="catch"><b>' + esc(dep.text) + "</b><span>" +
      esc(t("airCatch")) + (destName ? " · " + esc(t("airCatchDest", { dest: destName })) : "") +
    "</span></div>";
  return left === 1
    ? head("tight", t("airTightTitle"), t("airOnlyOne"), caught)
    : head("ok", t("airOkTitle"),
           t("airLeftTonight", { n: left - 1, last: lastText || dep.text }), caught);
}
/* the station id in a timetable row, said the way the rest of the app says it */
function stationLabel(id){
  const idx = cache.stationIndex || [];
  const rec = idx.find(x => x["owl:sameAs"] === id);
  return rec ? titleOf(rec["odpt:stationTitle"], rec["dc:title"] || humanizeId(id)) : humanizeId(id);
}

/* ------------------------- something to hand over ---------------------- */
/* Which lines this card should talk about. On page 2 that is whatever is
   disrupted around the reader; on page 4 it is whatever is disrupted on the
   trip they asked about. Both are lists this app already keeps. */
function staffLines(scope){
  const seen = new Set(), out = [];
  const add = rid => {
    if (!rid || seen.has(rid)) return;
    const l = lineInfo(rid);
    /* "alert" only. A line whose operator publishes nothing is "unknown", and
       there is nothing to hand across a counter about it. */
    if (!l || l.status !== "alert" || !l.info) return;
    seen.add(rid); out.push({ rid, info: l.info });
  };
  if (scope === "trip"){
    /* the lines serving either end of the trip that was judged — the same set
       the verdict is built from, so the card never names a line the reader was
       not just told about */
    if (state.originMatch) state.originMatch.railways.forEach(add);
    if (state.destMatch)   state.destMatch.railways.forEach(add);
  }
  /* Page 2 has no trip, and a trip whose own lines are all running can still
     sit in the middle of a mess worth asking about. Either way, what is
     disrupted around the reader belongs on the card. */
  (state.lines || []).forEach(l => add(l.railwayId));
  return out;
}

/* Everything on the card has to be in Japanese, including the names. The first
   version read 「いま Tokyo にいます。」 and 「Chuo Rapid Line」 to an English
   reader — correct for them and useless to the person being shown it, which is
   the whole audience. titleOf answers in the reader's language, so these two
   ask for the Japanese title directly. */
const jaTitle = (title, fb) => (title && title.ja) || fb || "";
function jaStationName(text){
  if (!text) return "";
  const idx = cache.stationIndex;
  const m = idx ? matchStations(text, idx) : null;
  const st = m && (m.stations || [])[0];
  return jaTitle(st && st["odpt:stationTitle"], (st && st["dc:title"]) || text);
}

/* The card is Japanese on purpose — the reader is not the audience for it. */
function staffCardHtml(scope){
  const lines = staffLines(scope);
  const from = jaStationName(($("#routeFrom").value || "").trim());
  const to   = scope === "trip" ? jaStationName(($("#routeTo").value || "").trim()) : "";
  /* 「いま東京にいます」 is a strange thing to say to someone who is standing in
     東京駅 and can see you — and without 駅 on the end it reads as the city
     rather than the station. Where you are is not something to say out loud
     here; it is a fact, and it goes below as a label with the 駅 that makes it
     unambiguous. What is worth saying is where you are trying to get to. */
  const ask =
    '<p class="staff-ask">' + esc(t("staffAsk")) + "</p>" +
    '<p class="staff-trip">' + esc(to ? t("staffTo", { to: to }) : t("staffToNo")) + "</p>" +
    (from ? '<p class="staff-where">' +
        esc(to ? t("staffWhereTrip", { from: from, to: to })
               : t("staffWhereFrom", { from: from })) + "</p>" : "");
  const body = lines.length
    ? lines.map(l => {
        const rw = cache.railwayById.get(l.rid) || {};
        const nm = jaTitle(rw["odpt:railwayTitle"], humanizeId(l.rid));
        /* the operator's own Japanese, not our reading of it */
        const st = (l.info && l.info.statusJa) || "";
        const ja = (l.info && l.info.text) || "";
        return '<div class="staff-line"><h4>' + esc(nm) + "</h4>" +
               (st ? '<p class="st">' + esc(st) + "</p>" : "") +
               (ja ? '<p class="orig">' + esc(ja) + "</p>" : "") + "</div>";
      }).join("")
    : '<div class="staff-line"><p class="orig">' + esc(t("staffNone")) + "</p></div>";
  return '<div class="staffcard">' +
      '<p class="staff-gloss">' + esc(t("staffGloss")) + "</p>" +
      ask + body +
      '<p class="staff-when">' + esc(fmtTime(new Date().toISOString())) + "</p>" +
    "</div>";
}

/* ---------------------- one-tap places (quick list) -------------------- */
/* The places saved in the Android settings screen come first: those are the
   user's own, and the built-in samples are only a starting point for someone
   who has not saved any yet. In a plain browser there is no bridge, so the
   samples are all there is. */
let quickPlaces = [];
function savedPlaces(){
  try{
    if (!window.AndroidApp || !window.AndroidApp.getSavedPlaces) return [];
    const raw = JSON.parse(window.AndroidApp.getSavedPlaces() || "[]");
    if (!Array.isArray(raw)) return [];
    return raw
      .filter(p => p && p.name && isFinite(+p.lat) && isFinite(+p.lon))
      .map(p => ({ name:String(p.name), lat:+p.lat, lon:+p.lon, saved:true }));
  }catch(e){ return []; }
}
function renderQuickList(){
  const saved = savedPlaces();
  /* 池袋 saved and 池袋駅 built in are the same shortcut twice */
  const taken = new Set(saved.map(p => normName(p.name)));
  const samples = SAMPLE_PLACES
    .map(p => ({ name:p.name[LANG] || p.name.en, st:p.st, lat:p.lat, lon:p.lon, saved:false }))
    .filter(p => !taken.has(normName(p.name)));

  quickPlaces = saved.concat(samples);
  $("#manualQuickList").innerHTML = quickPlaces.map((p,i) =>
    '<button type="button" class="chip quick' + (p.saved ? " saved" : "") + '" data-i="' + i + '">' +
      (p.saved ? "📍 " : "") + esc(p.name) + "</button>").join("");
}
/* the settings screen can add or remove places while this page stays loaded */
/* Point the eye at the judge button, once. Restarting the animation needs the
   class dropped for a frame; requestAnimationFrame re-adds it after the reflow
   from offsetWidth. Fired only when a destination was just picked — typing
   fires per keystroke, which would flash on every letter, so callers are the
   deliberate picks (suggestion and favourite; a notification tap judges
   directly, so it needs no nudge), not the input event. */
/* ======================= one question per screen =======================

   Six pages over the same DOM. Nothing is re-created and nothing is re-fetched
   when the page changes; the sections that were always here are simply shown
   one at a time. The window still does the scrolling, which is why every
   measurement the app already makes goes on working unchanged.

   There are no page dots. A dot says a number; the bar below says where it
   goes — the origin returns to the first page, the destination to the page
   where it is typed — so getting back is one tap from anywhere, and the depth
   of the flow stops mattering. */
const STEP_MAX = 6;
let step = 1;
let stepPushes = 0;          // how deep our own history is, so home can undo it

/* A page nobody can answer yet is not a page. */
function stepReady(n){
  if (n <= 1) return true;
  /* Page 2 used to need an answer before it would open, which was right while
     the only way in was a button pressed after the scan. 現在地 now goes
     straight there and the page shows the station it is asking about while the
     reply is still out, so "the scan is running" is a state this page is
     allowed to be in. Read from the waiting block itself rather than a second
     flag: the guard then agrees with what the reader can see, and cannot
     disagree with it later. */
  if (n === 2){
    const w = $("#scanWait");
    return !!(state.lines && state.lines.length) ||
           !!(w && !w.classList.contains("hidden"));
  }
  if (n === 3) return true;
  const out = $("#routeResult");
  return !!(out && out.innerHTML);
}
function goStep(n, opts){
  opts = opts || {};
  n = Math.max(1, Math.min(STEP_MAX, n));
  if (!opts.force && !stepReady(n)) return;
  const moved = n !== step;
  step = n;
  document.body.setAttribute("data-step", String(n));
  $$(".page").forEach(el => el.classList.toggle("show", el.id === "page" + n));
  let any = false;
  $$("#bottomBar .bb").forEach(el => {
    const on = el.getAttribute("data-for") === String(n);
    el.classList.toggle("on", on);
    if (on) any = true;
  });
  $("#bottomBar").classList.toggle("hidden", !any);
  syncActions();
  syncBarSpace();
  updateTripBar();
  /* the answer is here, so the notice that it changed has done its job */
  if (n === 2) hideUpdateChip();
  /* A section opens when its page is opened, not before — opening the
     share-cycle one is what downloads the ports, and that should cost nothing
     to whoever never goes looking for a bicycle. */
  if (n === 4) setFold("#sectStations", true);
  if (n === 5) setFold("#sectBike", true);
  if (n === 6){ setFold("#sectBusStops", true); setFold("#sectBusRunning", true); }
  if (moved){
    window.scrollTo(0, 0);
    if (!opts.fromHistory){
      try{ history.pushState({ step:n }, ""); stepPushes++; }catch(e){}
    }
  }
}
function stepBack(){
  if (step <= 1) return;
  if (stepPushes > 0){ try{ history.back(); return; }catch(e){} }
  goStep(step - 1, { force:true });
}
/* Android の戻るキーが呼ぶ。**WebView の履歴に頼らない。**

   ページの移動は history.pushState で積んでいるが、この画面は
   file:///android_asset/index.html から読まれる。**file:// は origin が null 扱いで、
   WebView のバージョンによっては pushState が SecurityError を投げる。** 投げても
   try/catch で握り潰されるので、履歴が積まれないまま誰も気づかない。

   その結果、同じアプリが端末によって違う動きをした — 積まれた端末は戻るキーで
   1ページ目に戻り、積まれなかった端末は canGoBack() が false になって**アプリが終了した**。

   なので戻るキーは Java 側から直接ここに聞く。真を返したらこちらで処理ずみ、
   偽なら本当に終わってよい、という意味。stepBack() は pushState が効いていない
   ときも goStep で戻れる。 */
window.tdrBack = function(){
  try{
    if (bigMap){ closeBigMap(true); return true; }
    if (step > 1){ stepBack(); return true; }
  }catch(e){}
  return false;
};
/* Home unwinds the whole stack rather than adding to it: otherwise the phone's
   back key would still have five entries to chew through before it could leave
   the app, which is the thing this design set out to avoid.

   But the unwinding must not be what decides whether the button worked.
   `history.go(-k)` is asynchronous and the browser is free to ignore it — if k
   is further back than the stack really goes, nothing happens at all: no
   navigation, no popstate, and a button that did nothing. So the page changes
   first, synchronously, and the history is tidied afterwards. If the tidying
   silently fails, the reader is still home; only the back key is left with a
   few entries to chew through, which is a smaller loss than a dead button. */
let goingHome = false, goingHomeTimer = 0;
function goHome(){
  if (bigMap) closeBigMap(true);          // the map is a layer, not a page
  const k = stepPushes;
  stepPushes = 0;
  /* fromHistory, because this is the opposite of a new entry: going home is
     the unwinding itself. Pushing one here made the stack a step deeper than
     the count said, so `go(-k)` landed one short — and two quick taps landed
     on page 2. */
  goStep(1, { force:true, fromHistory:true });
  if (k <= 0) return;
  goingHome = true;
  clearTimeout(goingHomeTimer);
  /* if the pop never arrives, stop swallowing the next real one */
  goingHomeTimer = setTimeout(() => { goingHome = false; }, 700);
  try{ history.go(-k); }catch(e){ goingHome = false; }
}
/* The keyboard closing does not always blur the field — Android's back key
   dismisses it and the caret stays where it was. So the room on screen is what
   is watched, not focus: when it comes back, the keyboard has gone. */
/* seeded with the height before any keyboard has been near it, or the first
   resize would be the keyboard opening and that height would become the
   reference for "there is room" */
let roomiest = window.visualViewport ? window.visualViewport.height : window.innerHeight;
function keyboardWatch(){
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (vh > roomiest) roomiest = vh;
  if (roomiest && vh >= roomiest - 100) document.body.classList.remove("imefocus");
  syncBarSpace();
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", keyboardWatch);
window.addEventListener("resize", keyboardWatch);

/* A button that will only answer 「入力してください」 is not an action, it is a
   trap with a label on it. Both of the pages that take an input keep theirs
   switched off until there is something for it to act on. */
function syncActions(){
  const scan = $("#scanBtn"), check = $("#checkBtn");
  if (scan && !state.busy)
    scan.disabled = !((($("#routeFrom").value || "").trim()) || state.hereFix);
  if (check)
    check.disabled = !(($("#routeTo").value || "").trim());
}
/* Measured after every change that could alter it: a different page, a
   different language (the labels are not the same length), a rotation. */
function syncBarSpace(){
  const bar = $("#bottomBar");
  const h = (bar && !bar.classList.contains("hidden") && getComputedStyle(bar).display !== "none")
    ? bar.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty("--bar-h", Math.round(h) + "px");
}
function showUpdateChip(){ const c = $("#updateChip"); if (c) c.classList.remove("hidden"); }
function hideUpdateChip(){ const c = $("#updateChip"); if (c) c.classList.add("hidden"); }

/* The bar names the trip and doubles as the way back to either end of it. */

/* MainActivity.onResume: the settings screen may have changed the saved
   places — and the scan interval. Re-arm the timer so a new interval applies
   now rather than at the next manual scan. */
window.refreshQuickList = function(){
